name: Connections C3e accepted pathname AF_UNIX readonly peer limits (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eAcceptedUnixReadOnlyPeerCI.py'
      - 'tests/connections/test_connections_c3e_accepted_unix_readonly_peer.py'
      - '.github/workflows/connections-c3e-accepted-unix-readonly-peer-ci.yml'
      - 'docs/connections-c3e-accepted-unix-readonly-peer-ci.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-accepted-process-peer-still-not-custody:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin existing signed development-ledger fixture dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Validate disposable path, strict socket origin and deny-only broker
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eAcceptedUnixReadOnlyPeerCI.py \
            tests/connections/test_connections_c3e_accepted_unix_readonly_peer.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path("tests/connections/c3e_release_trust/C3eAcceptedUnixReadOnlyPeerCI.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          for forbidden in ("sqlite3.connect(", "subprocess.run(", "Ed25519PrivateKey",
                            '"credentialActionsAllowed": True',
                            '"safeToRetry": True',
                            '"acceptedPeerAuthenticatedAsHost": True'):
              assert forbidden not in src, forbidden
          for required in ("C3eLocalReadOnlyIpcProbe.py",
                           "SO_PEERCRED",
                           'root.parent != Path("/run")',
                           "stat.S_ISSOCK",
                           "os.chmod(path, 0o600",
                           "P.serve_one_ci_only(conn, boundary)",
                           "peer_pid != expected_connecting_pid or peer_uid != expected_uid",
                           '"originalMessageSenderAuthenticated": False',
                           "C3E_ACCEPTED_NO_ENROLLED_SOURCE_OR_PRODUCTION_AUTHORITY"):
              assert required in src, required
          assert "readonly property bool credentialActionsEnabled: false" in broker
          print("C3E_ACCEPTED_SOCKET_CI // KERNEL_PEER_NOT_PROTECTED_CUSTODIAN")
          PY
      - name: 24 accepted AF_UNIX peer, IPC denial and inherited sender FD tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "$(command -v python3)" -B \
            tests/connections/test_connections_c3e_accepted_unix_readonly_peer.py
          echo "C3E_ACCEPTED_SOCKET_READONLY // NO_HOST_OR_SENDER_ENROLLMENT"
      - name: Preserve original C3e peer-credential and protected HOLD regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/test_connections_c3e_custodian_cutover_negative.py
          python3 -B -I tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py
          for test in \
            tests/connections/test_connections_c3e_unix_peer_credentials_negative.py \
            tests/connections/test_connections_c3e_local_readonly_ipc.py \
            tests/connections/test_connections_c3e_storage_independent_trust_boundary.py \
            tests/connections/test_connections_c3e_local_process_sigkill_recovery.py
          do
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              "$(command -v python3)" -B "$test"
          done
          echo "C3E_ACCEPTED_SOCKET_UNTRUSTED // PRODUCTION_HOLD"
