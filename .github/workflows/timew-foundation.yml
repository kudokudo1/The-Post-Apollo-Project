name: TimeW foundation source contracts

on:
  pull_request:
    paths:
      - "widgets/TimeW.qml"
      - "docs/timew-machine-checkpoint-contract.md"
      - "widgets/TimeZonePicker.qml"
      - "services/time/WorldClockPolicy.js"
      - "services/time/TimeZoneConverter.py"
      - "services/time/TimeArithmetic.py"
      - "services/time/TimeDifference.py"
      - "services/time/StopwatchPolicy.js"
      - "services/time/CountdownPolicy.js"
      - "services/time/MachineTimelinePolicy.js"
      - "services/time/MachineSelectionPolicy.js"
      - "services/time/MachineLayoutDiffPolicy.js"
      - "services/time/MachineRestorePreviewPolicy.js"
      - "services/time/MachineWindowResolver.py"
      - "services/time/MachineWindowMultiplicity.py"
      - "services/time/MachineSessionIdentityV2.py"
      - "docs/timew-machine-m2b-v2-session-identity-sidecar.md"
      - "docs/timew-machine-revive-restore-worker-plan.md"
      - "services/time/MachineWindowMovePilot.py"
      - "services/time/MachineMoveJournal.py"
      - "services/time/MachineMoveApproval.py"
      - "services/time/MachineMoveReconciliation.py"
      - "services/time/MachineMoveReviewRead.py"
      - "services/time/MachineMoveConfirmRead.py"
      - "docs/timew-machine-m1p-confirmation-rehearsal.md"
      - "docs/timew-machine-m1o-readonly-recovery-menu.md"
      - "docs/timew-machine-m1n-scoped-recovery-approval.md"
      - "docs/timew-machine-m1l-durable-move-journal.md"
      - "docs/timew-machine-m1k-single-window-pilot.md"
      - "services/time/MachineCheckpointStore.py"
      - "services/time/MachineCheckpointModel.py"
      - "services/time/MachineSwayRead.py"
      - "services/time/TimeConverterFormat.js"
      - "services/time/WorldZoneSearch.js"
      - "timew_click_preview.qml"
      - "modules/Clock.qml"
      - "shell.qml"
      - "tests/timew/**"
      - ".github/workflows/timew-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "widgets/TimeW.qml"
      - "docs/timew-machine-checkpoint-contract.md"
      - "widgets/TimeZonePicker.qml"
      - "services/time/WorldClockPolicy.js"
      - "services/time/TimeZoneConverter.py"
      - "services/time/TimeArithmetic.py"
      - "services/time/TimeDifference.py"
      - "services/time/StopwatchPolicy.js"
      - "services/time/CountdownPolicy.js"
      - "services/time/MachineTimelinePolicy.js"
      - "services/time/MachineSelectionPolicy.js"
      - "services/time/MachineLayoutDiffPolicy.js"
      - "services/time/MachineRestorePreviewPolicy.js"
      - "services/time/MachineWindowResolver.py"
      - "services/time/MachineWindowMultiplicity.py"
      - "services/time/MachineSessionIdentityV2.py"
      - "docs/timew-machine-m2b-v2-session-identity-sidecar.md"
      - "docs/timew-machine-revive-restore-worker-plan.md"
      - "services/time/MachineWindowMovePilot.py"
      - "services/time/MachineMoveJournal.py"
      - "services/time/MachineMoveApproval.py"
      - "services/time/MachineMoveReconciliation.py"
      - "services/time/MachineMoveReviewRead.py"
      - "services/time/MachineMoveConfirmRead.py"
      - "docs/timew-machine-m1p-confirmation-rehearsal.md"
      - "docs/timew-machine-m1o-readonly-recovery-menu.md"
      - "docs/timew-machine-m1n-scoped-recovery-approval.md"
      - "docs/timew-machine-m1l-durable-move-journal.md"
      - "docs/timew-machine-m1k-single-window-pilot.md"
      - "services/time/MachineCheckpointStore.py"
      - "services/time/MachineCheckpointModel.py"
      - "services/time/MachineSwayRead.py"
      - "services/time/TimeConverterFormat.js"
      - "services/time/WorldZoneSearch.js"
      - "modules/Clock.qml"
      - "shell.qml"
      - "tests/timew/**"
      - ".github/workflows/timew-foundation.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check TimeW first-milestone source contracts
        run: python3 tests/timew/test_timew_foundation_contracts.py
      - name: Verify world-clock timezone and DST projections
        run: node tests/timew/test_world_clock_policy.cjs
      - name: Verify searchable world-zone catalog
        run: node tests/timew/test_world_zone_search.cjs
      - name: Verify time-zone conversions and DST edge cases
        run: python3 -B -I tests/timew/test_zone_converter.py
      - name: Verify CALC independent 12/24 input and output formatting
        run: node tests/timew/test_time_converter_format.cjs
      - name: Verify elapsed time arithmetic and DST behavior
        run: python3 -B -I tests/timew/test_time_arithmetic.py
      - name: Verify BETWEEN signed durations and time-zone DST edge cases
        run: python3 -B -I tests/timew/test_time_difference.py
      - name: Verify stopwatch accumulation, formatting and bounded laps
        run: node tests/timew/test_stopwatch_policy.cjs
      - name: Verify countdown validation, pause/resume and expiry
        run: node tests/timew/test_countdown_policy.cjs
      - name: Verify MACHINE session marker time policy and bounds
        run: node tests/timew/test_machine_timeline_policy.cjs
      - name: Verify MACHINE isolated metadata preview policy
        run: python3 -B -I tests/timew/test_machine_checkpoint_model.py
      - name: Verify MACHINE Sway read-only adapter fixtures
        run: python3 -B -I tests/timew/test_machine_sway_read.py
      - name: Verify MACHINE interactive read-only preview inspector
        run: python3 -B -I tests/timew/test_machine_preview_inspector.py
      - name: Verify MACHINE memory-only selection controls
        run: python3 -B -I tests/timew/test_machine_selection_ui_contract.py
      - name: Verify MACHINE selection dependencies and conflict scenarios
        run: node tests/timew/test_machine_selection_policy.cjs
      - name: Verify MACHINE validation UI remains read-only
        run: python3 -B -I tests/timew/test_machine_selection_validation_contract.py
      - name: Verify MACHINE private SQLite persistence with temporary database
        run: python3 -B -I tests/timew/test_machine_checkpoint_store.py
      - name: Verify MACHINE explicit save/open UI contracts
        run: python3 -B -I tests/timew/test_machine_checkpoint_store_ui.py
      - name: Verify MACHINE pure saved/current layout comparison
        run: node tests/timew/test_machine_layout_diff.cjs
      - name: Verify MACHINE comparison controls never restore
        run: python3 -B -I tests/timew/test_machine_layout_diff_ui.py
      - name: Verify MACHINE non-executable restore planning fixtures
        run: node tests/timew/test_machine_restore_preview.cjs
      - name: Verify MACHINE restore planning UI stays read-only
        run: python3 -B -I tests/timew/test_machine_restore_preview_ui.py
      - name: Verify MACHINE live unique-window resolution fixtures
        run: python3 -B -I tests/timew/test_machine_window_resolver.py
      - name: Verify MACHINE manual resolver UI never executes recovery
        run: python3 -B -I tests/timew/test_machine_window_resolver_ui.py
      - name: Verify MACHINE 17-Brave and 4-Kitty multiset layout identity inventory
        run: python3 -B -I tests/timew/test_machine_window_multiplicity.py
      - name: Verify MACHINE v1-safe, read-only identity inventory contract
        run: python3 -B -I tests/timew/test_machine_window_multiplicity_contract.py
      - name: Verify MACHINE v2 proposed window and inner-item identity schema
        run: python3 -B -I tests/timew/test_machine_session_identity_v2.py
      - name: Verify MACHINE v2 identity model cannot mutate v1 or activate actions
        run: python3 -B -I tests/timew/test_machine_session_identity_v2_contract.py
      - name: Verify MACHINE durable move journal crash and permissions
        run: python3 -B -I tests/timew/test_machine_move_journal.py
      - name: Verify MACHINE single-use approval and read-only reconciliation
        run: python3 -B -I tests/timew/test_machine_move_approval_reconciliation.py
      - name: Verify MACHINE approval/reconciliation cannot activate from TimeW
        run: python3 -B -I tests/timew/test_machine_move_approval_contract.py
      - name: Verify MACHINE read-only move and interrupted journal UI bridge
        run: python3 -B -I tests/timew/test_machine_move_review_read.py
      - name: Verify MACHINE recovery review UI has no apply/approval paths
        run: python3 -B -I tests/timew/test_machine_move_review_ui.py
      - name: Verify MACHINE exact-phrase dry-run after fresh Sway read
        run: python3 -B -I tests/timew/test_machine_move_confirm_read.py
      - name: Verify MACHINE confirmation UI remains non-operative
        run: python3 -B -I tests/timew/test_machine_move_confirm_ui.py
      - name: Verify MACHINE injected single-window move pilot with synthetic Sway
        run: python3 -B -I tests/timew/test_machine_window_move_pilot.py
      - name: Verify MACHINE move pilot cannot activate from TimeW
        run: python3 -B -I tests/timew/test_machine_window_move_pilot_contract.py
      - name: Verify MACHINE desktop checkpoint draft remains non-operative
        run: python3 -B -I tests/timew/test_machine_checkpoint_contract.py
