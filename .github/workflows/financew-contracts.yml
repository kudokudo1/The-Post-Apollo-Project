      - "services/finance/FinanceFundingWriteService.qml"
      - "services/finance/**"
      - "widgets/FinanceMarketPane.qml"
      - "widgets/FinanceOsirisPane.qml"
      - "widgets/FinanceOsirisWebView.qml"
      - "tests/finance/test_finance_osiris_globe_contracts.py"
      - "scripts/finance/read_polymarket.mjs"
      - "tests/finance/test_polymarket_readonly.mjs"
      - "tests/finance/test_finance_market_contracts.py"
      - "tests/finance/test_finance_budget_ui_contracts.py"
      - "tests/finance/test_finance_transaction_draft_contracts.py"
      - "shell.qml"
      - "tests/components/test_finance_dock_contracts.py"
      - "tests/components/test_finance_navigation_contracts.py"
      - ".github/workflows/financew-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate FinanceW dock and blank portrait menu source
        run: python3 tests/components/test_finance_dock_contracts.py
      - name: Validate FinanceW navigation and reserved slots
        run: python3 tests/components/test_finance_navigation_contracts.py
      - name: Verify FinanceW M0 adaptive chassis and in-process tool host
        run: python3 tests/finance/test_finance_adaptive_chassis_contracts.py
      - name: Verify FinanceW M0 responsive geometry policy
        run: node tests/finance/test_finance_chassis_policy.mjs
      - name: Verify FinanceW Market M1 in-window read-only contracts
        run: python3 tests/finance/test_finance_market_contracts.py
      - name: Test FinanceW Market M1 public-feed normalizer (fictional fixtures)
        run: node tests/finance/test_polymarket_readonly.mjs
      - name: Verify opt-in OSIRIS globe does not affect FinanceW startup
        run: python3 tests/finance/test_finance_osiris_globe_contracts.py
      - name: Verify local read-only FinanceW Budget UI
        run: python3 tests/finance/test_finance_budget_ui_contracts.py
      - name: Verify transaction draft stays non-mutating
        run: python3 tests/finance/test_finance_transaction_draft_contracts.py
      - name: Verify D11 category allocation stays read-only
        run: python3 tests/finance/test_finance_allocation_preview_contracts.py
      - name: Verify D12d guarded allocation confirmation UI
        run: python3 tests/finance/test_finance_allocation_write_ui_contracts.py
      - name: Verify D13 read-only gate check and funding guidance
        run: python3 tests/finance/test_finance_gate_status_contracts.py
      - name: Verify D14 read-only monthly funding review
        run: python3 tests/finance/test_finance_funding_review_contracts.py
      - name: Verify D15 manual historical inspection
        run: python3 tests/finance/test_finance_opening_history_contracts.py
      - name: Verify D16 read-only income categorization preview
        run: python3 tests/finance/test_finance_income_preview_contracts.py
      - name: Verify D17 guided funding setup preview
        run: python3 tests/finance/test_finance_funding_setup_contracts.py
      - name: Verify D17d staged guarded income confirmation UI
        run: python3 tests/finance/test_finance_funding_write_ui_contracts.py
      - name: Verify FinanceW compact spreadsheet budget and add money
        run: python3 tests/finance/test_finance_compact_grid_contracts.py
      - name: Verify FinanceW budget control-center sections
        run: python3 tests/finance/test_finance_control_sections_contracts.py
      - name: Verify category create and rename previews are non-mutating
        run: python3 tests/finance/test_finance_category_preview_contracts.py
      - name: Verify category preview, arm and confirm remain separately gated
        run: python3 tests/finance/test_finance_category_write_ui_contracts.py
      - name: Verify shared FinanceW numeric and calendar input controls
        run: python3 tests/finance/test_finance_input_controls_contracts.py
