name: Git map V2 native candidate
on:
  pull_request:
    paths:
      - "tests/git/test_git_map_v2_native.py"
      - "scripts/git_map_v2_manager_candidate.py"
      - "scripts/git_map_stage_compact_holder.py"
      - "scripts/git_map_compact_holder.c"
      - "widgets/git/GitMapControlHost.qml"
      - "widgets/git/GitMapCustodyController.qml"
      - "widgets/git/GitMapGenerationLease.qml"
      - "widgets/git/GitMapVirtualViewport.qml"
      - "services/git/GitMapPageBridge.qml"
      - "scripts/git_map_isolated_candidate.py"
      - "scripts/git_map_v2_reader_candidate.py"
      - ".github/workflows/git-map-v2-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 coreutils gcc libc6-dev quickshell=0.3.2-1 qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects qml6-module-qtquick-shapes \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtqml
      - uses: actions/checkout@v4
      - name: Native V2 two-host custody and interrupted search
        run: |
          python3 -B tests/git/test_git_map_v2_native.py
          MAP_V2_COMPACT_NATIVE=yes python3 -B tests/git/test_git_map_v2_native.py
          python3 -B tests/git/test_git_map_shared_custody_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
