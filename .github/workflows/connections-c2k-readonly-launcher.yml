name: Connections C2k explicit read-only host launcher

on:
  pull_request:
    paths:
      - "services/connections/ConnectionsHostReadOnlyLauncher.py"
      - "tests/connections/test_connections_c2k_readonly_launcher.py"
      - ".github/workflows/connections-c2k-readonly-launcher.yml"
      - "docs/connections-c2k-readonly-launcher.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-launch-and-shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Explicit process start, socket observation, denial, collision, SIGTERM cleanup
        run: timeout 45s python3 -B tests/connections/test_connections_c2k_readonly_launcher.py
      - name: Prior C2j host/reader and C2i inspector regressions
        run: |
          timeout 35s python3 -B tests/connections/test_connections_c2j_host_status_server.py
          timeout 40s python3 -B tests/connections/test_connections_c2j_fake_host_socket.py
          timeout 35s python3 -B tests/connections/test_connections_c2i_host_inspection.py
      - name: CPU++ broker, review/status projection and no-grant assertions
        run: |
          node tests/cpuplus/test_connections_host_inspection_c2i.js
          node tests/cpuplus/test_connections_status_c2g.js
          node tests/cpuplus/test_connections_broker_c2a.js
      - name: No automatic desktop launch or credential activation
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p = Path("services/connections/ConnectionsHostReadOnlyLauncher.py")
          source = p.read_text()
          tree = ast.parse(source)
          forbidden = {"requests", "httpx", "urllib", "subprocess", "keyring", "dbus", "secretstorage"}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module)
          assert not forbidden.intersection(imports)
          for snippet in ("secret-tool", "POST_APOLLO_FIRMS_MAP_KEY", "shell=True", "systemctl",
                          "Popen(", "AF_INET", "os.system(", "APPROVED", "COMPLETED"):
              assert snippet not in source, snippet
          assert "C2K_REFUSED_NO_APPROVED_RUNTIME_LAUNCH" in source
          assert 'args != [START_FLAG]' in source
          broker = Path("services/connections/ConnectionsBroker.qml").read_text()
          status = Path("services/connections/ConnectionsRequestStatus.qml").read_text()
          assert "readonly property bool credentialActionsEnabled: false" in broker
          assert "readonly property bool hostAuthenticated: false" in status
          assert "readonly property var latestStatus: null" in status
          print("C2K_PASS // EXPLICIT_STATUS_ONLY_LAUNCH_NO_AUTHENTICATION_OR_GRANT")
          PY
