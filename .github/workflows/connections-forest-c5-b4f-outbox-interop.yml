name: Connections Forest C5 vs B4f local outbox (NO AUTHORITY)

on:
  pull_request:
    paths:
      - 'services/connections/forest/ForestC5B4fOutboxComparison.py'
      - 'tests/connections/test_connections_forest_c5_b4f_outbox_comparison.py'
      - 'docs/connections-forest-c5-b4f-outbox-source-boundary.md'
      - '.github/workflows/connections-forest-c5-b4f-outbox-interop.yml'
      - 'scripts/forest/local_terminal_outbox_b4f.py'
      - 'services/connections/forest/ForestC5LocalRecoveryComparison.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-outbox-never-settles-protected-c5:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable Ed25519 fixture dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Compile and assert no writer, signer, model or host actuation in comparator
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            services/connections/forest/ForestC5B4fOutboxComparison.py \
            tests/connections/test_connections_forest_c5_b4f_outbox_comparison.py
          python3 - <<'PY'
          from pathlib import Path
          src = Path('services/connections/forest/ForestC5B4fOutboxComparison.py').read_text()
          for expected in (
              'EXPECTED_EVENT_UNKNOWN_LEGACY_OR_MISSING_HOLD',
              'LOCAL_B4F_EVENT_AND_V1_CLAIM_CONFLICT_HOLD',
              'EVENT_AND_SIGNED_CLAIM_MATCH_BUT_NOT_AUTHENTICATED_HOLD',
              'LOCAL_EVENT_NOT_OBSERVED',
              '"b4fOriginalWriterReleaseAuthenticated": False',
              '"b4fIndependentHistoryAuthenticated": False',
              '"safeActions": []',
              'compare_untrusted_local_with_v1_claim(',
          ):
              assert expected in src, expected
          for forbidden in (
              'sqlite3.connect(', 'subprocess.', 'socket.',
              'Ed25519PrivateKey', 'model.generate(', 'os.system(',
              '"safeToRetryInference": True',
              '"safeToReleaseRevocation": True',
              '"productionAuthority": True',
              '"b4fIndependentHistoryAuthenticated": True',
          ):
              assert forbidden not in src, forbidden
          for path in (
              'scripts/forest/local_terminal_outbox_b4f.py',
              'scripts/forest/turn_bridge_b3.py',
              'scripts/forest/host_admission_b4a.py',
          ):
              assert 'ForestC5B4fOutboxComparison' not in Path(path).read_text()
          print('DOC3_B4F_SOURCE_ONLY // NEVER_PROTECT_LOCAL_SQLITE_OUTBOX')
          PY
      - name: Twenty actual disposable B4f/C5 original-outbox adversarial tests
        run: |
          set -euo pipefail
          python3 -B -I -m unittest discover -s tests/connections \
            -p 'test_connections_forest_c5_b4f_outbox_comparison.py' -v
      - name: Preserve Forest B4f, B4e and B4d regressions
        run: |
          set -euo pipefail
          python3 -B -I -m unittest discover -s tests/forest \
            -p 'test_local_terminal_outbox_b4f.py' -v
          python3 -B -I -m unittest discover -s tests/forest \
            -p 'test_recovery_lineage_b4e.py' -v
          python3 -B -I -m unittest discover -s tests/forest \
            -p 'test_recovery_inspect_b4d.py' -v
      - name: Preserve existing DOC3 V1 and B4e recovery denial plus B4c held-permit consumer
        run: |
          set -euo pipefail
          python3 -B -I -m unittest discover -s tests/connections \
            -p 'test_connections_forest_c5_exact_session_v1_preflight.py' -v
          python3 -B -I -m unittest discover -s tests/connections \
            -p 'test_connections_forest_c5_b4e_local_recovery_interop.py' -v
          python3 -B -I -m unittest discover -s tests/forest \
            -p 'test_fenced_commit_b4c.py' -v
          echo 'FOREST_B4F_OUTBOX_IS_LOCAL_NOT_C5_SETTLEMENT // PRODUCTION_HOLD'
