name: Weather COSMOS C38 PLANETS civil-day migration
on:
  pull_request:
    paths:
      - 'widgets/weather/StationCosmosModesPane.qml'
      - 'widgets/weather/StationCosmosPlanetsDayPane.qml'
      - 'tests/weather/test_cosmos_c38_planets_day.js'
      - 'tests/weather/fixtures/C38PlanetsDayNativeShell.qml'
      - '.github/workflows/weather-cosmos-c38-planets-day.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check C38 source switching, source truth and existing C5/C6/V2b contracts
        run: |
          node --test \
            tests/weather/test_cosmos_c38_planets_day.js \
            tests/weather/test_cosmos_c5_empty_repair.js \
            tests/weather/test_cosmos_c6_details.js \
            tests/weather/test_cosmos_planet_event_clock_v2b.js
  native-viewport:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable Quickshell and Qt QML
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git quickshell qt6-qpa-plugins \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects \
            coreutils findutils
      - uses: actions/checkout@v4
      - name: Verify native five-lane interactive timeline in a clipped compact stage
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/cosmos-c38.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp "$root/tests/weather/fixtures/C38PlanetsDayNativeShell.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 32s \
            env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            quickshell --no-color -p "$work/config/shell.qml" \
            > "$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "C38_NATIVE_PASS // FIVE_DATED_LANES_ZOOM_FILTER_INSPECT" "$work/native.log"
          if grep -E 'C38_NATIVE_FAIL|Failed to load configuration|ReferenceError|TypeError' "$work/native.log"; then
            exit 1
          fi
