name: FinanceW Market M26-M30 historical range analyses and pin comparisons

on:
  pull_request:
    paths:
      - "widgets/FinanceStockHistoryPane.qml"
      - "widgets/FinanceStockRangeAnalysisPolicy.js"
      - "tests/finance/test_market_m26_range_analysis.mjs"
      - "tests/finance/test_market_m28_moving_averages.mjs"
      - "tests/finance/test_market_m29_sma_relationship.mjs"
      - "tests/finance/test_market_m30_two_point_compare.mjs"
      - "tests/finance/test_market_price_range.mjs"
      - "scripts/finance/MARKET_M26_RANGE_ANALYSIS_README.md"
      - "scripts/finance/MARKET_M27_SELECTED_CLOSE_COMPARISON_README.md"
      - "scripts/finance/MARKET_M28_SMA_OVERLAYS_README.md"
      - "scripts/finance/MARKET_M29_SMA_RELATIONSHIP_README.md"
      - "scripts/finance/MARKET_M30_TWO_POINT_COMPARE_README.md"
      - ".github/workflows/financew-market-m26-range-analysis.yml"
  push:
    branches: [main]
    paths:
      - "widgets/FinanceStockHistoryPane.qml"
      - "widgets/FinanceStockRangeAnalysisPolicy.js"
      - "tests/finance/test_market_m26_range_analysis.mjs"
      - "tests/finance/test_market_m28_moving_averages.mjs"
      - "tests/finance/test_market_m29_sma_relationship.mjs"
      - "tests/finance/test_market_m30_two_point_compare.mjs"
      - "tests/finance/test_market_price_range.mjs"
      - "scripts/finance/MARKET_M26_RANGE_ANALYSIS_README.md"
      - "scripts/finance/MARKET_M27_SELECTED_CLOSE_COMPARISON_README.md"
      - "scripts/finance/MARKET_M28_SMA_OVERLAYS_README.md"
      - "scripts/finance/MARKET_M29_SMA_RELATIONSHIP_README.md"
      - "scripts/finance/MARKET_M30_TWO_POINT_COMPARE_README.md"
      - ".github/workflows/financew-market-m26-range-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loaded-range-analysis:
    name: Loaded historical range, SMA and two-point comparison; no provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure Market M26-M27 range movement/selected compare and malformed data
        run: node tests/finance/test_market_m26_range_analysis.mjs
      - name: Existing M10-M30 Market price-range regression chain
        run: node tests/finance/test_market_price_range.mjs
