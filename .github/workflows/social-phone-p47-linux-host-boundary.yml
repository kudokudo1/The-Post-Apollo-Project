name: Social PHONE P47 Real Linux Socket Boundary (Status Only)

on:
  pull_request:
    paths:
      - 'services/phone/PhonePersonalHostSocketP47.py'
      - 'tests/phone/test_phone_personal_host_socket_p47.py'
      - 'MODEL/contracts/social-phone-p47-real-linux-host-boundary-v0.md'
      - '.github/workflows/social-phone-p47-linux-host-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'services/phone/PhonePersonalHostSocketP47.py'
      - 'tests/phone/test_phone_personal_host_socket_p47.py'
      - 'MODEL/contracts/social-phone-p47-real-linux-host-boundary-v0.md'
      - '.github/workflows/social-phone-p47-linux-host-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-linux-peer-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile real Linux socket service
        run: python -m py_compile services/phone/PhonePersonalHostSocketP47.py
      - name: Real AF_UNIX SO_PEERCRED owner-only socket, status refusal, timeout
        run: python -m unittest discover -s tests/phone -p 'test_phone_personal_host_socket_p47.py' -v
      - name: Guard P45 and P46 actual upstream mainline reconciliation
        run: python -m unittest discover -s tests/messaging -p 'test_social_phone_mainline_completeness_p45.py' -v
      - name: Actual disabled Social SAVE and mounted draft source regression
        run: |
          python -m unittest discover -s tests/messaging -p 'test_social_phone_personal_draft_shell_p42.py' -v
          python -m unittest discover -s tests/messaging -p 'test_social_phone_transaction_review_p44.py' -v
          python -m unittest discover -s tests/messaging -p 'test_social_phone_contact_metadata_locked_p40.py' -v
