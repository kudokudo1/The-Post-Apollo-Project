      - 'tests/finance/test_banking_session_journal_m4e.mjs'
      - 'tests/finance/test_banking_session_journal_m4e_contracts.py'
      - 'widgets/FinanceBankingOfficialHandoff.qml'
      - 'widgets/FinanceBankingOfficialHandoffPolicy.js'
      - 'tests/finance/test_banking_official_handoff_m4d.mjs'
      - 'tests/finance/test_banking_official_handoff_m4d_contracts.py'
      - 'tests/finance/test_banking_provider_m4.mjs'
      - 'tests/finance/test_banking_provider_m4_contracts.py'
      - 'tests/finance/test_banking_provider_m4b.mjs'
