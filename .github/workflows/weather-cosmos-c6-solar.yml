name: Weather COSMOS C6 focused SUN parity

on:
  pull_request:
    paths:
      - 'widgets/weather/StationCosmosSunInstrumentPane.qml'
      - 'widgets/weather/StationCosmosSolarDetailPolicy.js'
      - 'tests/weather/test_cosmos_c6_solar.js'
      - 'tests/weather/fixtures/C6SolarNativeShell.qml'
      - '.github/workflows/weather-cosmos-c6-solar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-exact NOAA model projections
        run: node --test tests/weather/test_cosmos_c6_solar.js

  native-sun:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable native Quickshell
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git quickshell qt6-qpa-plugins \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects \
            coreutils findutils
          quickshell --version
      - uses: actions/checkout@v4
      - name: Check rendered GOES X-ray, flare and solar cycle source modes
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/cosmos-c6-solar.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets" "$work/config/services" "$work/config/scripts"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services/." "$work/config/services/"
          cp -a "$root/scripts/weather" "$work/config/scripts/weather"
          cp "$root/tests/weather/fixtures/C6SolarNativeShell.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 20s env \
            HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen \
            quickshell --no-color -p "$work/config/shell.qml" \
            >"$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          if [ "$rc" -ne 0 ] \
             || ! grep -F "C6_SOLAR_PASS // GOES_XRAY_SOURCE FLARE_EVENTS CYCLE_RANGES_OUTLOOK" "$work/native.log" >/dev/null \
             || grep -F "C6_SOLAR_FAIL" "$work/native.log" >/dev/null \
             || grep -F "Failed to load configuration" "$work/native.log" >/dev/null \
             || grep -E "StationCosmosSunInstrumentPane.qml.*(TypeError|ReferenceError|Unable to assign)" "$work/native.log" >/dev/null; then
            echo "C6_SOLAR_FAIL // process_exit=$rc" >&2
            exit 1
          fi
          echo "C6_SOLAR_PASS // RENDERED_NOAA_DETAIL"
