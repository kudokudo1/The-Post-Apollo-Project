name: Connections C3e local read-only IPC process boundary (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eLocalReadOnlyIpcProbe.py'
      - 'tests/connections/test_connections_c3e_local_readonly_ipc.py'
      - '.github/workflows/connections-c3e-local-readonly-ipc-ci.yml'
      - 'docs/connections-c3e-local-readonly-ipc-ci.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-readonly-one-shot-ipc:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin existing C3e CI signature dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Static source denies network listener and production actions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eLocalReadOnlyIpcProbe.py \
            tests/connections/test_connections_c3e_local_readonly_ipc.py
          python3 - <<'PY'
          from pathlib import Path
          code=Path("tests/connections/c3e_release_trust/C3eLocalReadOnlyIpcProbe.py").read_text()
          tests=Path("tests/connections/test_connections_c3e_local_readonly_ipc.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          for forbidden in ("socket.bind(", "socket.listen(", "socket.accept(",
                            "socket.socket(socket.AF_INET", "sqlite3.connect(",
                            "Ed25519PrivateKey", '"productionAuthority": True',
                            '"credentialActionsEnabled": True'):
              assert forbidden not in code, forbidden
          for required in ("C3eStorageIndependentTrustBoundary.py",
                           "serve_one_ci_only(", "boundary.protected_required_status()",
                           "C3E_IPC_NO_REAL_SIGNIN_OR_PROTECTED_AUTHORITY",
                           '"CUSTODIAN_STATUS"', "MAX_FRAME = 4096"):
              assert required in code, required
          assert 'multiprocessing.get_context("fork")' in tests
          assert "readonly property bool credentialActionsEnabled: false" in broker
          print("C3E_IPC_CI_ONLY // NO_NATIVE_LISTENER_OR_CREDENTIAL_ACTIONS")
          PY
      - name: Run 46 malicious real AF_UNIX forked-process tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "$(command -v python3)" -B \
            tests/connections/test_connections_c3e_local_readonly_ipc.py
          echo "C3E_IPC_DEV_DIAGNOSTIC_PASS // NEVER_PRODUCTION_AUTHORITY"
      - name: Preserve cutover, interface, local ledger and signer regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/test_connections_c3e_custodian_cutover_negative.py
          for test in \
            tests/connections/test_connections_c3e_storage_independent_trust_boundary.py \
            tests/connections/test_connections_c3e_local_development_history_ledger.py \
            tests/connections/test_connections_c3e_operator_witness_history_continuity.py \
            tests/connections/test_connections_c3e_operator_witness_enrollment_preflight.py \
            tests/connections/test_connections_c3eaf_signed_role_enrollment.py \
            tests/connections/test_connections_c3ez_release_bound_host_evidence.py
          do
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              "$(command -v python3)" -B "$test"
          done
          echo "C3E_IPC_HOLD // TEST_ONLY_PROCESS_NO_REAL_TRUST"
