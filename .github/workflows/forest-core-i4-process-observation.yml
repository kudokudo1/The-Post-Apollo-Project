name: Forest Core I4 Passive Process Observation CI
on:
  pull_request:
    paths:
      - 'scripts/forest/process_observation_i4.py'
      - 'scripts/forest/PROCESS_OBSERVATION_I4.md'
      - 'tests/forest/test_process_observation_i4.py'
      - 'scripts/forest/performance_snapshot_p0.py'
      - 'scripts/forest/performance_capacity_p2c.py'
      - 'scripts/forest/model_binding_i2.py'
      - 'scripts/forest/resource_governor_p1.py'
      - '.github/workflows/forest-core-i4-process-observation.yml'
permissions:
  contents: read
jobs:
  process-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_process_observation_i4.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_performance_snapshot_p0.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_performance_capacity_p2c.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_model_binding_i2.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_resource_governor_p1.py' -v
      - run: python3 -m py_compile scripts/forest/process_observation_i4.py tests/forest/test_process_observation_i4.py
