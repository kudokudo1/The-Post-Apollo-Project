name: CPU++ native util-linux custody fixture source gate
on:
  pull_request:
    paths:
      - 'tests/cpuplus_memory_kernel_ci/**'
      - '.github/workflows/cpuplus-memory-kernel-source.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decode bounded syscall evidence without tracing or mutating
        run: |
          python3 -B -m py_compile tests/cpuplus_memory_kernel_ci/guest-kernel-custody.py
          python3 -B tests/cpuplus_memory_kernel_ci/test_syscall_evidence.py
      - name: Refuse outside disposable guest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/post-apollo-memory-add-swap)" = eec7a83cc9068303c3fbc6f4ae9c98e78f7b67ad
          set +e
          output="$(python3 -I -B tests/cpuplus_memory_kernel_ci/guest-kernel-custody.py 2>&1)"
          rc="$?"
          set -e
          test "$rc" = 2
          grep -Fq 'CPU_MEM_KERNEL_FAIL // RuntimeError: not a root Silverblue guest' <<<"$output"
