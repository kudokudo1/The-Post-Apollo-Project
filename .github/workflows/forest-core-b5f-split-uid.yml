name: Forest Core B5f Split UID Installed Host CI
on:
  pull_request:
    paths:
      - 'tests/forest/native_ci/test_split_uid_host_b5f.py'
      - 'tests/forest/native_ci/verify_split_uid_host_b5f.sh'
      - 'scripts/forest/SPLIT_UID_HOST_B5F.md'
      - '.github/workflows/forest-core-b5f-split-uid.yml'
      - 'scripts/forest/native_host_candidate_b5b.py'
      - 'scripts/forest/session_journal_v0.py'
permissions:
  contents: read
jobs:
  installed-split-uid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact B5c host
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum scripts/forest/native_host_candidate_b5b.py | cut -d ' ' -f1)"
          mkdir "$RUNNER_TEMP/forest-b5f"
          printf '%s\n' "$expected" > "$RUNNER_TEMP/forest-b5f.sha"
          docker run --rm -e GITHUB_ACTIONS=true -e EXPECTED_SOURCE_SHA="$expected" \
            -v "$PWD:/source:ro" -v "$RUNNER_TEMP/forest-b5f:/out" \
            fedora:44 bash /source/tests/forest/native_ci/build_forest_host_ci.sh
      - name: Run split UID installed host and storage experiment
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/forest-b5f.sha")"
          docker run --rm -e GITHUB_ACTIONS=true -e EXPECTED_SOURCE_SHA="$expected" \
            -v "$RUNNER_TEMP/forest-b5f:/input:ro" \
            -v "$PWD/tests/forest/native_ci:/ci:ro" \
            -v "$PWD/scripts/forest/session_journal_v0.py:/b1/session_journal_v0.py:ro" \
            fedora:44 bash /ci/verify_split_uid_host_b5f.sh
  inherited:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: B5b socket regression
        run: python3 -B -m unittest discover -s tests/forest -p 'test_native_host_candidate_b5b.py' -v
      - name: B5a fixture regression
        run: python3 -B -m unittest discover -s tests/forest -p 'test_host_boundary_fixture_b5a.py' -v
      - name: B1 journal regression
        run: python3 -B -m unittest discover -s tests/forest -p 'test_session_journal_v0.py' -v
