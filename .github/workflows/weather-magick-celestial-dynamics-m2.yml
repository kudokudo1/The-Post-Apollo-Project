name: MAGICK M2 celestial dynamics

on:
  pull_request:
    paths:
      - 'scripts/weather/celestial_dynamics.py'
      - 'tests/weather/test_celestial_dynamics_m2.py'
      - '.github/workflows/weather-magick-celestial-dynamics-m2.yml'
      - 'scripts/weather/celestial_solver.py'
      - 'scripts/weather/celestial_contract.py'
  push:
    paths:
      - 'scripts/weather/celestial_dynamics.py'
      - 'tests/weather/test_celestial_dynamics_m2.py'
      - '.github/workflows/weather-magick-celestial-dynamics-m2.yml'
      - 'scripts/weather/celestial_solver.py'
      - 'scripts/weather/celestial_contract.py'
  workflow_dispatch:

jobs:
  offline-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify M0 M1 and M2 isolated contracts
        run: |
          python3 -m unittest discover -s tests/weather -p 'test_celestial_contract_m0.py' -v
          python3 -m unittest discover -s tests/weather -p 'test_celestial_solver_m1.py' -v
          python3 -m unittest discover -s tests/weather -p 'test_celestial_dynamics_m2.py' -v

  jpl-dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Skyfield
        run: python3 -m pip install 'skyfield==1.55'
      - name: Download official JPL ephemeris into disposable runner
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 --silent --show-error \
            'https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp' \
            --output "$RUNNER_TEMP/de440s.bsp"
          test "$(stat -c %s "$RUNNER_TEMP/de440s.bsp")" -gt 30000000
      - name: Validate M2 against real Mercury and Sun Moon motions
        env:
          MAGICK_M1_KERNEL: ${{ runner.temp }}/de440s.bsp
        run: python3 -m unittest discover -s tests/weather -p 'test_celestial_dynamics_m2.py' -v
