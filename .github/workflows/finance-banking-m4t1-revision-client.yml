name: FinanceW Banking M4t1 revision-bound client lifecycle
on:
  pull_request:
    paths:
      - 'scripts/finance/banking_revision_client_candidate.py'
      - 'scripts/finance/banking_recovery_handoff_candidate.py'
      - 'scripts/finance/banking_manual_*.py'
      - 'tests/finance/test_banking_revision_client_m4t1.py'
      - '.github/workflows/finance-banking-m4t1-revision-client.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/finance/banking_revision_client_candidate.py'
      - 'scripts/finance/banking_recovery_handoff_candidate.py'
      - 'scripts/finance/banking_manual_*.py'
      - 'tests/finance/test_banking_revision_client_m4t1.py'
      - '.github/workflows/finance-banking-m4t1-revision-client.yml'
permissions:
  contents: read
jobs:
  disposable-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify revision-bound client and Linux process lifecycle
        run: python3 -B tests/finance/test_banking_revision_client_m4t1.py
