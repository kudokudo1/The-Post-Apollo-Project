name: TimeW mode header and inline resync menu

on:
  pull_request:
    paths:
      - "widgets/TimeW.qml"
      - "tests/timew/test_timew_sync_popover_contract.py"
      - ".github/workflows/timew-sync-popover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify mode-aware heading, guarded popup actions and no forced Settings navigation
        run: python3 -B -I tests/timew/test_timew_sync_popover_contract.py
