name: MAGICK M5 stand-alone celestial instrument
on:
  pull_request:
    paths:
      - 'widgets/weather/StationMagickCelestialVisualPolicy.js'
      - 'widgets/weather/StationMagickCelestialInstrument.qml'
      - 'tests/weather/test_magick_celestial_visual_m5.js'
      - 'tests/weather/test_magick_celestial_visual_m5_jpl.js'
      - '.github/workflows/weather-magick-celestial-visual-m5.yml'
  push:
    paths:
      - 'widgets/weather/StationMagickCelestialVisualPolicy.js'
      - 'widgets/weather/StationMagickCelestialInstrument.qml'
      - 'tests/weather/test_magick_celestial_visual_m5.js'
      - 'tests/weather/test_magick_celestial_visual_m5_jpl.js'
      - '.github/workflows/weather-magick-celestial-visual-m5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify M5 source-backed graph projection and UI controls
        run: node --test tests/weather/test_magick_celestial_visual_m5.js
      - name: Check prior MAGICK panel remains untouched
        run: |
          node --test tests/weather/test_magick_subject_panels_g1.js
          node --test tests/weather/test_cosmos_visual_interactions_v2r.js

  real-jpl-to-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Skyfield inside disposable runner
        run: python3 -m pip install 'skyfield==1.55'
      - name: Fetch official JPL DE440s inside disposable runner
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 --silent --show-error \
            'https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp' \
            --output "$RUNNER_TEMP/de440s.bsp"
          test "$(stat -c %s "$RUNNER_TEMP/de440s.bsp")" -gt 30000000
      - name: Produce M4 source-backed JSON and run M5 acceptance policy
        run: |
          printf '%s\n' '{"format":"post-apollo.weather.celestial-visual-data.v1","start_utc":"2026-10-01T00:00:00Z","end_utc":"2026-10-25T00:00:00Z","bodies":["moon","sun"],"step_hours":12,"include_events":true}' > "$RUNNER_TEMP/query.json"
          python3 scripts/weather/celestial_visual_data.py --kernel "$RUNNER_TEMP/de440s.bsp" --query "$RUNNER_TEMP/query.json" > "$RUNNER_TEMP/m4.json"
          MAGICK_M5_JSON_FILE="$RUNNER_TEMP/m4.json" node --test tests/weather/test_magick_celestial_visual_m5_jpl.js
