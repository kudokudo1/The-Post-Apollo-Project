name: Company Network M5 isolated Qt6 vector proof

on:
  pull_request:
    paths:
      - 'experiments/company-vector-qt/**'
      - 'tests/company/test_company_vector_probe_m5.py'
      - '.github/workflows/company-network-vector-probe-m5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Offline, style and real-vector smoke contracts
        run: |
          python3 -m unittest discover -s tests/company -p 'test_company_vector_probe_m5.py' -v
          python3 -m unittest discover -s tests/company -p 'test_company_vector_style_m7.py' -v
          python3 -m unittest discover -s tests/company -p 'test_company_native_online_m8.py' -v
          python3 -m unittest discover -s tests/company -p 'test_company_vector_locality_m9.py' -v

  native-qt:
    # All Qt/MapLibre downloads happen on the disposable GitHub runner.
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Disposable graphics prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ cmake curl bzip2 xvfb mesa-utils \
            libicu-dev libgl1-mesa-dev libgl1-mesa-dri libegl1 libopengl0 \
            libpulse-dev libgstreamer-gl1.0-0 libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-xkb-dev \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtlocation qtpositioning'
          cache: false

      - name: Build pinned MapLibre Qt v3 from source using compatible ICU
        shell: bash
        run: |
          set -euo pipefail
          # Published Linux binary requires obsolete libicuuc.so.56.
          # Avoid grafting that library onto either CI or the operator machine.
          git clone --depth 1 --branch v3.0.0 \
            https://github.com/maplibre/maplibre-native-qt.git \
            "$RUNNER_TEMP/maplibre-src"
          test "$(git -C "$RUNNER_TEMP/maplibre-src" rev-parse HEAD)" = \
            'd929c783737120787b43417d9ef05da88da75dfd'
          git -C "$RUNNER_TEMP/maplibre-src" submodule update \
            --init --recursive --jobs 3
          cmake -S "$RUNNER_TEMP/maplibre-src" \
            -B "$RUNNER_TEMP/maplibre-source-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/maplibre-install" \
            -DMLN_QT_WITH_INTERNAL_ICU=ON
          cmake --build "$RUNNER_TEMP/maplibre-source-build" --parallel 3
          cmake --install "$RUNNER_TEMP/maplibre-source-build"
          config="$(find "$RUNNER_TEMP/maplibre-install" -type f -name QMapLibreConfig.cmake -print -quit)"
          test -n "$config"
          qmldir="$(find "$RUNNER_TEMP/maplibre-install" -type f -path '*/MapLibre/qmldir' -print -quit)"
          geoplugin="$(find "$RUNNER_TEMP/maplibre-install" -type f -path '*/geoservices/*' -iname '*maplibre*.so' -print -quit)"
          test -n "$qmldir"
          test -n "$geoplugin"
          libdir="$(find "$RUNNER_TEMP/maplibre-install" -type f -name 'libQMapLibre.so*' -print -quit)"
          test -n "$libdir"
          echo "QMAPLIBRE_DIR=$(dirname "$config")" >> "$GITHUB_ENV"
          echo "MAPLIBRE_QML_ROOT=$(dirname "$(dirname "$qmldir")")" >> "$GITHUB_ENV"
          echo "MAPLIBRE_PLUGIN_ROOT=$(dirname "$(dirname "$geoplugin")")" >> "$GITHUB_ENV"
          echo "MAPLIBRE_LIB_DIR=$(dirname "$libdir")" >> "$GITHUB_ENV"
          echo "MapLibre source build installed at: $RUNNER_TEMP/maplibre-install"

      - name: Compile independent QtQuick MapLibre app
        shell: bash
        run: |
          set -euo pipefail
          cmake -S experiments/company-vector-qt \
            -B "$RUNNER_TEMP/company-vector-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQMapLibre_DIR="$QMAPLIBRE_DIR"
          cmake --build "$RUNNER_TEMP/company-vector-build" --parallel 2

      - name: Offscreen software-OpenGL render and PNG capture
        shell: bash
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QSG_RHI_BACKEND=opengl
          export QT_PLUGIN_PATH="$MAPLIBRE_PLUGIN_ROOT:$QT_ROOT_DIR/plugins"
          export QML_IMPORT_PATH="$MAPLIBRE_QML_ROOT:$QT_ROOT_DIR/qml"
          export QML2_IMPORT_PATH="$MAPLIBRE_QML_ROOT:$QT_ROOT_DIR/qml"
          export LD_LIBRARY_PATH="$MAPLIBRE_LIB_DIR:$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          echo "MapLibre QML module: $MAPLIBRE_QML_ROOT/MapLibre"
          echo "MapLibre plugin dir: $MAPLIBRE_PLUGIN_ROOT/geoservices"
          test -f "$MAPLIBRE_QML_ROOT/MapLibre/qmldir"
          cd "$RUNNER_TEMP/company-vector-build"
          xvfb-run -a -s '-screen 0 1280x900x24' \
            timeout 25s ./company-vector-probe --capture
          test -s company-vector-probe.png
          cp company-vector-probe.png "$GITHUB_WORKSPACE/company-vector-offline.png"

          # Explicit, bounded public-area network test; no private user
          # location, hub, provider or worker data is passed to MapLibre.
          # Each test runs alone and captures only its current visible area.
          for sample in USA RURAL CANADA NEIGHBORHOOD VILLAGE BORDER; do
            echo "::group::Post-Apollo styled vector real-map sample: $sample"
            mock=()
            if [ "$sample" = NEIGHBORHOOD ]; then mock+=(--mock-hub); fi
            xvfb-run -a -s '-screen 0 1280x900x24' \
              timeout 45s ./company-vector-probe --styled-online \
              "--sample=$sample" "${mock[@]}" --capture 2>&1 | tee "styled-${sample}.log"
            test -s company-vector-probe.png
            if [ "$sample" = NEIGHBORHOOD ]; then
              grep -q 'SYNTHETIC_MARKER_ADDED' "styled-${sample}.log"
            fi
            cp company-vector-probe.png "$GITHUB_WORKSPACE/company-vector-${sample}.png"
            rm company-vector-probe.png
            echo "::endgroup::"
          done
          echo "Seven screenshots: offline, USA, RURAL, CANADA, NEIGHBORHOOD, VILLAGE, BORDER"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-vector-qt-native-capture
          path: company-vector-*.png
          if-no-files-found: ignore
