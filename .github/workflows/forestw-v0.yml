name: ForestW V0 Launcher Contract

on:
  pull_request:
    paths:
      - 'modules/Forest.qml'
      - 'widgets/ForestW.qml'
      - 'widgets/ForestAutoPolicyPreview.qml'
      - 'scripts/forest/ui_routing_example.py'
      - 'scripts/forest/model_form_routing_i1.py'
      - 'widgets/ForestBenchmarkReportView.qml'
      - 'widgets/ForestResourceFitExample.qml'
      - 'widgets/ForestWorkshopReferenceView.qml'
      - 'scripts/forest/ui_workshop_reference.py'
      - 'scripts/forest/capability_registry_b6r2.py'
      - 'scripts/forest/shared_context_b6r1.py'
      - 'scripts/forest/ui_resource_fit_example.py'
      - 'scripts/forest/resource_governor_p1.py'
      - 'scripts/forest/performance_benchmark_p2b.py'
      - 'widgets/ForestChatList.qml'
      - 'widgets/ForestChatSessionPolicy.js'
      - 'components/VoiceToTextButton.qml'
      - 'components/AskSendButton.qml'
      - 'services/forest/**'
      - 'scripts/forest/ui_model_preferences.py'
      - 'assets/forest/**'
      - 'widgets/ForestChassisPolicy.js'
      - 'shell.qml'
      - 'tests/forest/**'
      - '.github/workflows/forestw-v0.yml'
  push:
    paths:
      - 'modules/Forest.qml'
      - 'widgets/ForestW.qml'
      - 'widgets/ForestAutoPolicyPreview.qml'
      - 'scripts/forest/ui_routing_example.py'
      - 'scripts/forest/model_form_routing_i1.py'
      - 'widgets/ForestBenchmarkReportView.qml'
      - 'widgets/ForestResourceFitExample.qml'
      - 'widgets/ForestWorkshopReferenceView.qml'
      - 'scripts/forest/ui_workshop_reference.py'
      - 'scripts/forest/capability_registry_b6r2.py'
      - 'scripts/forest/shared_context_b6r1.py'
      - 'scripts/forest/ui_resource_fit_example.py'
      - 'scripts/forest/resource_governor_p1.py'
      - 'scripts/forest/performance_benchmark_p2b.py'
      - 'widgets/ForestChatList.qml'
      - 'widgets/ForestChatSessionPolicy.js'
      - 'components/VoiceToTextButton.qml'
      - 'components/AskSendButton.qml'
      - 'services/forest/**'
      - 'scripts/forest/ui_model_preferences.py'
      - 'assets/forest/**'
      - 'widgets/ForestChassisPolicy.js'
      - 'shell.qml'
      - 'tests/forest/**'
      - '.github/workflows/forestw-v0.yml'

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Forest launcher and geometry regressions
        run: |
          python3 tests/forest/test_forest_launcher_contract.py
          python3 tests/forest/test_forest_session_readonly_contract.py
          python3 tests/forest/test_forest_session_list_consumer_v1.py
          python3 tests/forest/test_forest_model_residency_ui.py
          python3 tests/forest/test_forest_model_profile_p0.py
          python3 tests/forest/test_forest_hardware_capacity_view_p2c.py
          python3 tests/forest/test_forest_selected_model_preflight_p2c.py
          python3 tests/forest/test_forest_p2c_model_evidence_crosscheck.py
          python3 tests/forest/test_forest_observation_freshness.py
          python3 tests/forest/test_forest_model_disk_comparison.py
          python3 tests/forest/test_forest_model_form_equipment.py
          python3 tests/forest/test_forest_ui_model_preferences.py
          python3 tests/forest/test_forest_auto_policy_preview.py
          python3 tests/forest/test_forest_benchmark_report_view.py
          python3 tests/forest/test_forest_resource_fit_example.py
          python3 tests/forest/test_forest_workshop_reference.py
