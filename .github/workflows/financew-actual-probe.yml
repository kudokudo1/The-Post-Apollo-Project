name: FinanceW Actual read-only probe contracts

on:
  pull_request:
    paths:
      - "scripts/finance/**"
      - "tests/finance/**"
      - "services/finance/**"
      - "widgets/FinanceW.qml"
      - ".gitignore"
      - ".github/workflows/financew-actual-probe.yml"
  push:
    branches: [main]
    paths:
      - "scripts/finance/**"
      - "tests/finance/**"
      - "services/finance/**"
      - "widgets/FinanceW.qml"
      - ".gitignore"
      - ".github/workflows/financew-actual-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check scripts/finance/actual_readonly.mjs
          node --check tests/finance/test_finance_category_plan.mjs
          node --check scripts/finance/funding_reconciliation.mjs
          node --check scripts/finance/income_categorization_preview.mjs
          node --check tests/finance/test_income_categorization_preview.mjs
          node --check tests/finance/test_funding_setup_plan.mjs
          node --check tests/finance/fixtures/funding_disposable_rehearsal.mjs
          node --check tests/finance/test_funding_disposable_rehearsal.mjs
          node --check tests/finance/test_finance_input_policy.mjs
          node --check tests/finance/test_finance_spreadsheet_policy.mjs
          node --check tests/finance/test_funding_reconciliation.mjs
          node --check scripts/finance/read_budget.mjs
          node --check scripts/finance/opening_history.mjs
          node --check scripts/finance/read_opening_history.mjs
          node --check tests/finance/test_opening_history.mjs
          node --check scripts/finance/transaction_guard.mjs
          node --check scripts/finance/write_transaction.mjs
          node --check tests/finance/test_transaction_guard.mjs
          node --check tests/finance/test_finance_write_gate.mjs
          node --check scripts/finance/local_drafts.mjs
          node --check tests/finance/test_local_drafts.mjs
          node --check tests/finance/test_allocation_preview.mjs
          node --check scripts/finance/allocation_guard.mjs
          node --check scripts/finance/write_allocation.mjs
          node --check scripts/finance/funding_guard.mjs
          node --check scripts/finance/category_guard.mjs
          node --check scripts/finance/write_category.mjs
          node --check tests/finance/test_category_guard.mjs
          node --check tests/finance/test_category_cli_recovery.mjs
          node --check tests/finance/fixtures/category_cli_register.mjs
          node --check tests/finance/fixtures/category_cli_loader.mjs
          node --check tests/finance/fixtures/category_cli_stub.mjs
          node --check scripts/finance/write_funding.mjs
          node --check tests/finance/test_funding_guard.mjs
          node --check tests/finance/test_funding_write_gate.mjs
          node --check tests/finance/test_allocation_cli_recovery.mjs
          node --check scripts/finance/check_allocation_gate.mjs
          node --check tests/finance/test_allocation_gate.mjs
          node --check tests/finance/test_allocation_guard.mjs
          node --check tests/finance/test_write_cli_recovery.mjs
          node --check tests/finance/fixtures/write_cli_register.mjs
          node --check tests/finance/fixtures/write_cli_loader.mjs
          node --check tests/finance/fixtures/write_cli_actual_stub.mjs
          node --check scripts/finance/source_config.mjs
          node --check scripts/finance/check_server.mjs
          node --check tests/finance/test_finance_source_config.mjs
          node --check tests/finance/test_actual_readonly.mjs
      - name: Validate standalone server installer Bash syntax
        run: bash -n scripts/finance/install_standalone_server.sh
      - name: Read-only, fake-data snapshot tests
        run: node --test tests/finance/test_actual_readonly.mjs tests/finance/test_finance_category_plan.mjs tests/finance/test_opening_history.mjs tests/finance/test_finance_source_config.mjs tests/finance/test_funding_reconciliation.mjs tests/finance/test_income_categorization_preview.mjs tests/finance/test_funding_setup_plan.mjs tests/finance/test_funding_disposable_rehearsal.mjs tests/finance/test_finance_input_policy.mjs tests/finance/test_finance_spreadsheet_policy.mjs tests/finance/test_transaction_guard.mjs tests/finance/test_finance_write_gate.mjs tests/finance/test_write_cli_recovery.mjs tests/finance/test_local_drafts.mjs tests/finance/test_allocation_preview.mjs tests/finance/test_allocation_guard.mjs tests/finance/test_allocation_cli_recovery.mjs tests/finance/test_category_guard.mjs tests/finance/test_category_cli_recovery.mjs tests/finance/test_funding_guard.mjs tests/finance/test_funding_write_gate.mjs tests/finance/test_allocation_gate.mjs
