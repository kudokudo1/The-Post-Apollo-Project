name: Universal ResizeButton contracts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "components/ActionButton.qml"
      - "components/ResizeButton.qml"
      - "components/qmldir"
      - "components/Colors.qml"
      - "tests/components/test_resize_button_contracts.py"
      - "tests/components/test_resize_button_qt_runtime.py"
      - "tests/components/resize_button_runtime_harness.qml"
      - ".github/workflows/resize-button-contracts.yml"
  pull_request:
    paths:
      - "components/ActionButton.qml"
      - "components/ResizeButton.qml"
      - "components/qmldir"
      - "components/Colors.qml"
      - "tests/components/test_resize_button_contracts.py"
      - "tests/components/test_resize_button_qt_runtime.py"
      - "tests/components/resize_button_runtime_harness.qml"
      - ".github/workflows/resize-button-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Shared ResizeButton source contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify canonical arrows and inherited ActionButton rules
        run: python3 tests/components/test_resize_button_contracts.py

  runtime-smoke:
    name: Offscreen Qt ResizeButton input and glyph glow
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install Qt runtime bindings
        run: python -m pip install "PySide6>=6.10,<6.12"
      - name: Exercise actual QML ResizeButton interactions
        run: python tests/components/test_resize_button_qt_runtime.py
