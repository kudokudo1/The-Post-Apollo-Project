# Optional SwayFX/SwayPX native-window focus glow
#
# Include separately if you want native toplevel focus distinction.
# These settings modify SwayFX window shadows persistently, not just inside
# Koinoikos Focus Mode; preserve existing settings if you prefer them.
# They do NOT affect Quickshell's layer-shell menu perimeter shaders.
#
# Requires the installed Sway compositor to support SwayFX commands.
shadows enable
shadow_color #ED981AB0
shadow_inactive_color #ED981A30
shadow_blur_radius 24
