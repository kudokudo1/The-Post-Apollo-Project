name: FinanceW Banking M4t2 disposable native client bridge
on:
  pull_request:
    paths:
      - 'services/finance/FinanceBankingRevisionBridgeCandidate.qml'
      - 'scripts/finance/banking_*candidate.py'
      - 'scripts/finance/banking_manual_*.py'
      - 'widgets/FinanceBankingAccountsPolicy.js'
      - 'tests/finance/test_banking_client_bridge_m4t2.py'
      - 'tests/finance/fixtures/M4t2BankingNative.qml'
      - '.github/workflows/finance-banking-m4t2-native-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B tests/finance/test_banking_client_bridge_m4t2.py
  real-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    env:
      POST_APOLLO_BANKING_NATIVE_CI: '1'
    steps:
      - name: Install pinned Quickshell runtime used in TimeW native witness
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 quickshell=0.3.2-1 \
            qt6-qpa-plugins xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run real QML bridge against disposable ledger and Python child
        run: xvfb-run -a -s "-screen 0 1024x768x24 -nolisten tcp" python3 -B tests/finance/test_banking_client_bridge_m4t2.py --native
