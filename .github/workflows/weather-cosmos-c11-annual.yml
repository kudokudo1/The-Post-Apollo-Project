name: COSMOS C11 annual year wheels
on:
  pull_request:
    paths:
      - 'widgets/weather/**'
      - 'tests/weather/test_cosmos_c11_annual_wheels.js'
      - 'tests/weather/fixtures/C11CosmosAnnualWheelsNativeShell.qml'
      - '.github/workflows/weather-cosmos-c11-annual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --test tests/weather/test_cosmos_c11_annual_wheels.js
          node --test tests/weather/test_cosmos_c8_moon_compact.js
          node --test tests/weather/test_cosmos_sun_instruments_c5c.js
          node --test tests/weather/test_magick_annual_wheels_m7b.js
          node --test tests/weather/test_magick_calendar_viewport_m7c.js
  native-wheels:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable offscreen Quickshell
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git quickshell qt6-qpa-plugins qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects coreutils findutils
      - uses: actions/checkout@v4
      - name: Test Sun/Moon JPL annual wheels in native viewport
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/cosmos-c11.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets" "$work/config/services" "$work/config/scripts"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services/." "$work/config/services/"
          cp -a "$root/scripts/weather" "$work/config/scripts/weather"
          cp "$root/tests/weather/fixtures/C11CosmosAnnualWheelsNativeShell.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 20s env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" QT_QPA_PLATFORM=offscreen quickshell --no-color -p "$work/config/shell.qml" >"$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "C11_ANNUAL_PASS // BOTH_WHEELS" "$work/native.log"
          if grep -E 'C11_ANNUAL_FAIL|Failed to load configuration|StationCosmosAnnualWheelPane.qml.*(TypeError|ReferenceError|Unable to assign)' "$work/native.log"; then exit 1; fi
