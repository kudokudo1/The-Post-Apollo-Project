permissions:
  contents: read

jobs:
  offline-transfer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test deterministic fictional transfer guidance
        run: node tests/finance/test_finance_transfer_guide_tg0.mjs
      - name: Test isolated read-only QML integration
        run: python3 tests/finance/test_finance_transfer_guide_tg0_contract.py
      - name: Test manual CSV parsing and conservative reconciliation
        run: node tests/finance/test_banking_import_m1.mjs
      - name: Test Banking menu, icon and offline boundaries
        run: python3 tests/finance/test_banking_import_m1_contracts.py
      - name: Test bounded read-only CSV selection with hostile file fixtures
        run: python3 tests/finance/test_banking_file_picker_m2.py
      - name: Test Banking M2 file-picker integration and source isolation
        run: python3 tests/finance/test_banking_file_picker_m2_contracts.py
      - name: Test manual account identities, money arithmetic and demo isolation
        run: node tests/finance/test_banking_accounts_m3.mjs
      - name: Test Banking M3 account UI and authority contracts
        run: python3 tests/finance/test_banking_accounts_m3_contracts.py
      - name: Test provider workspaces, account projections and restricted features
        run: node tests/finance/test_banking_provider_m4.mjs
      - name: Test Banking M4 provider screen and no-payment boundaries
        run: python3 tests/finance/test_banking_provider_m4_contracts.py
      - name: Test M4b provider recent-activity filters and demo constraints
        run: node tests/finance/test_banking_provider_m4b.mjs
      - name: Test M4b provider quick-entry and no-payment source contracts
        run: python3 tests/finance/test_banking_provider_m4b_contracts.py
      - name: Test M4c provider cash movement and selected-product balances
        run: node tests/finance/test_banking_provider_m4c.mjs
      - name: Test M4c safe provider dashboards and source isolation
        run: python3 tests/finance/test_banking_provider_m4c_contracts.py
      - name: Test M4d verified provider homepages and malformed URLs
        run: node tests/finance/test_banking_official_handoff_m4d.mjs
      - name: Test M4d two-click official site and restricted-only UI contract
        run: python3 tests/finance/test_banking_official_handoff_m4d_contracts.py
      - name: Test M4e full manual session journal and paginated provider isolation
        run: node tests/finance/test_banking_session_journal_m4e.mjs
      - name: Test M4e session journal source and no-financial-authority contracts
        run: python3 tests/finance/test_banking_session_journal_m4e_contracts.py
      - name: Test M4f manual record corrections, stale guards and demo refusal
        run: node tests/finance/test_banking_manual_corrections_m4f.mjs
      - name: Test M4f correction editor and existing session authority
        run: python3 tests/finance/test_banking_manual_corrections_m4f_contracts.py
      - name: Test M4g inclusive date filters and filtered session totals
        run: node tests/finance/test_banking_activity_dates_m4g.mjs
      - name: Test M4g date-range UI and no-financial-authority source contracts
        run: python3 tests/finance/test_banking_activity_dates_m4g_contracts.py
      - name: Test M4h per-account matched session summaries and provider isolation
        run: node tests/finance/test_banking_account_breakdown_m4h.mjs
      - name: Test M4h read-only account breakdown and QML authority contracts
        run: python3 tests/finance/test_banking_account_breakdown_m4h_contracts.py
      - name: Test reusable Post-Apollo date field and original Tasks calendar arithmetic
        run: node tests/finance/test_post_apollo_date_stepper.mjs
      - name: Test shared date field QML and Banking adoption without new writers
        run: python3 tests/finance/test_post_apollo_date_stepper_contracts.py
      - name: Test M4i atomic two-leg manual transfers and stale pair isolation
        run: node tests/finance/test_banking_manual_transfer_pairs_m4i.mjs
      - name: Test M4i transfer pair UI and no-payment source contracts
        run: python3 tests/finance/test_banking_manual_transfer_pairs_m4i_contracts.py
      - name: Test M4i declared transfer versus unlinked activity reconciliation
        run: node tests/finance/test_banking_transfer_aware_activity_m4i.mjs
      - name: Test M4i transfer-aware account movement source and authority contracts
        run: python3 tests/finance/test_banking_transfer_aware_activity_m4i_contracts.py
      - name: Test M4j atomic paired transfer corrections and stale-record guards
        run: node tests/finance/test_banking_transfer_corrections_m4j.mjs
      - name: Test M4j two-leg correction UI and no-payment authority contracts
        run: python3 tests/finance/test_banking_transfer_corrections_m4j_contracts.py
      - name: Test M4k whole-session transfer and unlinked movement reconciliation
        run: node tests/finance/test_banking_session_reconciliation_m4k.mjs
      - name: Test M4k reconciliation UI and no-account-authority contracts
        run: python3 tests/finance/test_banking_session_reconciliation_m4k_contracts.py
      - name: Test M4l stale-safe manual account nickname and opening corrections
        run: node tests/finance/test_banking_account_details_corrections_m4l.mjs
      - name: Test M4l two-click account editor and no-bank-authority contracts
        run: python3 tests/finance/test_banking_account_details_corrections_m4l_contracts.py
      - name: Test M4m recent-3/full-12 preview and ledger identity continuity
        run: node tests/finance/test_banking_readable_history_m4m.mjs
      - name: Test M4m readable history QML and no-write provider navigation contracts
        run: python3 tests/finance/test_banking_readable_history_m4m_contracts.py
      - name: Test M4n account-scoped Activity navigation and provider isolation
        run: node tests/finance/test_banking_account_activity_deeplink_m4n.mjs
      - name: Test M4n scoped Activity QML reset order and no-writer contract
        run: python3 tests/finance/test_banking_account_activity_deeplink_m4n_contracts.py
      - name: Test M4o durable manual snapshots, revisions and local security
        run: python3 -B tests/finance/test_banking_manual_store_m4o.py
      - name: Test M4o explicit local store controller and no-bank authority
        run: python3 -B tests/finance/test_banking_manual_store_m4o_contracts.py
      - name: Test M4p private manual backup, integrity and restore revision safety
        run: python3 -B tests/finance/test_banking_manual_archive_m4p.py
      - name: Test M4p no-export-path and no-UI-activation source contracts
        run: python3 -B tests/finance/test_banking_manual_archive_m4p_contracts.py
      - name: Test M4q damaged primary recovery and quarantine retry
        run: python3 -B tests/finance/test_banking_manual_recovery_m4q.py
