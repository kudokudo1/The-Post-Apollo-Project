name: Connections C3e-V signed guest and UART diagnostic cross-check (CI only)

on:
  pull_request:
    paths:
      - "tests/connections/c3e_release_trust/C3eVSignedGuestDiagnosticPair.py"
      - "tests/connections/test_connections_c3ev_signed_guest_diagnostic_pair.py"
      - "tests/connections/c3e_release_trust/C3eQSignedGuestEvidence.py"
      - "tests/connections/c3e_release_trust/C3eUObservedGuestImport.py"
      - "tests/connections/test_connections_c3eq_signed_guest_evidence.py"
      - "tests/connections/test_connections_c3eu_c4c_observed_guest_import.py"
      - ".github/workflows/connections-c3ev-signed-guest-diagnostic-pair.yml"
      - "docs/connections-c3ev-signed-guest-diagnostic-pair.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-claim-and-plaintext-guest-deny-only:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: CI source syntax and no broker promotion
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eVSignedGuestDiagnosticPair.py \
            tests/connections/test_connections_c3ev_signed_guest_diagnostic_pair.py
          python3 -B tests/connections/test_connections_c2n_policy_contract.py
          python3 - <<'PY'
          from pathlib import Path
          src = Path("tests/connections/c3e_release_trust/C3eVSignedGuestDiagnosticPair.py").read_text()
          broker = Path("services/connections/ConnectionsBroker.qml").read_text()
          host = Path("services/connections/ConnectionsRequestStatus.qml").read_text()
          assert "readonly property bool credentialActionsEnabled: false" in broker
          assert "readonly property bool hostAuthenticated: false" in host
          for key in ("signedGuestOriginAuthenticated", "hostAuthenticated",
                      "canApprove", "credentialActionsEnabled", "productionAuthority"):
              assert '"' + key + '": False' in src
          print("C3EV_PASS // ONLY_NEGATIVE_HOST_AUTH_AND_CREDENTIAL_RECEIPTS")
          PY

      - name: Real GPG signed Q evidence and one plaintext C4d report cross-check
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/connections/test_connections_c3ev_signed_guest_diagnostic_pair.py
          echo "C3EV_PASS // SIGNED_Q_AND_PLAINTEXT_C4D_MATCH_ONLY_CI_DIAGNOSTIC"

      - name: Preserve Q/U strict schema and crypto regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/connections/test_connections_c3eq_signed_guest_evidence.py
          python3 -B tests/connections/test_connections_c3eu_c4c_observed_guest_import.py
          echo "C3EV_PASS // Q_SIGNATURE_U_REAL_SOURCE_CONTRACTS_PRESERVED"

      - name: Preserve R durable challenge replay refusal
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env GITHUB_ACTIONS=true python3 -B tests/connections/test_connections_c3er_durable_challenge_ledger.py
          echo "C3EV_PASS // R_DURABLE_REPLAY_REFUSAL_PRESERVED"

      - name: Explicit nonproduction limitations
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'not an independently authenticated host' docs/connections-c3ev-signed-guest-diagnostic-pair.md
          grep -Fq '"externalIssuerCustodyVerified": False' tests/connections/c3e_release_trust/C3eVSignedGuestDiagnosticPair.py
          grep -Fq '"durableChallengeConsumptionVerified": False' tests/connections/c3e_release_trust/C3eVSignedGuestDiagnosticPair.py
          echo "C3EV_LIMITATION // CI_PAIR_CONSISTENCY_NOT_HOST_ATTESTATION"
