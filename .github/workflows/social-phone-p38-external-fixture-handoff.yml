name: Social PHONE P38 External Owner CI Handoff (DENY ONLY)

on:
  pull_request:
    paths:
      - 'services/phone/PhonePersonalUpstreamHandoffP38.py'
      - 'services/phone/PhonePersonalSignedTrustP37.py'
      - 'services/identity/silverblue_release_candidate_v1.py'
      - 'tests/connections/c3e_release_trust/C3eZReleaseBoundHostEvidence.py'
      - 'tests/connections/c3e_release_trust/C3eXIdentityRunningEvidence.py'
      - 'tests/phone/test_phone_personal_upstream_handoff_p38.py'
      - 'MODEL/contracts/social-phone-p38-external-fixture-handoff-v0.md'
      - '.github/workflows/social-phone-p38-external-fixture-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'services/phone/PhonePersonalUpstreamHandoffP38.py'
      - 'services/phone/PhonePersonalSignedTrustP37.py'
      - 'services/identity/silverblue_release_candidate_v1.py'
      - 'tests/connections/c3e_release_trust/C3eZReleaseBoundHostEvidence.py'
      - 'tests/phone/test_phone_personal_upstream_handoff_p38.py'
      - '.github/workflows/social-phone-p38-external-fixture-handoff.yml'

permissions:
  contents: read

jobs:
  recognize-actual-external-ci-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only source checkout
        uses: actions/checkout@v4
      - name: Synthetic-only Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ed25519 verifier on disposable CI runner only
        run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - name: Compile new PHONE consumer and fixture test
        run: |
          python -m py_compile services/phone/PhonePersonalUpstreamHandoffP38.py services/phone/PhonePersonalSignedTrustP37.py tests/phone/test_phone_personal_upstream_handoff_p38.py
      - name: Compare real C3e-Z / C4b schemas with cryptographically signed P37 fixtures
        run: |
          python -m unittest discover -s tests/phone -p 'test_phone_personal_upstream_handoff_p38.py' -v
      - name: Recheck P37 signed deny-only and earlier PHONE vault
        run: |
          python -m unittest discover -s tests/phone -p 'test_phone_personal_signed_trust_p37.py' -v
          python -m unittest discover -s tests/phone -p 'test_phone_personal_host_gate_p36.py' -v
          python -m unittest discover -s tests/phone -p 'test_phone_personal_contact_vault.py' -v
