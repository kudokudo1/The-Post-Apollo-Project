name: Forest UI2 S6a Local Target Latch
on:
  pull_request:
    paths:
      - 'widgets/forest/ui2/InteractionTargetLatch.js'
      - 'tests/forest/test_ui2_s6a_target_latch.js'
      - '.github/workflows/forest-ui2-target-latch.yml'
permissions:
  contents: read
jobs:
  local-target-latch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node tests/forest/test_ui2_s6a_target_latch.js
