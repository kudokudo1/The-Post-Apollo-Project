name: TASKS M13k disabled encrypted draft host IPC

on:
  pull_request:
    paths:
      - 'services/hub/TaskEncryptedDraftHostBridgeM13k.qml'
      - 'services/hub/ApolloHubTodoStore.qml'
      - 'services/hub/qmldir'
      - 'TaskEncryptedDraftHarnessM13k.qml'
      - 'tests/tasks/fixtures/TaskEncryptedDraftHostM13k.cjs'
      - 'tests/tasks/fixtures/TaskEncryptedDraftHostPrivateM13k.sh'
      - 'tests/tasks/test_task_encrypted_draft_host_m13k.cjs'
      - 'docs/tasks-disabled-encrypted-draft-host-m13k.md'
      - '.github/workflows/tasks-encrypted-draft-host-m13k.yml'
  push:
    branches: [main]
    paths:
      - 'services/hub/TaskEncryptedDraftHostBridgeM13k.qml'
      - 'services/hub/ApolloHubTodoStore.qml'
      - 'services/hub/qmldir'
      - 'TaskEncryptedDraftHarnessM13k.qml'
      - 'tests/tasks/fixtures/TaskEncryptedDraftHostM13k.cjs'
      - 'tests/tasks/test_task_encrypted_draft_host_m13k.cjs'
      - '.github/workflows/tasks-encrypted-draft-host-m13k.yml'

permissions:
  contents: read

jobs:
  private-synthetic-ipc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and negative host-guard assertions
        run: |
          node --test tests/tasks/test_task_encrypted_draft_host_m13k.cjs
          bash -n tests/tasks/fixtures/TaskEncryptedDraftHostPrivateM13k.sh
      - name: QML syntax parser with no Quickshell GUI activation
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools dbus dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin
          QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmlformat \
            services/hub/TaskEncryptedDraftHostBridgeM13k.qml > /dev/null
          QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmlformat \
            TaskEncryptedDraftHarnessM13k.qml > /dev/null
          QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmlformat \
            services/hub/ApolloHubTodoStore.qml > /dev/null
      - name: Actual Secret Service key roundtrip over synthetic QML-style stdin IPC
        run: dbus-run-session -- bash tests/tasks/fixtures/TaskEncryptedDraftHostPrivateM13k.sh
      - name: Regress prior encrypted fake drafts and M13i readonly QML
        run: |
          node --test tests/tasks/test_task_encrypted_recovery_m13f.cjs
          node --test tests/tasks/test_task_encrypted_recovery_bridge_m13i.cjs
      - name: Production single writer and nine public mutation methods unchanged
        run: python3 tests/tasks/test_task_writer_gate_inventory_m11d.py
