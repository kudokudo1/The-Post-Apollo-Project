name: Trash Bottom-Left Launcher Contracts

on:
  pull_request:
    paths:
      - shell.qml
      - modules/Trash.qml
      - components/TrashLifecycleActionDeck.qml
      - components/qmldir
      - widgets/CameraW.qml
      - widgets/CameraCleanupView.qml
      - modules/Power.qml
      - components/DockButton.qml
      - tests/trash/**
      - scripts/trash/**
      - .github/workflows/trash-bottom-left-launcher.yml
  push:
    paths:
      - shell.qml
      - modules/Trash.qml
      - components/TrashLifecycleActionDeck.qml
      - components/qmldir
      - widgets/CameraW.qml
      - widgets/CameraCleanupView.qml
      - modules/Power.qml
      - components/DockButton.qml
      - tests/trash/**
      - scripts/trash/**
      - .github/workflows/trash-bottom-left-launcher.yml

permissions:
  contents: read

jobs:
  bottom-left-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned crypto and read-only D-Bus contract test dependencies
        run: python3 -m pip install 'cryptography>=44,<48' 'dbus-next==0.2.3'
      - name: Verify Trash launcher, scoped GIO adapter, and deletion safeguards
        run: python3 -m unittest discover -s tests/trash -p 'test_*.py' -v
      - name: Verify one real disposable GIO Trash and exact file Restore (CI sandbox ONLY)
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test -d "$RUNNER_TEMP"
          # The real trash:/// GIO scheme needs GVfs, not GIO_USE_VFS=local.
          # Install only inside this ephemeral Ubuntu test runner.
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gvfs gvfs-daemons gvfs-backends dbus
          python3 -I -B scripts/trash/gio_disposable_roundtrip_u9.py
      - name: Verify real disposable GIO Burn and Burn All, managed Restore/Burn, and V2 Archive isolation (CI ONLY)
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test -d "$RUNNER_TEMP"
          # GVfs and D-Bus installed by the preceding U9 real-GIO step.
          # Runs inside a NEW private HOME + XDG + D-Bus session, never host Trash.
          python3 -I -B scripts/trash/trash_product_acceptance_p1.py
      - name: Inventory Media queue versus file deletion boundary (U8 read-only, no owner writes)
        run: |
          python3 -I -B scripts/trash/media_delete_inventory_u8.py > "$RUNNER_TEMP/trashpp-u8-media.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print("MEDIA U8 STATE:",d["state"]); print("READ ONLY:",d["readOnly"]); print("ACTION AUTHORITY:",d["actionAuthority"]); print("MEDIA FILE DELETE SUPPORTED:",d["mediaFileDeleteSupported"]); print("BOUNDARIES:",[(b["kind"],b["operation"]) for b in d["boundaries"]]); print("SOURCE DRIFT:",d["problems"])' "$RUNNER_TEMP/trashpp-u8-media.json"
      - name: Inventory unreviewed Delete Trash Burn UI sites (read-only)
        run: |
          python3 -I -B scripts/trash/universal_delete_inventory_u1.py > "$RUNNER_TEMP/trashpp-u1.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print("U1 STATE:", d["state"]); print("CANDIDATE LOCATIONS:", d["totals"]["candidateLocations"]); print("BY FAMILY:", d["totals"]["byFamily"]); print("INCOMPLETE PATHS:", len(d["incompletePaths"])); print("CANDIDATE FILES:", sorted(set(x["path"] for x in d["candidates"]))[:80])' "$RUNNER_TEMP/trashpp-u1.json"
      - name: Verify U3 managed-copy ActionDeck review maps to original owned backend
        run: node --test tests/trash/test_u3_managed_copy_review.cjs
      - name: Verify U4 GIO file Restore only matches exact indexed review token
        run: node --test tests/trash/test_u4_gio_restore_review.cjs
      - name: Verify U5 Camera Gallery one-use file-to-Trash review stays recoverable
        run: node --test tests/trash/test_u5_camera_gallery_trash_review.cjs
      - name: Verify U6 Camera Cleanup queue scoped review and explicit one-click GIO handoff
        run: node --test tests/trash/test_u6_camera_cleanup_queue_review.cjs
      - name: Verify U7 Desktop preview plan and final shared TRASH click stay owner-scoped
        run: node --test tests/trash/test_u7_desktop_screenshot_review.cjs
      - name: Verify Camera Cleanup handoff preserves shared queue and authority
        run: node --test tests/trash/test_camera_cleanup_handoff.cjs
      - name: Verify V2 pilot snapshots require preview, confirmation and owner scope
        run: node --test tests/trash/test_archive_snapshot_state.cjs
      - name: Verify capacity bar tracks actual read-only SQLite storage measurements
        run: node --test tests/trash/test_archive_capacity_bar.cjs
      - name: Verify on-demand provenance chain audit UI and unsigned result safety
        run: node --test tests/trash/test_archive_chain_state.cjs
      - name: Verify two-click Burn state machine never deletes on first click
        run: node --test tests/trash/test_burn_copy_two_click.cjs
      - name: Verify managed-bin-only Burn All and unified Trash filters
        run: node --test tests/trash/test_managed_bin_burn_all.cjs
