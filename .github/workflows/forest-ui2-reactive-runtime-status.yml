name: Forest UI2.2b Reactive Runtime Status
on:
  pull_request:
    paths:
      - 'widgets/forest/ui2/**'
      - 'scripts/forest/runtime_public_delivery_r4b.py'
      - 'scripts/forest/runtime_public_status_r4.py'
      - 'scripts/forest/runtime_events_r3.py'
      - 'scripts/forest/history_public_fixture_m4.py'
      - 'tests/forest/test_runtime_public_delivery_r4b.py'
      - 'tests/forest/test_runtime_public_status_r4.py'
      - 'tests/forest/test_runtime_events_r3.py'
      - 'tests/forest/ui2_m4_public_fixture.py'
      - 'tests/forest/ui2_r6d_child_fixture.py'
      - 'tests/forest/test_runtime_public_child_r6b.py'
      - 'scripts/forest/runtime_public_child_r6b.py'
      - 'scripts/forest/runtime_public_conversation_r5.py'
      - 'tests/forest/ui22b_runtime_status_harness.qml'
      - 'tests/forest/test_ui22b_runtime_status_qt.py'
      - '.github/workflows/forest-ui2-reactive-runtime-status.yml'
permissions:
  contents: read
jobs:
  reactive-runtime-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Qt prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - run: python -m pip install "PySide6>=6.10,<6.12"
      - run: python tests/forest/test_ui22b_runtime_status_qt.py
