name: Weather Station Teardown Contracts

on:
  pull_request:
    paths:
      - "widgets/weather/**"
      - "modules/Weather.qml"
      - "components/WeatherCelestialGlyph.qml"
      - "components/qmldir"
      - "services/weather/**"
      - "shell.qml"
      - "tests/weather/**"
      - ".github/workflows/weather-teardown-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "widgets/weather/**"
      - "modules/Weather.qml"
      - "components/WeatherCelestialGlyph.qml"
      - "components/qmldir"
      - "services/weather/**"
      - "shell.qml"
      - "tests/weather/**"
      - ".github/workflows/weather-teardown-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Weather Station effect teardown contracts
        run: python3 tests/weather/test_shader_teardown_contracts.py
      - name: Validate live Weather dock state classification
        run: node tests/weather/test_weather_dock_policy.js
      - name: Validate Weather data parsing and forecast contracts
        run: node tests/weather/test_weather_data_policy.js
      - name: Verify SKY hourly detail inspection of existing forecast data
        run: node tests/weather/test_station_sky_hourly_inspector.js
      - name: Validate Weather solar and lunar cycle with flat icon contracts
        run: node tests/weather/test_weather_cycle_policy.js
      - name: Validate SKY calibrated solar twilight windows
        run: node tests/weather/test_station_sky_twilight.js
      - name: Validate SKY provider-clock solar position
        run: node tests/weather/test_station_sky_solar_position.js
      - name: Validate SKY USNO moon ephemeris
        run: node tests/weather/test_station_sky_usno_moon.js
      - name: Validate Weather Station Home relevance policy
        run: node tests/weather/test_station_home_policy.js
      - name: Validate HOME recent archived-model history
        run: node tests/weather/test_station_home_recent_history.js
      - name: Validate Weather core source-health and per-feed state
        run: node tests/weather/test_station_source_health.js
      - name: Validate SPACE Kp history from existing NOAA feed
        run: node tests/weather/test_station_space_kp_history.js
      - name: Validate SPACE NOAA solar-cycle prediction context
        run: node tests/weather/test_station_space_solar_cycle.js
      - name: Validate SPACE NOAA SUVI solar imagery
        run: node tests/weather/test_station_space_suvi_image.js
      - name: Validate Kitty Sway workarea coordinate contracts
        run: node tests/weather/test_station_terminal_geometry.js
      - name: Validate internal NEWS viewer and URL boundary contracts
        run: node tests/weather/test_station_news_viewer.js
      - name: Validate NEWS compositor host namespace and local viewport geometry
        run: node tests/weather/test_station_news_viewport_geometry.js
      - name: Validate NEWS source catalog and creator subscriptions
        run: node tests/weather/test_station_news_channel_hub.js
      - name: Validate NEWS isolated browser preflight safety contract
        run: python3 tests/weather/test_station_news_viewer_preflight.py
      - name: Validate optional YouTube creator feed parser offline
        run: python3 tests/weather/test_station_youtube_feed.py
      - name: Validate GDELT NEWS rate limit, cache and live source reporting
        run: node tests/weather/test_station_discovery_rate_limit.js
      - name: Validate NEWS conservative dedupe and local topic filters
        run: node tests/weather/test_station_news_report_filter.js
      - name: Validate NEWS publisher and source-country filter
        run: node tests/weather/test_station_news_source_filter.js
      - name: Validate MAP EONET hazard filters cache and inspector
        run: node tests/weather/test_station_map_hazard_intelligence.js
      - name: Validate MAP spatial projection zoom pan and point canvas
        run: node tests/weather/test_station_map_spatial_canvas.js
      - name: Validate bounded manual FIRMS hotspot overlay
        run: node tests/weather/test_station_map_firms_hotspots.js
      - name: Validate secret-safe FIRMS fetch helper
        run: python3 tests/weather/test_station_firms_fetch_helper.py
      - name: Validate manual NOAA MRMS radar overlay
        run: node tests/weather/test_station_map_noaa_radar.js
      - name: Validate NOAA HMS smoke polygon overlay
        run: node tests/weather/test_station_map_hms_smoke.js
      - name: Validate NOAA HMS latest KML fetch helper
        run: python3 tests/weather/test_station_hms_smoke_fetch.py
      - name: Validate RADIO favorites recents and safe recall
        run: node tests/weather/test_station_radio_memory.js
      - name: Validate Weather Station domain palette and live meter contracts
        run: node tests/weather/test_domain_palette_contracts.js
      - name: Verify GROUND individual pollen readings and unavailable states
        run: node tests/weather/test_station_ground_pollen_species.js
      - name: Verify GROUND shared official NWS alert surface
        run: node tests/weather/test_station_ground_nws_alerts.js
      - name: Verify GROUND nearby NOAA NWPS river status
        run: node tests/weather/test_station_ground_nwps_river.js
      - name: Verify GROUND separate NWPS observed and forecast stageflow
        run: node tests/weather/test_station_ground_nwps_stageflow.js
      - name: Verify official NWS alert hierarchy across HOME and header
        run: node tests/weather/test_station_official_alert_hierarchy.js
