name: TASKS M12o disabled ticket consumer contract

on:
  pull_request:
    paths:
      - 'services/hub/TaskSaveTicketContractM12o.js'
      - 'services/hub/TaskSaveTicketFacadeM12o.qml'
      - 'tests/tasks/test_task_disabled_ticket_api_m12o.cjs'
      - 'docs/tasks-disabled-ticket-consumer-contract-m12o.md'
      - '.github/workflows/tasks-disabled-ticket-api-m12o.yml'
      - 'services/hub/ApolloHubTodoPolicy.js'
      - 'services/hub/ApolloHubTodoStore.qml'
      - 'widgets/tasks/**'
      - 'widgets/hub/ApolloHubTodoMini.qml'
  push:
    branches: [main]
    paths:
      - 'services/hub/TaskSaveTicketContractM12o.js'
      - 'services/hub/TaskSaveTicketFacadeM12o.qml'
      - 'tests/tasks/test_task_disabled_ticket_api_m12o.cjs'
      - 'docs/tasks-disabled-ticket-consumer-contract-m12o.md'
      - '.github/workflows/tasks-disabled-ticket-api-m12o.yml'

permissions:
  contents: read

jobs:
  m12o-disposable-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: M12o four-surface and nine-method disabled ticket contract
        run: node --test tests/tasks/test_task_disabled_ticket_api_m12o.cjs
      - name: M12n isolated native ticket state machine regression
        run: node --test tests/tasks/test_task_native_ticket_bridge_m12n.cjs
      - name: M12m local FIFO ticket and disposable filesystem regression
        run: node --test tests/tasks/test_task_local_coordinator_m12m.cjs
      - name: M12i isolated host response regression
        run: python3 tests/tasks/test_task_native_receipt_host_m12i.py
      - name: M12k same-UID external writer remains a documented limitation
        run: python3 tests/tasks/test_task_uncooperative_writer_m12k.py
      - name: M11t production trust gates remain open
        run: python3 tests/tasks/test_task_production_trust_contract_m11t.py
      - name: M11d production single writer not changed
        run: python3 tests/tasks/test_task_writer_gate_inventory_m11d.py
