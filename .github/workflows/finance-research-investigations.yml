name: Finance Research investigation contracts

on:
  pull_request:
    paths:
      - "scripts/finance/research_investigations.mjs"
      - "scripts/finance/research_investigation_store.mjs"
      - "scripts/finance/research_investigation_read_bridge.mjs"
      - "scripts/finance/research_investigation_write_contract.mjs"
      - "scripts/finance/research_investigation_write_attempt.mjs"
      - "scripts/finance/research_investigation_disposable_dispatcher.mjs"
      - "scripts/finance/research_investigation_source_health.mjs"
      - "scripts/finance/research_investigation_health_probe.mjs"
      - "scripts/finance/research_evidence_candidates.mjs"
      - "scripts/finance/RESEARCH_INVESTIGATIONS_M*_README.md"
      - "widgets/FinanceResearchInvestigationsPane.qml"
      - "widgets/FinanceResearchInvestigationsReadHost.qml"
      - "widgets/FinanceResearchWriteOutcomePanel.qml"
      - "widgets/FinanceResearchWriteOutcomePreviewHost.qml"
      - "services/finance/FinanceResearchInvestigationReadService.qml"
      - "tests/finance/test_research_investigations.mjs"
      - "tests/finance/test_research_investigation_store.mjs"
      - "tests/finance/test_research_investigation_read_bridge.mjs"
      - "tests/finance/test_research_investigation_write_contract.mjs"
      - "tests/finance/test_research_investigation_write_attempt.mjs"
      - "tests/finance/test_research_investigation_disposable_dispatcher.mjs"
      - "tests/finance/test_research_investigation_source_health.mjs"
      - "tests/finance/test_research_investigation_health_probe.mjs"
      - "tests/finance/test_research_evidence_candidates.mjs"
      - "tests/finance/test_research_write_outcome_panel_contract.py"
      - "tests/finance/test_research_write_preview_host_contract.py"
      - "tests/finance/test_research_investigation_read_controller_contract.py"
      - "tests/finance/test_research_investigations_pane_contract.py"
      - ".github/workflows/finance-research-investigations.yml"
  push:
    branches: [main]
    paths:
      - "scripts/finance/research_investigations.mjs"
      - "scripts/finance/research_investigation_store.mjs"
      - "scripts/finance/research_investigation_read_bridge.mjs"
      - "scripts/finance/research_investigation_write_contract.mjs"
      - "scripts/finance/research_investigation_write_attempt.mjs"
      - "scripts/finance/research_investigation_disposable_dispatcher.mjs"
      - "scripts/finance/research_investigation_source_health.mjs"
      - "scripts/finance/research_investigation_health_probe.mjs"
      - "scripts/finance/research_evidence_candidates.mjs"
      - "widgets/FinanceResearchInvestigationsPane.qml"
      - "widgets/FinanceResearchInvestigationsReadHost.qml"
      - "widgets/FinanceResearchWriteOutcomePanel.qml"
      - "widgets/FinanceResearchWriteOutcomePreviewHost.qml"
      - "services/finance/FinanceResearchInvestigationReadService.qml"
      - "tests/finance/test_research_investigations.mjs"
      - "tests/finance/test_research_investigation_store.mjs"
      - "tests/finance/test_research_investigation_read_bridge.mjs"
      - "tests/finance/test_research_investigation_write_contract.mjs"
      - "tests/finance/test_research_investigation_write_attempt.mjs"
      - "tests/finance/test_research_investigation_disposable_dispatcher.mjs"
      - "tests/finance/test_research_investigation_source_health.mjs"
      - "tests/finance/test_research_investigation_health_probe.mjs"
      - "tests/finance/test_research_evidence_candidates.mjs"
      - "tests/finance/test_research_write_outcome_panel_contract.py"
      - "tests/finance/test_research_write_preview_host_contract.py"
      - "tests/finance/test_research_investigation_read_controller_contract.py"
      - "tests/finance/test_research_investigations_pane_contract.py"
      - ".github/workflows/finance-research-investigations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Research JavaScript syntax
        run: |
          node --check scripts/finance/research_investigations.mjs
          node --check scripts/finance/research_investigation_store.mjs
          node --check scripts/finance/research_investigation_read_bridge.mjs
          node --check scripts/finance/research_investigation_write_contract.mjs
          node --check scripts/finance/research_investigation_write_attempt.mjs
          node --check scripts/finance/research_investigation_disposable_dispatcher.mjs
          node --check scripts/finance/research_investigation_source_health.mjs
          node --check scripts/finance/research_investigation_health_probe.mjs
          node --check scripts/finance/research_evidence_candidates.mjs
          node --check tests/finance/test_research_investigations.mjs
          node --check tests/finance/test_research_investigation_store.mjs
          node --check tests/finance/test_research_investigation_read_bridge.mjs
          node --check tests/finance/test_research_investigation_write_contract.mjs
          node --check tests/finance/test_research_investigation_write_attempt.mjs
          node --check tests/finance/test_research_investigation_disposable_dispatcher.mjs
          node --check tests/finance/test_research_investigation_source_health.mjs
          node --check tests/finance/test_research_investigation_health_probe.mjs
          node --check tests/finance/test_research_evidence_candidates.mjs
      - name: Investigation model and local-store offline tests
        run: |
          node tests/finance/test_research_investigations.mjs
          node tests/finance/test_research_investigation_store.mjs
          node tests/finance/test_research_investigation_read_bridge.mjs
          node tests/finance/test_research_investigation_write_contract.mjs
          node tests/finance/test_research_investigation_write_attempt.mjs
          node tests/finance/test_research_investigation_disposable_dispatcher.mjs
          node tests/finance/test_research_investigation_source_health.mjs
          node tests/finance/test_research_investigation_health_probe.mjs
          node tests/finance/test_research_evidence_candidates.mjs
      - name: Isolated Research pane source contract
        run: python3 -B tests/finance/test_research_investigations_pane_contract.py
      - name: Research M4 isolated QML read-only controller contract
        run: python3 -B tests/finance/test_research_investigation_read_controller_contract.py
      - name: M4b-T2 disposable outcome display contract
        run: python3 -B tests/finance/test_research_write_outcome_panel_contract.py
      - name: M4b-T2 non-writing preview host contract
        run: python3 -B tests/finance/test_research_write_preview_host_contract.py
