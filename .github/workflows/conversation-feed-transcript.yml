name: ConversationFeed transcript compatibility
on:
  pull_request:
    paths:
      - 'components/ConversationFeed.qml'
      - 'components/NeonScrollBar.qml'
      - 'components/SafeDropShadow.qml'
      - 'components/Colors.qml'
      - 'components/qmldir'
      - 'tests/components/conversation_feed_transcript/**'
      - '.github/workflows/conversation-feed-transcript.yml'
permissions:
  contents: read
jobs:
  native-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install coherent Fedora Qt and Quickshell runtime
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf copr enable -y errornointernet/quickshell
          dnf install -y --setopt=install_weak_deps=False quickshell qt6-qtdeclarative qt6-qt5compat qt6-qtbase-gui qt6-qtsvg git coreutils findutils diffutils grep
          quickshell --version
          quickshell --version | grep '0.3.'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native layout, draft, send and focus regressions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_LOGGING_RULES: 'qml.debug=true;qml.info=true;qml.warning=true;qml.critical=true'
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          export HOME="$work/home" XDG_CONFIG_HOME="$work/config" XDG_CACHE_HOME="$work/cache" XDG_DATA_HOME="$work/data" XDG_RUNTIME_DIR="$work/run"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Quickshell confines QML imports to the config root. Stage exact
          # production dependencies under it, not a ../../../ escape or stub.
          mkdir -p "$work/config/feed/components"
          scene="$work/config/feed"
          cp "$GITHUB_WORKSPACE/tests/components/conversation_feed_transcript/shell.qml" "$scene/shell.qml"
          for file in ConversationFeed.qml NeonScrollBar.qml SafeDropShadow.qml Colors.qml; do
            cp "$GITHUB_WORKSPACE/components/$file" "$scene/components/$file"
            cmp "$GITHUB_WORKSPACE/components/$file" "$scene/components/$file"
          done
          grep -E '^(singleton Colors|ConversationFeed|NeonScrollBar|SafeDropShadow) ' "$GITHUB_WORKSPACE/components/qmldir" > "$scene/components/qmldir"
          test "$(wc -l < "$scene/components/qmldir")" -eq 4
          # Quickshell filters QML console output by default. Explicitly
          # enable it, as the existing Weather M26-D native fixture does.
          timeout --signal=TERM --kill-after=3s 30s quickshell --path "$scene/shell.qml" --no-color --log-rules "$QT_LOGGING_RULES" 2>&1 | tee "$work/output"
          if grep -q FEED_TRANSCRIPT_FAIL "$work/output"; then
            echo "Native fixture reported an assertion failure" >&2
            exit 1
          fi
          if ! grep -q FEED_TRANSCRIPT_FIXTURE_STARTED "$work/output"; then
            echo "Missing native fixture startup witness" >&2
            exit 1
          fi
          observed="$(grep -oE 'FEED_TRANSCRIPT_PHASE_PASS [0-7]' "$work/output" || true)"
          expected="$(printf 'FEED_TRANSCRIPT_PHASE_PASS %s\n' 0 1 2 3 4 5 6 7)"
          if [ "$observed" != "$expected" ]; then
            printf 'Incomplete or out-of-order native phases:\n%s\n' "$observed" >&2
            exit 1
          fi
          if ! grep -q FEED_TRANSCRIPT_NATIVE_PASS "$work/output"; then
            echo "Missing final native completion witness" >&2
            exit 1
          fi
