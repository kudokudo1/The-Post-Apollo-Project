name: Identity Center Native Loopback Callback Receiver

on:
  pull_request:
    paths:
      - 'services/identity/native_loopback_callback_v0.py'
      - 'tests/identity/test_native_loopback_callback_v0.py'
      - 'MODEL/contracts/identity-center-native-loopback-callback-v0.md'
      - '.github/workflows/identity-center-native-loopback-callback.yml'
  push:
    branches: [main]
    paths:
      - 'services/identity/native_loopback_callback_v0.py'
      - 'tests/identity/test_native_loopback_callback_v0.py'
      - 'MODEL/contracts/identity-center-native-loopback-callback-v0.md'
      - '.github/workflows/identity-center-native-loopback-callback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback:
    name: Loopback-only HTTP callback + host PKCE contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile receiver, host and regression tests
        run: |
          python3 -m py_compile services/identity/native_loopback_callback_v0.py
          python3 -m py_compile tests/identity/test_native_loopback_callback_v0.py
      - name: Exercise actual loopback HTTP receiver against fake verified host
        run: python3 -m unittest discover -s tests/identity -p 'test_native_loopback_callback_v0.py' -v
      - name: Preserve prior host and tokenless projection contracts
        run: |
          python3 -m unittest discover -s tests/identity -p 'test_desktop_session_host_v0.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_desktop_context_projection_v0.py' -v
