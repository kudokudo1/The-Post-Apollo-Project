name: Clock BG1-B2B1 kernel peer lifetime (synthetic, deny-only)
on:
  pull_request:
    paths:
      - "services/time/AlarmPeerIdentity.py"
      - "services/time/AlarmOwnershipBroker.py"
      - "services/time/BG1-ALARM-PEER-LIFETIME.md"
      - "tests/time/test_clock_bg1_b2b_peer_identity.py"
      - ".github/workflows/clock-bg1-b2b-peer.yml"
  push:
    paths:
      - "services/time/AlarmPeerIdentity.py"
      - "services/time/AlarmOwnershipBroker.py"
      - "services/time/BG1-ALARM-PEER-LIFETIME.md"
      - "tests/time/test_clock_bg1_b2b_peer_identity.py"
      - ".github/workflows/clock-bg1-b2b-peer.yml"
permissions:
  contents: read
jobs:
  kernel-peer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Python syntax and kernel runtime
        run: |
          python3 -I -B -c 'import ast,pathlib;[ast.parse(pathlib.Path(p).read_text()) for p in ["services/time/AlarmPeerIdentity.py","services/time/AlarmOwnershipBroker.py"]]'
          uname -r
      - name: Exercise actual kernel pidfd peers, exit and exec replacement
        run: python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b_peer_identity.py' -v
      - name: Preserve real two-client shadow broker and earlier lease contracts
        run: |
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_broker_protocol.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2_shadow_transactions.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_owner_fencing_contract.py' -v
      - name: Protect live Clock, audio and observer paths
        run: |
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          expected = {
              "services/time/AlarmPeerIdentity.py",
              "services/time/AlarmOwnershipBroker.py",
              "services/time/BG1-ALARM-PEER-LIFETIME.md",
              "tests/time/test_clock_bg1_b2b_peer_identity.py",
              ".github/workflows/clock-bg1-b2b-peer.yml",
              ".github/workflows/clock-bg1-b2-shadow.yml",
          }
          assert changed == expected, f"Unexpected edit scope: {changed ^ expected}"
          protected = ("AlarmManagerService.qml","AlarmManagerPolicy.js",
              "AlarmAudioV2.qml","AlarmBackgroundObserver.py")
          assert not any(any(p.endswith(name) for name in protected)
                         for p in changed)
          print("BG1-B2B1 isolated and DENY-ONLY")
          PY
