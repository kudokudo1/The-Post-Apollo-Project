name: TASKS M11u synthetic host identity and sealed launch regression

on:
  pull_request:
    paths:
      - 'tests/tasks/fixtures/TaskHostTrustCapsuleM11u.py'
      - 'tests/tasks/test_task_host_trust_capsule_m11u.py'
      - 'docs/tasks-host-trust-capsule-m11u.md'
      - '.github/workflows/tasks-host-trust-capsule-m11u.yml'
      - 'services/hub/ApolloHubTodoStore.qml'
      - 'services/projects/TaskJsonGateCandidateM11l.py'
  push:
    branches: [main]
    paths:
      - 'tests/tasks/fixtures/TaskHostTrustCapsuleM11u.py'
      - 'tests/tasks/test_task_host_trust_capsule_m11u.py'
      - 'docs/tasks-host-trust-capsule-m11u.md'
      - '.github/workflows/tasks-host-trust-capsule-m11u.yml'
      - 'services/hub/ApolloHubTodoStore.qml'
      - 'services/projects/TaskJsonGateCandidateM11l.py'

permissions:
  contents: read

jobs:
  isolated-linux-source-capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M11u private script digest, sealed memfd and failure matrix
        run: python3 tests/tasks/test_task_host_trust_capsule_m11u.py
      - name: M11t production trust boundaries still open
        run: python3 tests/tasks/test_task_production_trust_contract_m11t.py
      - name: M11q native callback source preflight
        run: python3 tests/tasks/test_task_production_preflight_m11q.py
      - name: M11d one original TASKS writer
        run: python3 tests/tasks/test_task_writer_gate_inventory_m11d.py
