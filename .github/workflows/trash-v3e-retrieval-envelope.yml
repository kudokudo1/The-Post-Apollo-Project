name: Trash++ V3e offline signed retrieval refusal

on:
  pull_request:
    paths:
      - scripts/trash/archive_v3e_retrieval_envelope_review.py
      - tests/trash/test_archive_v3e_retrieval_envelope_review.py
      - scripts/trash/ARCHIVE-RETRIEVAL-CONTRACT-V3E.md
      - .github/workflows/trash-v3e-retrieval-envelope.yml
      - scripts/trash/archive_v3d_external_checkpoint_review.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install offline ephemeral signature verifier
        run: python3 -m pip install 'cryptography>=44,<48'
      - name: Signed response challenge and fail-closed tests
        run: python3 -B -m unittest discover -s tests/trash -p 'test_archive_v3e_retrieval_envelope_review.py' -v
      - name: Previous V3d and V3b security regressions
        run: |
          python3 -B -m unittest discover -s tests/trash -p 'test_archive_v3d_external_checkpoint_review.py' -v
          python3 -B -m unittest discover -s tests/trash -p 'test_archive_v3b_signed_rollback_witness.py' -v
