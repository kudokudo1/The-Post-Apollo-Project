name: Connections C3e Forest installed B5c public HOLD is never protected custody

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eForestInstalledCandidateNonAdmissionCI.py'
      - 'tests/connections/test_connections_c3e_forest_installed_candidate_nonadmission.py'
      - '.github/workflows/connections-c3e-forest-installed-candidate-nonadmission-ci.yml'
      - 'docs/connections-c3e-forest-installed-candidate-nonadmission-ci.md'
      - 'scripts/forest/native_host_candidate_b5b.py'
      - 'tests/forest/native_ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-c3e-hold-parser:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and guard against accidental local authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eForestInstalledCandidateNonAdmissionCI.py \
            tests/connections/test_connections_c3e_forest_installed_candidate_nonadmission.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("tests/connections/c3e_release_trust/C3eForestInstalledCandidateNonAdmissionCI.py").read_text()
          app=Path("services/connections/ConnectionsBroker.qml").read_text()
          for marker in ("Ed25519PrivateKey", "sqlite3.connect(", "socket.socket(",
                         "subprocess.run(", '"productionSignInAllowed": True',
                         '"forestPrivateTitleDisclosureAllowed": True',
                         '"safeToRetry": True'):
              assert marker not in s, marker
          for marker in ("protected_forest_admission", "NOT_PROTECTED_OR_ENROLLED",
                         "HOLD_NO_INDEPENDENT_FOREST_CUSTODIAN_OR_PRIVATE_DATA",
                         '"forestPrivateTitleDisclosureAllowed": False',
                         '"forestListSessionsAllowed": False',
                         '"packageDigestIsOperatorEnrollment": False'):
              assert marker in s, marker
          assert "readonly property bool credentialActionsEnabled: false" in app
          print("C3E_FOREST_INSTALLED_CI // NO_ISSUER_OR_PRIVATE_DATA")
          PY
      - name: 23 strict public packet tests, 4 installed-specific tests skipped
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
          python3 -B tests/connections/test_connections_c3e_forest_installed_candidate_nonadmission.py
      - name: Original Forest B5b native candidate remains deny-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/forest \
            -p 'test_native_host_candidate_b5b.py' -v

  actual-fedora-rpm-installed-candidate:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the unchanged actual Forest B5c test RPM in Fedora
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum scripts/forest/native_host_candidate_b5b.py | cut -d ' ' -f1)"
          mkdir "$RUNNER_TEMP/c3e-forest-b5c"
          printf '%s\n' "$expected" > "$RUNNER_TEMP/c3e-forest-b5c.sha"
          docker run --rm \
            -e GITHUB_ACTIONS=true -e EXPECTED_SOURCE_SHA="$expected" \
            -v "$PWD:/source:ro" -v "$RUNNER_TEMP/c3e-forest-b5c:/out" \
            fedora:44 bash /source/tests/forest/native_ci/build_forest_host_ci.sh
      - name: Independent C3e parser consumes actual unprivileged RPM-installed packet
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/c3e-forest-b5c.sha")"
          docker run --rm \
            -e GITHUB_ACTIONS=true -e EXPECTED_SOURCE_SHA="$expected" \
            -v "$RUNNER_TEMP/c3e-forest-b5c:/input:ro" \
            -v "$PWD/tests/connections:/ci:ro" \
            fedora:44 bash -c '
              set -euo pipefail
              [[ "$GITHUB_ACTIONS" == true && -f /.dockerenv && "$(id -u)" == 0 ]]
              [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{64}$ ]]
              dnf -y install python3 util-linux
              name=post-apollo-forest-host-ci
              host=/usr/libexec/post-apollo/forest-ci/forest-host
              [[ ! -e "$host" ]]
              [[ "$(rpm -qp --qf "%{NAME}" /input/forest-host-ci.rpm)" == "$name" ]]
              [[ -z "$(rpm -qp --scripts /input/forest-host-ci.rpm)" ]]
              [[ -z "$(rpm -qp --triggers /input/forest-host-ci.rpm)" ]]
              rpm -Uvh /input/forest-host-ci.rpm
              [[ "$(sha256sum "$host" | cut -d " " -f1)" == "$EXPECTED_SOURCE_SHA" ]]
              rpm -V "$name"
              runuser -u nobody -- env \
                GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
                FOREST_B5C_INSTALLED=true EXPECTED_SOURCE_SHA="$EXPECTED_SOURCE_SHA" \
                /usr/bin/python3 -B \
                /ci/test_connections_c3e_forest_installed_candidate_nonadmission.py
              rpm -V "$name"
              rpm -e "$name"
              [[ ! -e "$host" ]]
              echo C3E_FOREST_B5C_NATIVE_HOLD_PASS_NO_ENROLLMENT
            '
