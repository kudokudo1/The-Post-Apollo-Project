name: Connections C3e synthetic signed custodian candidate remains HOLD (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eSignedCustodianCandidateCI.py'
      - 'tests/connections/test_connections_c3e_signed_custodian_candidate_ci.py'
      - '.github/workflows/connections-c3e-signed-custodian-candidate-ci.yml'
      - 'docs/connections-c3e-signed-custodian-candidate-ci.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-local-candidates-not-protected-settlement:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CI-only Ed25519 verification dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Refuse signer, transport, runtime activation and production privilege
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eSignedCustodianCandidateCI.py \
            tests/connections/test_connections_c3e_signed_custodian_candidate_ci.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("tests/connections/c3e_release_trust/C3eSignedCustodianCandidateCI.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          for forbidden in ("Ed25519PrivateKey", "socket.socket(",
                            "sqlite3.connect(", "subprocess.run(", "os.system(",
                            '"productionSignInAllowed": True',
                            '"safeToRetry": True'):
              assert forbidden not in s, forbidden
          for needed in ("Ed25519PublicKey.from_public_bytes(test_public_key).verify",
                         "C3E_CUSTODIAN_CANDIDATE_DISPOSABLE_ROOT_CI_ONLY",
                         "SIGNED_TEST_CANDIDATES_SAME_SEQUENCE_FORK_HOLD",
                         "SIGNED_TEST_CANDIDATES_MATCH_STILL_NOT_QUORUM_HOLD",
                         '"winner": None', '"safeActions": []',
                         "C3E_CUSTODIAN_CANDIDATE_NO_OPERATOR_ENROLLED_ROOT_OR_SIGNIN"):
              assert needed in s, needed
          assert "readonly property bool credentialActionsEnabled: false" in broker
          print("C3E_SYNTHETIC_CUSTODIAN_CI // SIGNATURE_IS_NOT_ENROLLED_CUSTODY")
          PY
      - name: 33 signing, tamper, exact primitive types, replay and protected HOLD cases
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "$(command -v python3)" -B \
            tests/connections/test_connections_c3e_signed_custodian_candidate_ci.py
          echo "C3E_SIGNED_TEST_CANDIDATE_NO_INDEPENDENT_ENROLLMENT"
      - name: Preserve prior C3e protected, split-brain and packet-origin refusals
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/test_connections_c3e_custodian_cutover_negative.py
          python3 -B -I tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py
          for test in \
            tests/connections/test_connections_c3e_split_store_rollback_witness.py \
            tests/connections/test_connections_c3e_split_brain_witness_dispute.py \
            tests/connections/test_connections_c3e_identity_packet_origin_nonadmission.py \
            tests/connections/test_connections_c3e_storage_independent_trust_boundary.py \
            tests/connections/test_connections_c3e_local_process_sigkill_recovery.py \
            tests/connections/test_connections_c3e_local_development_history_ledger.py
          do
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              "$(command -v python3)" -B "$test"
          done
          echo "C3E_SIGNED_CANDIDATE_HOLD // NO_ROOT_NO_REMOTE_SETTLEMENT"
