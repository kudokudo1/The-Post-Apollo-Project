name: Favorites++ U3 collections and ordered memberships

on:
  pull_request:
    paths:
      - "services/favorites/**"
      - "components/FavoritesCollection*.qml"
      - "components/FavoritesUnifiedPreview.qml"
      - "components/qmldir"
      - "widgets/TimeW.qml"
      - "tests/favorites/**"
      - "scripts/favorites/**"
      - ".github/workflows/favorites-universal-u3.yml"
  push:
    paths:
      - "services/favorites/**"
      - "components/FavoritesCollection*.qml"
      - "components/FavoritesUnifiedPreview.qml"
      - "components/qmldir"
      - "widgets/TimeW.qml"
      - "tests/favorites/**"
      - "scripts/favorites/**"
      - ".github/workflows/favorites-universal-u3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: U0, U1, U2 backward-compatible policy contracts
        run: |
          node --test tests/favorites/test_favorites_universal_u0.cjs
          node --test tests/favorites/test_favorites_universal_u1.cjs
          node --test tests/favorites/test_favorites_universal_u2.cjs
      - name: U3 bounded collections, independent memberships and UI contracts
        run: node --test tests/favorites/test_favorites_universal_u3.cjs
      - name: Existing Clock WORLD favorites remain authoritative
        run: |
          node tests/time/test_world_favorites_policy.cjs
          python3 tests/time/test_clock_world_favorites_contract.py

  native-collections:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install Quickshell 0.3.x and Xvfb
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf copr enable -y errornointernet/quickshell
          dnf install -y --setopt=install_weak_deps=False \
            quickshell qt6-qtdeclarative qt6-qt5compat qt6-qtbase-gui \
            qt6-qtsvg git nodejs coreutils findutils \
            xdotool xorg-x11-server-Xvfb
          quickshell --version
      - uses: actions/checkout@v4
      - name: Native CREATE click, ordered queue, restart and refusal
        run: bash scripts/favorites/verify_collections_fedora_u3.sh
