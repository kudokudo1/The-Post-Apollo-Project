name: Weather M28-T original NEWS and RADIO full visual parity

on:
  pull_request:
    paths:
      - 'widgets/weather/StationMediaSubjectPanelPolicy.js'
      - 'widgets/weather/StationNewsHub.qml'
      - 'widgets/weather/StationWorkspaceNavigationPolicy.js'
      - 'widgets/weather/StationSubjectNavigationPolicy.js'
      - 'tests/weather/test_media_full_visual_parity_m28t.js'
      - 'tests/weather/test_media_subject_panels_d1.js'
      - 'docs/weather-subjects-m28t-media-full-handoff.md'
      - '.github/workflows/weather-media-full-visual-parity-m28t.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete original NEWS tabs and RADIO controls in native MEDIA
        run: node --test tests/weather/test_media_full_visual_parity_m28t.js
      - name: Preserve D1, original catalog, source mapping and MEDIA to EARTH routes
        run: |
          node --test tests/weather/test_media_subject_panels_d1.js
          node --test tests/weather/test_index_media_catalog_cutover_m28j.js
          node --test tests/weather/test_index_radio_cutover_m28e.js
          node --test tests/weather/test_media_earth_mentions_cutover_m28a.js
      - name: Retrospectively verify merged M28-S full MAP, GROUND and bottom navigation
        run: |
          node --test tests/weather/test_map_full_visual_parity_m28s.js
          node --test tests/weather/test_earth_subject_panels_e1.js
          node --test tests/weather/test_index_earth_cutover_m28h.js
          node --test tests/weather/test_ground_full_visual_parity_m28q.js
          node --test tests/weather/test_workspace_landing_w1.js
          node --test tests/weather/test_subjects_first_pilot_m28n.js
      - name: Protect original source admission and video safe mode
        run: |
          node --test tests/weather/test_weather_subject_panels_m2a.js
          node --test tests/weather/test_weather_subject_panels_m2b.js
          node --test tests/weather/subject_navigation_contract.test.js
          node --test tests/weather/test_index_sources_cutover_m28l.js
