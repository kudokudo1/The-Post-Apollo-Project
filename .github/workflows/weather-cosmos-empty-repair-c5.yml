name: Weather COSMOS C5 empty-screen repair

on:
  pull_request:
    paths:
      - 'widgets/weather/StationWorkspaceSurface.qml'
      - 'widgets/weather/StationSky.qml'
      - 'widgets/weather/StationCosmosModesPane.qml'
      - 'widgets/weather/StationCosmosCivilCalendarPolicy.js'
      - 'tests/weather/test_cosmos_c5_empty_repair.js'
      - 'tests/weather/fixtures/C5FocusedNativeShell.qml'
      - 'scripts/weather/verify_cosmos_c5_native.sh'
      - '.github/workflows/weather-cosmos-empty-repair-c5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-route:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify C5 source/date/mode navigation
        run: |
          node --test tests/weather/test_cosmos_c5_empty_repair.js
          node --test tests/weather/test_cosmos_subject_panels_c1.js
          node --test tests/weather/test_workspace_landing_w1.js

  native-qml:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable native Quickshell
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git nodejs quickshell qt6-qpa-plugins \
            qml6-module-qtquick-effects coreutils findutils
          quickshell --version
      - uses: actions/checkout@v4
      - name: Cold-load SUN / ASTRONOMY / EVENTS without a running desktop
        run: bash scripts/weather/verify_cosmos_c5_native.sh
