name: Weather COSMOS V4a JPL relationship network

on:
  pull_request:
    paths:
      - 'widgets/weather/StationCosmosCelestialNetwork.qml'
      - 'widgets/weather/StationCosmosCelestialNetworkPolicy.js'
      - 'widgets/weather/StationCosmosHeliocentricPane.qml'
      - 'widgets/weather/StationCosmosHelioLabelPolicy.js'
      - 'widgets/weather/StationCosmosHelioScaleMotionPolicy.js'
      - 'tests/weather/test_cosmos_helio_au_motion_v5b.js'
      - 'tests/weather/test_cosmos_helio_labels_v5a.js'
      - 'widgets/weather/StationCosmosHeliocentricPolicy.js'
      - 'widgets/weather/StationCosmosSolarOverviewPolicy.js'
      - 'scripts/weather/celestial_solar_overview.py'
      - 'tests/weather/test_cosmos_solar_overview_v4d.js'
      - 'services/weather/CelestialVisualQueryPolicy.js'
      - 'scripts/weather/celestial_spatial_data.py'
      - 'scripts/weather/celestial_visual_data.py'
      - 'tests/weather/test_cosmos_heliocentric_spatial_v4c.js'
      - 'tests/weather/test_cosmos_heliocentric_viewport_v4e.js'
      - 'tests/weather/test_cosmos_heliocentric_camera_v4f.js'
      - 'tests/weather/test_magick_helio_render_network_modes_v4g.js'
      - 'tests/weather/test_magick_celestial_query_m5c.js'
      - 'widgets/weather/StationCosmosCelestialDepthPane.qml'
      - 'widgets/weather/StationCosmosCelestialDepthPolicy.js'
      - 'widgets/weather/StationMagickCelestialInstrument.qml'
      - 'tests/weather/test_cosmos_jpl_relationship_network_v4a.js'
      - 'tests/weather/test_cosmos_apparent_depth_v4b.js'
      - '.github/workflows/weather-cosmos-jpl-network-v4a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-source-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V4a source-verified JPL network model and pointer contract
        run: node --test tests/weather/test_cosmos_jpl_relationship_network_v4a.js
      - name: Verify V4b apparent geocentric AU depth data and shared selection
        run: node --test tests/weather/test_cosmos_apparent_depth_v4b.js
      - name: Verify V4c source-matched JPL HELIO XYZ and linked controls
        run: |
          node --test tests/weather/test_cosmos_heliocentric_spatial_v4c.js
          node --test tests/weather/test_magick_celestial_query_m5c.js
      - name: Verify V4d exact ten-body solar atlas and selectable AU rings
        run: node --test tests/weather/test_cosmos_solar_overview_v4d.js
      - name: Verify V4e outer-body viewport and truthful offscreen selection
        run: node --test tests/weather/test_cosmos_heliocentric_viewport_v4e.js
      - name: Verify V4f free HELIO pan and mouse-anchored extended zoom
        run: node --test tests/weather/test_cosmos_heliocentric_camera_v4f.js
      - name: Verify V4g HELIO render readiness and compact NETWORK mode controls
        run: node --test tests/weather/test_magick_helio_render_network_modes_v4g.js
      - name: Verify V5a readable focus and collision-aware HELIO labels
        run: node --test tests/weather/test_cosmos_helio_labels_v5a.js
      - name: Verify V5b AU ruler and source-exact JPL UTC sample dots
        run: node --test tests/weather/test_cosmos_helio_au_motion_v5b.js
      - name: Preserve MAGICK M4/M5 sources and interaction behavior
        run: |
          node --test tests/weather/test_magick_celestial_visual_m5.js
          node --test tests/weather/test_magick_celestial_bridge_m5b.js
          node --test tests/weather/test_magick_relations_timeline_m5g.js
          node --test tests/weather/test_magick_neon_scrubber_m5h.js
          node --test tests/weather/test_magick_wheel_interaction_m5j.js
