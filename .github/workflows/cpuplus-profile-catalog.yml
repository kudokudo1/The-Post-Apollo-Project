name: CPU++ profile catalog persistence
on:
  pull_request:
    paths:
      - 'scripts/cpuplus_profile_catalog.py'
      - 'tests/cpuplus/test_profile_catalog.py'
      - '.github/workflows/cpuplus-profile-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tests/cpuplus/test_profile_catalog.py
