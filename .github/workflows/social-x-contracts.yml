name: Social Browser Contracts

on:
  pull_request:
    paths:
      - "widgets/messanger/AppSelector.qml"
      - "widgets/messanger/MessagingW.qml"
      - "widgets/messanger/DiscordGeometry.py"
      - "widgets/messanger/XBrowser.py"
      - "tests/messaging/test_x_social_contracts.py"
      - "tests/messaging/test_social_browser_contracts.py"
      - ".github/workflows/social-x-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "widgets/messanger/AppSelector.qml"
      - "widgets/messanger/MessagingW.qml"
      - "widgets/messanger/DiscordGeometry.py"
      - "widgets/messanger/XBrowser.py"
      - "tests/messaging/test_x_social_contracts.py"
      - "tests/messaging/test_social_browser_contracts.py"
      - ".github/workflows/social-x-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Social browser family contracts
        run: |
          python3 tests/messaging/test_x_social_contracts.py
          python3 tests/messaging/test_social_browser_contracts.py
