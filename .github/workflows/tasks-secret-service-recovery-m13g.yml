name: TASKS M13g isolated Linux Secret Service recovery

on:
  pull_request:
    paths:
      - 'tests/tasks/fixtures/TaskSecretServiceProbeM13g.py'
      - 'tests/tasks/fixtures/TaskSecretServiceRoundTripM13g.cjs'
      - 'tests/tasks/fixtures/TaskSecretServiceIsolatedM13g.sh'
      - 'tests/tasks/test_task_secret_service_probe_m13g.py'
      - '.github/workflows/tasks-secret-service-recovery-m13g.yml'
      - 'docs/tasks-secret-service-key-provider-m13g.md'
      - 'services/hub/ApolloHubTodoStore.qml'
  push:
    branches: [main]
    paths:
      - 'tests/tasks/fixtures/TaskSecretServiceProbeM13g.py'
      - 'tests/tasks/fixtures/TaskSecretServiceRoundTripM13g.cjs'
      - 'tests/tasks/fixtures/TaskSecretServiceIsolatedM13g.sh'
      - '.github/workflows/tasks-secret-service-recovery-m13g.yml'

permissions:
  contents: read

jobs:
  isolated-real-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only D-Bus NameHasOwner probe never activates target service
        run: python3 -m unittest -v tests/tasks/test_task_secret_service_probe_m13g.py
      - name: Install Linux keyring ONLY in disposable GitHub runner
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dbus dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin
      - name: Actual Secret Service key storage and encrypted restart on isolated bus
        run: dbus-run-session -- bash tests/tasks/fixtures/TaskSecretServiceIsolatedM13g.sh
      - name: M13f authenticated encrypted fake draft and tamper refusal
        run: node --test tests/tasks/test_task_encrypted_recovery_m13f.cjs
      - name: M13e privacy policy stays unactivated
        run: node --test tests/tasks/test_task_draft_privacy_decision_m13e.cjs
      - name: M11d production one-writer and hard-disabled gates
        run: python3 tests/tasks/test_task_writer_gate_inventory_m11d.py
