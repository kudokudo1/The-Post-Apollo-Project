name: TimeW Scope A untrusted SwayPX lineage compatibility (HOLD only)

on:
  pull_request:
    paths:
      - 'tests/timew/TimeWScopeALineageDiagnosticShadow.py'
      - 'tests/timew/test_timew_scope_a_lineage_diagnostic_shadow.py'
      - 'docs/timew-scope-a-native-receipt-interface-rfc.md'
      - '.github/workflows/timew-scope-a-lineage-diagnostic-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-only-lineage-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic lineage comparison cannot confer authority
        run: python3 -B -I tests/timew/test_timew_scope_a_lineage_diagnostic_shadow.py
      - name: Preserve TimeW fractional observations and old integer storage
        run: |
          python3 -B -I tests/timew/test_machine_v2_fractional_observation_review.py
          python3 -B -I tests/timew/test_machine_v2_exact_logical_geometry.py
          python3 -B -I tests/timew/test_machine_geometry_store_v2.py
          python3 -B -I tests/timew/test_machine_v2_geometry_journal.py
