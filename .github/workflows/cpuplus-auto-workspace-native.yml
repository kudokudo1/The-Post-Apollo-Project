name: CPU++ AUTO native workspace composition
on:
  pull_request:
    paths:
      - 'widgets/cpuplus/CpuPlusAutoWorkspace.qml'
      - 'widgets/cpuplus/CpuPlusQueue*.qml'
      - 'widgets/cpuplus/CpuPlusQueue*.js'
      - 'services/memory/MemoryQueueSessionHost.js'
      - 'services/memory/memory_queue_*.py'
      - 'services/memory/memory_adjustment_queue.py'
      - 'tests/fixtures/cpuplus_queue_recovery_child.py'
      - 'tests/fixtures/CpuPlusAutoWorkspaceNative.qml'
      - 'tests/fixtures/CpuPlusRecoveryReviewNative.qml'
      - 'tests/cpuplus_auto_workspace_native.py'
      - '.github/workflows/cpuplus-auto-workspace-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt runtime
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 quickshell=0.3.2-1 qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects qml6-module-qtquick-shapes \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtqml
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native AUTO workspace fixture
        env:
          POST_APOLLO_QUEUE_PIPE_SMOKE: CI_DISPOSABLE_ONLY
        run: |
          set -eu
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          python3 -B tests/cpuplus_auto_workspace_native.py
