name: TASKS Proxy 1 M10b offline journal

on:
  pull_request:
    paths:
      - "services/projects/OfflineOperationJournal.js"
      - "tests/tasks/test_offline_operation_journal.cjs"
      - "docs/tasks-offline-journal-m10b.md"
      - ".github/workflows/tasks-offline-journal-contract.yml"
  push:
    branches:
      - main
    paths:
      - "services/projects/OfflineOperationJournal.js"
      - "tests/tasks/test_offline_operation_journal.cjs"
      - "docs/tasks-offline-journal-m10b.md"
      - ".github/workflows/tasks-offline-journal-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify journal invariants and restart recovery
        run: node tests/tasks/test_offline_operation_journal.cjs
