name: TimeW MACHINE fail-closed cross-resource recovery contract

on:
  pull_request:
    paths:
      - "services/time/MachineBraveCrossResourceRecoveryContract.py"
      - "tests/timew/test_machine_cross_resource_recovery_contract.py"
      - "docs/timew-machine-cross-resource-recovery-contract.md"
      - ".github/workflows/timew-machine-cross-resource-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unsafe cross-resource states, replay claims, and positive authority
        run: python3 -B -I tests/timew/test_machine_cross_resource_recovery_contract.py
      - name: Verify existing offline inventory, fixture journal and request-denial regressions
        run: |
          python3 -B -I tests/timew/test_machine_offline_transfer_recovery_contract.py
          python3 -B -I tests/timew/test_machine_fixture_recovery_journal.py
          python3 -B -I tests/timew/test_machine_brave_archive_admission_intent.py
