name: CPU++ queue R2 composed checkout fixture
on:
  pull_request:
    paths:
      - 'services/memory/memory_adjustment_queue.py'
      - 'services/memory/memory_queue_*.py'
      - 'widgets/cpuplus/CpuPlusQueueConsumer.js'
      - 'widgets/cpuplus/CpuPlusQueuePresentation.js'
      - 'tests/cpuplus/queue_r2_composed_fixture.py'
      - 'tests/cpuplus/test_queue_r2_composed.cjs'
      - 'services/memory/QUEUE-R2-COMPOSED.md'
      - '.github/workflows/cpuplus-queue-r2-composed.yml'
  push:
    branches: [main]
    paths:
      - 'services/memory/memory_adjustment_queue.py'
      - 'services/memory/memory_queue_*.py'
      - 'widgets/cpuplus/CpuPlusQueueConsumer.js'
      - 'widgets/cpuplus/CpuPlusQueuePresentation.js'
      - 'tests/cpuplus/queue_r2_composed_fixture.py'
      - 'tests/cpuplus/test_queue_r2_composed.cjs'
      - '.github/workflows/cpuplus-queue-r2-composed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise actual checkout modules together
        run: |
          set -eu
          git rev-parse HEAD
          node tests/cpuplus/test_queue_r2_composed.cjs "$PWD/services/memory" \
            widgets/cpuplus/CpuPlusQueueConsumer.js \
            widgets/cpuplus/CpuPlusQueuePresentation.js
