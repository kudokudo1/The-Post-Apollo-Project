  pull_request:
    paths:
      - "modules/Finance.qml"
      - "widgets/FinanceW.qml"
      - "widgets/FinanceChassisPolicy.js"
      - "widgets/FinanceToolHost.qml"
      - "tests/finance/test_finance_adaptive_chassis_contracts.py"
