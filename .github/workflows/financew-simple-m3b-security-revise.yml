name: FinanceW Simple M3b Nurse 2 security REVISE correction

on:
  pull_request:
    paths:
      - "scripts/finance/categorized_expense_guard.mjs"
      - "scripts/finance/write_categorized_expense.mjs"
      - "scripts/finance/categorized_expense_file_trust.mjs"
      - "scripts/finance/disposable_categorized_expense_roundtrip.mjs"
      - "tests/finance/test_categorized_expense_guard_m3b.mjs"
      - "tests/finance/test_categorized_expense_cli_m3b.mjs"
      - "tests/finance/test_categorized_expense_file_trust_m3b.mjs"
      - "tests/finance/test_categorized_expense_m3b_contracts.py"
      - ".github/workflows/financew-simple-m3b-security-revise.yml"
      - "scripts/finance/SIMPLE_MODE_M3B_SECURITY_REVISE_README.md"
  push:
    paths:
      - "scripts/finance/categorized_expense_guard.mjs"
      - "scripts/finance/write_categorized_expense.mjs"
      - "scripts/finance/categorized_expense_file_trust.mjs"
      - "scripts/finance/disposable_categorized_expense_roundtrip.mjs"
      - "tests/finance/test_categorized_expense_guard_m3b.mjs"
      - "tests/finance/test_categorized_expense_cli_m3b.mjs"
      - "tests/finance/test_categorized_expense_file_trust_m3b.mjs"
      - "tests/finance/test_categorized_expense_m3b_contracts.py"
      - ".github/workflows/financew-simple-m3b-security-revise.yml"
      - "scripts/finance/SIMPLE_MODE_M3B_SECURITY_REVISE_README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-policy-and-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and existing source-only isolation
        run: |
          node --check scripts/finance/categorized_expense_guard.mjs
          node --check scripts/finance/write_categorized_expense.mjs
          node --check scripts/finance/categorized_expense_file_trust.mjs
          node --check tests/finance/test_categorized_expense_file_trust_m3b.mjs
          python3 -B tests/finance/test_categorized_expense_m3b_contracts.py
      - name: Negative visibility, adversarial private files, and cross-writer recovery
        run: |
          node --test tests/finance/test_categorized_expense_guard_m3b.mjs
          node --test tests/finance/test_categorized_expense_file_trust_m3b.mjs
          node --test tests/finance/test_categorized_expense_cli_m3b.mjs
  real-actual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FINANCEW_DISPOSABLE_TEST: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Existing real-Actual source isolation
        run: |
          python3 -B tests/finance/test_finance_simple_m3d3_ci_isolation.py
          python3 -B tests/finance/test_finance_simple_m3d4_sigkill_isolation.py
      - name: Install pinned isolated Actual API and sync server
        run: |
          npm install --prefix scripts/finance --no-save --package-lock=false --no-audit --no-fund @actual-app/api@26.10.0 @actual-app/sync-server@26.10.0
      - name: Real Actual categorized roundtrip and visibility negative admission
        run: node scripts/finance/disposable_categorized_expense_roundtrip.mjs
      - name: Real Actual two-point SIGKILL and cross-writer recovery
        run: node scripts/finance/disposable_categorized_expense_sigkill.mjs
