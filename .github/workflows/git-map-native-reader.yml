name: Git map native reader lifetime
on:
  pull_request:
    paths:
      - "tests/git/test_git_map_reader_native.py"
      - "tests/git/fixtures/GitMapReaderCustodyNative.qml"
      - "tests/git/fixtures/git_map_reader_lock_probe.py"
      - ".github/workflows/git-map-native-reader.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 coreutils quickshell=0.3.2-1 qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml
      - uses: actions/checkout@v4
      - name: Native reader pipes, hidden views, handoff and owner SIGKILL
        run: python3 -B tests/git/test_git_map_reader_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
