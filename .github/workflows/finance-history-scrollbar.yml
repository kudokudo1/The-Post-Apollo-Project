name: Finance stock history scrollbar contracts

on:
  workflow_dispatch:
  push:
    paths:
      - "widgets/FinanceStockHistoryPane.qml"
      - "tests/components/test_finance_stock_history_scrollbar.py"
      - ".github/workflows/finance-history-scrollbar.yml"
  pull_request:
    paths:
      - "widgets/FinanceStockHistoryPane.qml"
      - "tests/components/test_finance_stock_history_scrollbar.py"
      - ".github/workflows/finance-history-scrollbar.yml"

permissions:
  contents: read

jobs:
  containment:
    name: Finance stock history rail and viewport clearance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stock history rail and chart gutter
        run: python3 -B tests/components/test_finance_stock_history_scrollbar.py
      - name: Audit all widget scrollbar coverage and Git/Hospital star policy
        run: python3 -B tests/components/test_neon_scrollbar_surface_migration.py
