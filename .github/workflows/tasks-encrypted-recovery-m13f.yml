name: TASKS M13f disposable encrypted recovery capability

on:
  pull_request:
    paths:
      - 'tests/tasks/fixtures/TaskEncryptedRecoveryM13f.cjs'
      - 'tests/tasks/test_task_encrypted_recovery_m13f.cjs'
      - 'docs/tasks-opt-in-encrypted-recovery-m13f.md'
      - '.github/workflows/tasks-encrypted-recovery-m13f.yml'
      - 'services/hub/ApolloHubTodoStore.qml'
  push:
    branches: [main]
    paths:
      - 'tests/tasks/fixtures/TaskEncryptedRecoveryM13f.cjs'
      - 'tests/tasks/test_task_encrypted_recovery_m13f.cjs'
      - '.github/workflows/tasks-encrypted-recovery-m13f.yml'

permissions:
  contents: read

jobs:
  disposable-encryption:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: M13f ephemeral AES-GCM and fresh-process fake-key recovery
        run: node --test tests/tasks/test_task_encrypted_recovery_m13f.cjs
      - name: M13e opt-in privacy proposal and no-power tests
        run: node --test tests/tasks/test_task_draft_privacy_decision_m13e.cjs
      - name: M13d explicit fake operator choice without actuation
        run: node --test tests/tasks/test_task_operator_draft_choice_m13d.cjs
      - name: M13c pinned evidence and review-age retention
        run: node --test tests/tasks/test_task_recovery_evidence_m13c.cjs
      - name: M13b read-only four-consumer recovery overlay
        run: node --test tests/tasks/test_task_recovery_display_m13b.cjs
      - name: M13a fresh-process synthetic stage review
        run: node --test tests/tasks/test_task_restart_review_m13a.cjs
      - name: M11d single authoritative live FileView and disabled flags
        run: python3 tests/tasks/test_task_writer_gate_inventory_m11d.py
