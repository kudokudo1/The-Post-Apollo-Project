[package]
name = "post-apollo-update-header"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
# Zellij invokes the WASI _start export from a command binary, not a cdylib.
name = "post_apollo_update_header"
path = "src/main.rs"

[dependencies]
zellij-tile = "=0.45.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
