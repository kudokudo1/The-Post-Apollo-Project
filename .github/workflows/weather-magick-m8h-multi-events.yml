name: MAGICK M8h multi-planet events and stations

on:
  pull_request:
    paths:
      - 'scripts/weather/celestial_transit_multi.py'
      - 'services/weather/CelestialTransitMultiService.qml'
      - 'widgets/weather/StationMagickTransitMultiPolicy.js'
      - 'widgets/weather/StationMagickTransitMultiPane.qml'
      - 'widgets/weather/StationMagickAstrologyPane.qml'
      - 'widgets/weather/StationMagickTransitChartPane.qml'
      - 'tests/weather/test_magick_transit_multi_m8h.py'
      - 'tests/weather/test_magick_transit_multi_ui_m8h.js'
      - 'tests/weather/fixtures/M8hNativeMultiTransitShell.qml'
      - 'scripts/weather/verify_magick_native_m8h.sh'
      - '.github/workflows/weather-magick-m8h-multi-events.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test station direction, repeated events and filtered multi-JPL search
        run: python3 -m unittest discover -s tests/weather -p 'test_magick_transit_multi_m8h.py' -v
      - name: Preserve M8f crossing precision and M8b natal geometry
        run: |
          python3 -m unittest discover -s tests/weather -p 'test_magick_transit_timeline_m8f.py' -v
          python3 -m unittest discover -s tests/weather -p 'test_magick_natal_engine_m8b.py' -v
  browser-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact-source contract, multi-tracks, filters and wheel handoff
        run: node --test tests/weather/test_magick_transit_multi_ui_m8h.js
      - name: Preserve WHEEL, TIMELINE, natal and UTC date contracts
        run: |
          node --test tests/weather/test_magick_transit_timeline_ui_m8g.js
          node --test tests/weather/test_magick_transit_comparison_m8c.js
          node --test tests/weather/test_magick_natal_integration_m8b.js
          node --test tests/weather/test_magick_date_location_m8d.js
  native-quickshell:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable real Quickshell and Qt imports
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git nodejs quickshell qt6-qpa-plugins coreutils findutils \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects
          quickshell --version
      - uses: actions/checkout@v4
      - name: Verify actual multi-line QML, filter binding and event selection
        run: bash scripts/weather/verify_magick_native_m8h.sh
