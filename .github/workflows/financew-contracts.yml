      - "tests/finance/test_finance_compact_grid_contracts.py"
      - "services/finance/FinanceSpreadsheetPolicy.js"
      - "widgets/FinanceDateInput.qml"
      - "widgets/FinanceMoneyInput.qml"
      - "tests/finance/test_finance_input_controls_contracts.py"
      - "services/finance/FinanceFundingSetupPlan.js"
      - "tests/finance/test_finance_funding_setup_contracts.py"
      - "tests/finance/test_finance_funding_write_ui_contracts.py"
      - "services/finance/FinanceFundingWriteService.qml"
      - "services/finance/**"
      - "widgets/FinanceMarketPane.qml"
      - "widgets/FinanceOsirisPane.qml"
      - "widgets/FinanceOsirisWebView.qml"
      - "tests/finance/test_finance_osiris_globe_contracts.py"
      - "scripts/finance/read_polymarket.mjs"
      - "tests/finance/test_polymarket_readonly.mjs"
      - "tests/finance/test_finance_market_contracts.py"
