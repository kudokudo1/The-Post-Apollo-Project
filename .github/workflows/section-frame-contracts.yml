name: "Section frame contracts"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "components/SurfaceFrame.qml"
      - "components/SectionFrame.qml"
      - "widgets/WorkflowLibraryView.qml"
      - "widgets/RepositoryProfileView.qml"
      - "widgets/HospitalChartsView.qml"
      - "widgets/GitRepositoryView.qml"
      - "components/qmldir"
      - "tests/components/test_section_frame_contracts.py"
      - ".github/workflows/section-frame-contracts.yml"
  pull_request:
    paths:
      - "components/SurfaceFrame.qml"
      - "components/SectionFrame.qml"
      - "widgets/WorkflowLibraryView.qml"
      - "widgets/RepositoryProfileView.qml"
      - "widgets/HospitalChartsView.qml"
      - "widgets/GitRepositoryView.qml"
      - "components/qmldir"
      - "tests/components/test_section_frame_contracts.py"
      - ".github/workflows/section-frame-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Section frame contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate reusable section frame contracts
        run: python3 tests/components/test_section_frame_contracts.py
