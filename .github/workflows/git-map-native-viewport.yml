name: Git map native viewport candidate
on:
  pull_request:
    paths:
      - "scripts/git_map_history_index.py"
      - "scripts/git_map_index_manager.py"
      - "widgets/git/GitMapControlHost.qml"
      - "widgets/git/GitMapCustodyController.qml"
      - "widgets/git/GitMapGenerationLease.qml"
      - "tests/git/test_git_map_shared_custody_native.py"
      - "tests/git/fixtures/GitMapSharedCustodyNative.qml"
      - "tests/git/fixtures/GitMapTransitionNative.qml"
      - "tests/git/fixtures/git_map_transition_probe.py"
      - "tests/git/test_git_map_transition_native.py"
      - "widgets/GitW.qml"
      - "tests/git/test_git_map_index_manager.py"
      - "tests/git/test_git_map_managed_native.py"
      - "tests/git/fixtures/GitMapManagedNative.qml"
      - "services/git/GitMapViewportPolicy.js"
      - "services/git/GitMapPageBridge.qml"
      - "widgets/git/GitMapVirtualViewport.qml"
      - "tests/git/test_git_map_viewport_native.py"
      - "tests/git/fixtures/GitMapVirtualViewportNative.qml"
      - ".github/workflows/git-map-native-viewport.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 nodejs coreutils xvfb xauth xdotool libxcb-cursor0 quickshell=0.3.2-1 qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects qml6-module-qtquick-shapes \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtqml
      - uses: actions/checkout@v4
      - name: Re-run history index and viewport contracts after Qt compatibility changes
        run: |
          python3 -B tests/git/test_git_map_history_index.py
          node tests/git/test_git_map_viewport.cjs
          python3 -B tests/git/test_git_map_index_manager.py
      - name: Offscreen asynchronous paging, boundary and merge continuity
        run: python3 -B tests/git/test_git_map_viewport_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
      - name: Isolated X11 star drag and wheel input
        run: xvfb-run -a -s "-screen 0 1280x720x24" python3 -B tests/git/test_git_map_viewport_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
          POST_APOLLO_GIT_MAP_INPUT: "1"
      - name: Managed index startup gate, explicit build and cache reuse
        run: python3 -B tests/git/test_git_map_managed_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
      - name: Shared custody on actual two managed map hosts
        run: python3 -B tests/git/test_git_map_shared_custody_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
      - name: In-flight page and locate repository transitions
        run: python3 -B tests/git/test_git_map_transition_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
