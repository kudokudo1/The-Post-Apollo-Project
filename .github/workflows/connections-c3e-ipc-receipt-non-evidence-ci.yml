name: Connections C3e IPC read-only receipt non-evidence (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eIpcReceiptNonEvidenceCI.py'
      - 'tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py'
      - '.github/workflows/connections-c3e-ipc-receipt-non-evidence-ci.yml'
      - 'docs/connections-c3e-ipc-receipt-non-evidence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipc-diagnostic-not-terminal-receipt:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original C3e CI signature dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Reject new native transport, production grants, and writable backend
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eIpcReceiptNonEvidenceCI.py \
            tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py
          python3 - <<'PY'
          from pathlib import Path
          source=Path("tests/connections/c3e_release_trust/C3eIpcReceiptNonEvidenceCI.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          for forbidden in ("socket.socket(", "sqlite3.connect(", "os.fork(",
                            "subprocess.run(", "Ed25519PrivateKey",
                            '"protectedCommitVerified": True',
                            '"safeToRetry": True',
                            '"productionSignInAllowed": True'):
              assert forbidden not in source, forbidden
          for needed in ("C3eLocalReadOnlyIpcProbe.py",
                         "HOLD_NO_AUTOMATIC_RETRY_REQUIRE_INDEPENDENT_CUSTODIAN",
                         "C3E_IPC_SETTLEMENT_NO_PROTECTED_RECEIPT_OR_SIGNIN_AUTHORITY",
                         '"safeToRetry": False', '"protectedTerminalReceiptVerified": False'):
              assert needed in source, needed
          assert "readonly property bool credentialActionsEnabled: false" in broker
          print("C3E_IPC_RECEIPT_NON_EVIDENCE // NO_REAL_SETTLEMENT_OR_SIGNIN")
          PY
      - name: 30 hostile diagnostic, refusal and unknown-delivery classifications
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py
          echo "C3E_IPC_30_DIAGNOSTIC_CASES // NO_TERMINAL_RECEIPT_OR_RETRY"
      - name: Preserve original C3e diagnostic, cutover, local-ledger and signer security tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          python3 -B -I tests/connections/test_connections_c3e_custodian_cutover_negative.py
          for test in \
            tests/connections/test_connections_c3e_local_readonly_ipc.py \
            tests/connections/test_connections_c3e_storage_independent_trust_boundary.py \
            tests/connections/test_connections_c3e_local_development_history_ledger.py \
            tests/connections/test_connections_c3e_operator_witness_history_continuity.py \
            tests/connections/test_connections_c3e_operator_witness_enrollment_preflight.py \
            tests/connections/test_connections_c3eaf_signed_role_enrollment.py \
            tests/connections/test_connections_c3ez_release_bound_host_evidence.py
          do
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              "$(command -v python3)" -B "$test"
          done
          echo "C3E_IPC_SETTLEMENT_HOLD // NOT_DOC6_SIGNED_NATIVE_COMMAND"
