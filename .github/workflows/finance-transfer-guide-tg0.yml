  pull_request:
    paths:
      - 'widgets/FinanceTransferGuidePolicy.js'
      - 'widgets/FinanceTransferGuidePane.qml'
      - 'widgets/FinanceAccountsPane.qml'
      - 'widgets/FinanceW.qml'
      - 'widgets/FinanceBankingPane.qml'
      - 'widgets/FinanceBankingAccountsPane.qml'
      - 'widgets/FinanceBankingProviderPane.qml'
      - 'widgets/FinanceBankingProviderPolicy.js'
      - 'widgets/FinanceBankingSessionJournalPolicy.js'
      - 'tests/finance/test_banking_session_journal_m4e.mjs'
      - 'tests/finance/test_banking_session_journal_m4e_contracts.py'
      - 'widgets/FinanceBankingOfficialHandoff.qml'
      - 'widgets/FinanceBankingOfficialHandoffPolicy.js'
      - 'tests/finance/test_banking_official_handoff_m4d.mjs'
      - 'tests/finance/test_banking_official_handoff_m4d_contracts.py'
      - 'tests/finance/test_banking_provider_m4.mjs'
      - 'tests/finance/test_banking_provider_m4_contracts.py'
      - 'tests/finance/test_banking_provider_m4b.mjs'
      - 'tests/finance/test_banking_provider_m4b_contracts.py'
      - 'tests/finance/test_banking_provider_m4c.mjs'
      - 'tests/finance/test_banking_provider_m4c_contracts.py'
      - 'widgets/FinanceBankingAccountsPolicy.js'
      - 'tests/finance/test_banking_accounts_m3.mjs'
      - 'tests/finance/test_banking_accounts_m3_contracts.py'
      - 'scripts/finance/banking_csv_reader.py'
      - 'tests/finance/test_banking_file_picker_m2.py'
      - 'tests/finance/test_banking_file_picker_m2_contracts.py'
      - 'widgets/FinanceBankingImportPolicy.js'
      - 'tests/finance/test_banking_import_m1.mjs'
      - 'tests/finance/test_banking_import_m1_contracts.py'
      - 'tests/finance/test_finance_transfer_guide_tg0.mjs'
      - 'tests/finance/test_finance_transfer_guide_tg0_contract.py'
