name: Weather COSMOS V2b USNO Planet Event Clock

on:
  pull_request:
    paths:
      - 'widgets/weather/StationCosmosPlanetEventPolicy.js'
      - 'widgets/weather/StationCosmosPlanetEventClock.qml'
      - 'widgets/weather/StationSky.qml'
      - 'tests/weather/test_cosmos_planet_event_clock_v2b.js'
      - 'tests/weather/test_cosmos_planet_event_inspector_v2c.js'
      - 'tests/weather/test_cosmos_planet_viewport_v2d.js'
      - '.github/workflows/weather-cosmos-planet-events-v2b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planet-event-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact USNO event data and live QML control contract
        run: |
          node --test tests/weather/test_cosmos_planet_event_clock_v2b.js
          node --test tests/weather/test_cosmos_planet_event_inspector_v2c.js
          node --test tests/weather/test_cosmos_planet_viewport_v2d.js
          node --test tests/weather/test_cosmos_visual_instruments_v2.js
          node --test tests/weather/test_cosmos_visual_interactions_v2r.js
          node --test tests/weather/test_cosmos_subject_panels_c1.js
          node --test tests/weather/test_workspace_left_rail_w1r.js
