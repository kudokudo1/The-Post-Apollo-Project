name: Forest Runtime R4c synchronous Qt consumer witness
on:
  pull_request:
    paths:
      - 'tests/forest/test_runtime_delivery_qt_r4c.py'
      - 'tests/forest/test_runtime_public_delivery_r4b.py'
      - 'scripts/forest/runtime_public_delivery_r4b.py'
      - 'scripts/forest/runtime_public_status_r4.py'
      - 'scripts/forest/runtime_events_r3.py'
      - 'widgets/forest/ui2/PublicRuntimeStatusDisplay.js'
      - 'scripts/forest/RUNTIME_DELIVERY_QT_R4C.md'
      - '.github/workflows/forest-runtime-delivery-qt-r4c.yml'
permissions:
  contents: read
jobs:
  synchronous-fixture-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Qt prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install Qt bindings
        run: python -m pip install "PySide6>=6.10,<6.12"
      - name: Actual producer and consumer on the same owner thread
        run: python -B tests/forest/test_runtime_delivery_qt_r4c.py
      - run: python3 -m unittest discover -s tests/forest -p 'test_runtime_public_delivery_r4b.py' -v
      - run: node tests/forest/test_ui22a_runtime_status.js
