name: TimeW MACHINE M2 atomic geometry persistence

on:
  pull_request:
    paths:
      - "services/time/MachineGeometryStoreV2.py"
      - "services/time/MachineGeometryV2.py"
      - "services/time/MachineCheckpointStore.py"
      - "tests/timew/test_machine_geometry_store_v2.py"
      - "tests/timew/test_machine_geometry_store_v2_contract.py"
      - "docs/timew-machine-m2-atomic-geometry-storage.md"
      - ".github/workflows/timew-machine-m2-geometry-storage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate dormant v2 owner and legacy preservation boundaries
        run: python3 -B -I tests/timew/test_machine_geometry_store_v2_contract.py
      - name: Test private SQLite geometry transaction, corruption and rollback
        run: python3 -B -I tests/timew/test_machine_geometry_store_v2.py
      - name: Preserve existing v1 checkpoint and v2 geometry projection
        run: |
          python3 -B -I tests/timew/test_machine_checkpoint_store.py
          python3 -B -I tests/timew/test_machine_geometry_v2.py
          python3 -B -I tests/timew/test_machine_session_identity_v2.py
