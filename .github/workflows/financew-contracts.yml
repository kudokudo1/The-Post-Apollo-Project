permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate FinanceW dock and blank portrait menu source
        run: python3 tests/components/test_finance_dock_contracts.py
      - name: Validate FinanceW navigation and reserved slots
        run: python3 tests/components/test_finance_navigation_contracts.py
      - name: Verify FinanceW M0 adaptive chassis and in-process tool host
        run: python3 tests/finance/test_finance_adaptive_chassis_contracts.py
      - name: Verify FinanceW M0 responsive geometry policy
        run: node tests/finance/test_finance_chassis_policy.mjs
      - name: Verify FinanceW Market M1 in-window read-only contracts
        run: python3 tests/finance/test_finance_market_contracts.py
      - name: Test FinanceW Market M1 public-feed normalizer (fictional fixtures)
        run: node tests/finance/test_polymarket_readonly.mjs
      - name: Verify FinanceW Market STOCKS mode and separate read-only service
        run: python3 tests/finance/test_finance_market_stocks_contracts.py
      - name: Test FinanceW Market STOCKS and SEC shared market cache
        run: node tests/finance/test_market_stocks_shared_hub.mjs
      - name: Verify FinanceW bounded historical range controls and source isolation
        run: python3 tests/finance/test_finance_market_range_contracts.py
      - name: Test EODHD historical ranges and local hub using fictional prices
        run: node tests/finance/test_market_price_range.mjs
      - name: Verify FinanceW DAY/RANGE mode selection and isolation
        run: python3 tests/finance/test_finance_day_range_contracts.py
      - name: Test FinanceW DAY/RANGE selection on fictional sessions
        run: node tests/finance/test_finance_stock_modes.mjs
      - name: Verify FinanceW chart point selection and no-fetch contracts
        run: python3 tests/finance/test_finance_chart_point_contracts.py
      - name: Test FinanceW chart point hit detection on fictional sessions
        run: node tests/finance/test_finance_chart_points.mjs
      - name: Verify FinanceW explicit RANGE to DAY source-bound handoff
        run: python3 tests/finance/test_stock_range_to_day_contracts.py
      - name: Test FinanceW exact RANGE session to DAY with fictional prices
        run: node tests/finance/test_stock_range_to_day.mjs
      - name: Verify FinanceW guarded BACK TO RANGE without additional reads
        run: python3 tests/finance/test_stock_back_to_range_contracts.py
      - name: Test FinanceW in-memory DAY to RANGE return with fictional prices
        run: node tests/finance/test_stock_back_to_range.mjs
      - name: Verify FinanceW FP1a hypothetical household calculations
        run: node tests/finance/test_finance_household_planning.mjs
      - name: Test FP1c v1 file read compatibility and guarded edits
        run: python3 tests/finance/test_household_plan_store_fp1c.py
      - name: Test FP1k.N1 saved versus missing preference provenance
