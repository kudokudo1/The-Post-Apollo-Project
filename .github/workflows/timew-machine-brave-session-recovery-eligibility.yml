name: TimeW MACHINE synthetic Brave restart recovery eligibility

on:
  pull_request:
    paths:
      - "integrations/machine/brave-topology/session-recovery-plan.mjs"
      - "tests/timew/test_machine_brave_session_recovery_plan.mjs"
      - "tests/timew/test_machine_brave_session_recovery_contract.py"
      - "docs/timew-machine-brave-session-recovery-eligibility.md"
      - ".github/workflows/timew-machine-brave-session-recovery-eligibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-recovery-eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic 2 // 5 // 6 normal window tab eligibility and no pairing
        run: node tests/timew/test_machine_brave_session_recovery_plan.mjs
      - name: No URL output, permission increase or capture actuation
        run: python3 -B -I tests/timew/test_machine_brave_session_recovery_contract.py
      - name: Preserve prior normal-window privacy and transient marker invalidation
        run: |
          node tests/timew/test_machine_brave_topology.mjs
          node tests/timew/test_machine_brave_marker_lifecycle.mjs
          python3 -B -I tests/timew/test_machine_brave_topology_contract.py
