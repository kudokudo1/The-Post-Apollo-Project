name: CPU++ memory navigation contract
on:
  pull_request:
    paths:
      - 'widgets/CpuPlusW.qml'
      - 'widgets/cpuplus/CpuPlusSystemTargetStrip.qml'
      - 'tests/cpuplus_system_target_native.py'
      - 'widgets/cpuplus/CpuPlusMemoryActuatorPane.qml'
      - 'widgets/cpuplus/CpuPlusProcessPane.qml'
      - 'widgets/cpuplus/CpuPlusProcessPresentation.js'
      - 'widgets/cpuplus/CpuPlusProfilePane.qml'
      - 'widgets/cpuplus/CpuPlusProfilePreview.js'
      - 'widgets/cpuplus/CpuPlusProfileCatalogStore.qml'
      - 'scripts/cpuplus_profile_catalog.py'
      - 'widgets/cpuplus/CpuPlusProfileCatalog.js'
      - 'widgets/cpuplus/CpuPlusProfileComparison.qml'
      - 'widgets/cpuplus/CpuPlusProfileComparison.js'
      - 'widgets/cpuplus/CpuPlusZramPolicyPane.qml'
      - 'widgets/cpuplus/CpuPlusZramPolicy.js'
      - 'widgets/cpuplus/CpuPlusAdvancedPolicyPane.qml'
      - 'widgets/cpuplus/CpuPlusAdvancedPolicy.js'
      - 'widgets/cpuplus/CpuPlusQueuePane.qml'
      - 'widgets/cpuplus/CpuPlusQueuePresentation.js'
      - 'widgets/cpuplus/CpuPlusQueueConsumer.js'
      - 'widgets/cpuplus/CpuPlusQueueRecovery.js'
      - 'widgets/cpuplus/CpuPlusQueueRecoveryPane.qml'
      - 'widgets/cpuplus/CpuPlusQueueHistory.js'
      - 'widgets/cpuplus/CpuPlusQueueHistoryPane.qml'
      - 'widgets/cpuplus/CpuPlusAutoWorkspace.qml'
      - 'services/memory/MemoryQueueSessionHost.js'
      - 'tests/cpuplus/test_diagnostic_continuity_native.py'
      - 'widgets/cpuplus/CpuPlusMemoryAddControl.qml'
      - 'tests/cpuplus_memory_navigation_test.js'
      - 'tests/cpuplus_memory_ui_native.py'
      - 'tests/fixtures/CpuPlusMemoryUiNative.qml'
      - 'tests/fixtures/CpuPlusProfileApplicationNative.qml'
      - 'components/SelectorSlider.qml'
      - 'components/SelectorDial.qml'
      - '.github/workflows/cpuplus-memory-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/cpuplus_memory_navigation_test.js
  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt runtime
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 quickshell=0.3.2-1 qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects qml6-module-qtquick-shapes \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtqml
      - uses: actions/checkout@v4
      - name: Load actual memory pane and selector components offscreen
        env:
          POST_APOLLO_MEMORY_UI_SMOKE: CI_DISPOSABLE_ONLY
        run: python3 -B tests/cpuplus_memory_ui_native.py
      - name: Verify actual SYSTEM filter glyph geometry and state contract
        env:
          POST_APOLLO_MEMORY_UI_SMOKE: CI_DISPOSABLE_ONLY
        run: python3 -B tests/cpuplus_system_target_native.py
