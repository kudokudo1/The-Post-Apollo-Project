name: FinanceW Market actual QML JavaScript import
on:
  pull_request:
    paths:
      - "widgets/FinanceStockRangeAnalysisPolicy.js"
      - "widgets/FinanceStockHistoryPane.qml"
      - "widgets/FinanceW.qml"
      - "widgets/FinanceMarketPane.qml"
      - "tests/finance/test_market_m46e1_legacy_mount_retirement.mjs"
      - "widgets/FinanceMarketDateControls.qml"
      - "widgets/FinanceStockModePolicy.js"
      - "services/finance/FinanceGlobalPriceService.qml"
      - "services/finance/FinanceAlphaVantageFreeService.qml"
      - "tests/finance/test_market_m46c_global_dates.mjs"
      - "widgets/FinanceStockDiscoveryPane.qml"
      - "widgets/FinanceGlobalPricePane.qml"
      - "widgets/FinanceAlphaVantageFreePane.qml"
      - "tests/finance/test_market_m46b_inline_geometry.py"
      - "tests/finance/test_market_m43b_qml_import.py"
      - ".github/workflows/financew-market-m43b-qml-import.yml"
  push:
    branches: [main]
    paths:
      - "widgets/FinanceStockRangeAnalysisPolicy.js"
      - "widgets/FinanceStockHistoryPane.qml"
      - "widgets/FinanceW.qml"
      - "widgets/FinanceMarketPane.qml"
      - "tests/finance/test_market_m46e1_legacy_mount_retirement.mjs"
      - "widgets/FinanceMarketDateControls.qml"
      - "widgets/FinanceStockModePolicy.js"
      - "services/finance/FinanceGlobalPriceService.qml"
      - "services/finance/FinanceAlphaVantageFreeService.qml"
      - "tests/finance/test_market_m46c_global_dates.mjs"
      - "widgets/FinanceStockDiscoveryPane.qml"
      - "widgets/FinanceGlobalPricePane.qml"
      - "widgets/FinanceAlphaVantageFreePane.qml"
      - "tests/finance/test_market_m46b_inline_geometry.py"
      - "tests/finance/test_market_m43b_qml_import.py"
      - ".github/workflows/financew-market-m43b-qml-import.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-qml-policy-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      QML_DISABLE_DISK_CACHE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - run: python -m pip install "PySide6>=6.10,<6.12"
      - run: python -B tests/finance/test_market_m43b_qml_import.py

      - run: python -B tests/finance/test_market_m46b_inline_geometry.py
