name: Social local organization structure v1

on:
  pull_request:
    paths:
      - 'services/social/SocialLocalOrganizationStructure*'
      - 'services/social/qmldir'
      - 'widgets/messanger/IdentityCenterLocalStructureEditor.qml'
      - 'widgets/messanger/IdentityCenterSettingsSections.qml'
      - 'widgets/messanger/AppSelector.qml'
      - 'tests/messaging/test_social_local_org_structure_v1.py'
      - '.github/workflows/social-local-org-structure-v1.yml'
      - 'MODEL/contracts/social-local-organization-structure-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Private structure catalog and existing Social/Identity regression tests
        run: |
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_org_structure_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_organizations.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_portfolios_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_org_links_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_identity_center_settings_sections.py' -v
      - name: Install disposable offscreen Qt engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
          python3 -m pip install --disable-pip-version-check 'PySide6==6.9.3'
      - name: Instantiate Organizations settings with real offscreen Qt
        run: python3 -m unittest discover -s tests/messaging -p 'test_identity_center_offscreen_qml_v0.py' -v
