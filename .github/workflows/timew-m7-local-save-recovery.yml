name: TimeW M7 local Save recovery (read-only HOLD)
on:
  pull_request:
    paths:
      - 'services/time/MachineV3LocalSaveRecovery.py'
      - 'services/time/MachineV3LocalCheckpointAdmission.py'
      - 'services/time/MachineV3LocalExactCaptureStore.py'
      - 'tests/timew/test_machine_v7_local_save_recovery.py'
      - 'docs/timew-m7-local-save-recovery.md'
      - '.github/workflows/timew-m7-local-save-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-save-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe both real disposable local databases
        run: python3 -B -I tests/timew/test_machine_v7_local_save_recovery.py
      - name: Preserve local storage and preview boundaries
        run: |
          python3 -B -I tests/timew/test_machine_v6_local_exact_checkpoint_admission.py
          python3 -B -I tests/timew/test_machine_v3_local_exact_capture_store.py
          python3 -B -I tests/timew/test_machine_v3_local_exact_capture_preview.py
          python3 -B -I tests/timew/test_machine_v5_local_preview_ui_bridge.py
          node tests/timew/test_machine_v5_local_preview_policy.cjs
          python3 -B -I tests/timew/test_machine_geometry_store_v2.py
          python3 -B -I tests/timew/test_machine_v2_geometry_journal.py
