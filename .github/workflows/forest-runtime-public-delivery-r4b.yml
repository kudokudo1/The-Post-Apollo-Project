name: Forest Runtime R4b local fixture delivery
on:
  pull_request:
    paths:
      - 'scripts/forest/runtime_public_delivery_r4b.py'
      - 'scripts/forest/runtime_public_status_r4.py'
      - 'scripts/forest/runtime_events_r3.py'
      - 'scripts/forest/shared_context_b6r1.py'
      - 'tests/forest/test_runtime_public_delivery_r4b.py'
      - 'tests/forest/test_runtime_public_status_r4.py'
      - 'tests/forest/test_runtime_events_r3.py'
      - 'scripts/forest/RUNTIME_PUBLIC_DELIVERY_R4B.md'
      - '.github/workflows/forest-runtime-public-delivery-r4b.yml'
  push:
    paths:
      - 'scripts/forest/runtime_public_delivery_r4b.py'
      - 'tests/forest/test_runtime_public_delivery_r4b.py'
      - 'scripts/forest/RUNTIME_PUBLIC_DELIVERY_R4B.md'
      - '.github/workflows/forest-runtime-public-delivery-r4b.yml'
jobs:
  ordered-fixture-callback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/forest -p 'test_runtime_public_delivery_r4b.py' -v
      - run: python3 -m unittest discover -s tests/forest -p 'test_runtime_public_status_r4.py' -v
      - run: python3 -m unittest discover -s tests/forest -p 'test_runtime_events_r3.py' -v
      - run: python3 -m py_compile scripts/forest/runtime_public_delivery_r4b.py tests/forest/test_runtime_public_delivery_r4b.py
