name: Shared Effect Teardown Contracts

on:
  pull_request:
    paths:
      - "components/SafeDropShadow.qml"
      - "components/DockButton.qml"
      - "components/ConversationFeed.qml"
      - "widgets/GitW.qml"
      - "components/qmldir"
      - "widgets/notifications/NotificationsHubW.qml"
      - "widgets/weather/StationHome.qml"
      - "tests/components/test_safe_shadow_teardown_contracts.py"
      - ".github/workflows/shared-effect-teardown-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "components/SafeDropShadow.qml"
      - "components/DockButton.qml"
      - "components/ConversationFeed.qml"
      - "widgets/GitW.qml"
      - "components/qmldir"
      - "widgets/notifications/NotificationsHubW.qml"
      - "widgets/weather/StationHome.qml"
      - "tests/components/test_safe_shadow_teardown_contracts.py"
      - ".github/workflows/shared-effect-teardown-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate shared effect teardown contracts
        run: python3 tests/components/test_safe_shadow_teardown_contracts.py
