name: Weather COSMOS C42 SPACE runtime dashboard
on:
  pull_request:
    paths:
      - 'widgets/weather/StationCosmosSpaceWeatherHubPane.qml'
      - 'widgets/weather/StationCosmosSubjectPane.qml'
      - 'widgets/weather/StationSpace.qml'
      - 'services/weather/WeatherRuntimePolicy.js'
      - 'tests/weather/test_cosmos_c42_space_runtime_dashboard.js'
      - 'tests/weather/fixtures/C42SpaceRuntimeNativeShell.qml'
      - '.github/workflows/weather-cosmos-c42-space-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify compact C42 dashboard and existing runtime contracts
        run: |
          node --test \
            tests/weather/test_cosmos_c42_space_runtime_dashboard.js \
            tests/weather/test_weather_live_runtime_m1.js \
            tests/weather/test_weather_live_runtime_m2.js \
            tests/weather/test_weather_live_runtime_m3.js \
            tests/weather/test_cosmos_subject_panels_c1.js
  native-space:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install isolated Quickshell and Qt QML
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git quickshell qt6-qpa-plugins \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects \
            coreutils findutils
      - uses: actions/checkout@v4
      - name: Prove fixed SPACE metrics, service runtime table, and reports
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/cosmos-c42.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services" "$work/config/services"
          cp "$root/tests/weather/fixtures/C42SpaceRuntimeNativeShell.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 32s \
            env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            quickshell --no-color -p "$work/config/shell.qml" \
            > "$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "C42_NATIVE_PASS // FOUR_METRICS_ELEVEN_RUNTIME_ROWS_REPORT_DIRECTORY" "$work/native.log"
          if grep -E 'C42_NATIVE_FAIL|Failed to load configuration|ReferenceError|TypeError|Cannot assign' "$work/native.log"; then
            exit 1
          fi
