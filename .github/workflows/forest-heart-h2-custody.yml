name: Forest Heart H2 custody CI
on:
  pull_request:
    paths:
      - 'scripts/forest/heart_resource_custody_h2.py'
      - 'scripts/forest/HEART_RESOURCE_CUSTODY_H2.md'
      - 'scripts/forest/heart_dispatch_reference_h1.py'
      - 'scripts/forest/model_binding_i2.py'
      - 'scripts/forest/model_form_routing_i1.py'
      - 'scripts/forest/resource_governor_p1.py'
      - 'scripts/forest/shared_context_b6r1.py'
      - 'tests/forest/test_heart_resource_custody_h2.py'
      - 'tests/forest/test_heart_dispatch_reference_h1.py'
      - '.github/workflows/forest-heart-h2-custody.yml'
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_heart_resource_custody_h2.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_heart_dispatch_reference_h1.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_model_binding_i2.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_resource_governor_p1.py' -v
      - run: python3 -m py_compile scripts/forest/heart_resource_custody_h2.py tests/forest/test_heart_resource_custody_h2.py
