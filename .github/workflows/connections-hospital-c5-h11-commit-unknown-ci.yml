name: Connections DOC 4 C5-H11 original PX COMMIT unknown outcome HOLD

on:
  pull_request:
    paths:
      - 'services/connections/hospital/HospitalNativeIssuerService.py'
      - 'tests/connections/hospital_c5/test_hospital_c5h11_commit_unknown_hold.py'
      - '.github/workflows/connections-hospital-c5-h11-commit-unknown-ci.yml'
      - 'docs/connections-hospital-c5-h11-commit-unknown-hold.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-px-commit-unknown-terminal:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin disposable verifier dependency
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Assert actual signing gate remains first
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            services/connections/hospital/HospitalNativeIssuerService.py \
            tests/connections/hospital_c5/test_hospital_c5h11_commit_unknown_hold.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("services/connections/hospital/HospitalNativeIssuerService.py").read_text()
          step=p[p.index("def _native_step(client, policy):"):p.index("def _commit_with_terminal_receipt_or_unknown(")]
          assert step.index("_require_independent_room_consent(request, prepared, peer, first_seat)") < step.index("key = C.load_installed_key()")
          assert step.index("key = C.load_installed_key()") < step.index("return _commit_with_terminal_receipt_or_unknown(")
          assert 'C.deny("INDEPENDENT_EXACT_ROOM_HUMAN_CONSENT_UNAVAILABLE")' in p
          commit=p[p.index("def _commit_with_terminal_receipt_or_unknown("):p.index("def main():")]
          assert commit.count("_writer_exchange(") == 1
          assert "C.validate_commit_receipt(" in commit
          assert "PX_COMMIT_OUTCOME_UNKNOWN_HOLD_NO_AUTO_RETRY" in commit
          assert "load_installed_key" not in commit
          assert "sqlite3" not in commit
          print("C5H11_ORIGINAL_COMMIT // HARD_CONSENT_PRE_KEY_AND_NO_RETRY")
          PY
      - name: 20 exact original COMMIT terminal outcomes, missing ACK and no retry
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/hospital_c5/test_hospital_c5h11_commit_unknown_hold.py
          echo "C5H11_PX_COMMIT_ACK // CONFIRMED_OR_UNKNOWN_HOLD"
      - name: Keep original Hospital C5 hard-gate and resource-security regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/hospital_c5/test_hospital_c5_native_consent_hard_hold.py
          python3 -B -I tests/connections/hospital_c5/test_hospital_c5h10_ancillary_fd_cleanup.py
          python3 -B -I tests/connections/test_connections_hospital_doc4_consent_details.py
          echo "C5H11_INHERITED_H4_H10_CONTEXT // HOLD"
