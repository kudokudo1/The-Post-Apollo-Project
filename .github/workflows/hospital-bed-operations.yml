name: Hospital / Bed Operations

on:
  pull_request:
    paths:
      - scripts/hospital-bed-operations.py
      - tests/hospital/test_bed_operations.py
      - tests/hospital/test_bed_operations_bridge.js
      - services/hospital/HospitalBedRecoveryOperationService.qml
      - widgets/HospitalBedRecoveryDialog.qml
      - widgets/HospitalW.qml
      - services/hospital/HospitalFloorService.qml
      - .github/workflows/hospital-bed-operations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bed-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python helper and test
        run: |
          python3 -m py_compile scripts/hospital-bed-operations.py
          python3 -m py_compile tests/hospital/test_bed_operations.py
      - name: Run disposable Git worktree safety regressions
        run: python3 -m unittest discover -s tests/hospital -p test_bed_operations.py -v
      - name: Test register/create UI operation bridge
        run: node tests/hospital/test_bed_operations_bridge.js
