name: MAGICK M1 JPL ephemeris backend
on:
  pull_request:
    paths:
      - 'scripts/weather/celestial_contract.py'
      - 'scripts/weather/celestial_solver.py'
      - 'tests/weather/test_celestial_contract_m0.py'
      - 'tests/weather/test_celestial_solver_m1.py'
      - '.github/workflows/weather-magick-jpl-skyfield-m1.yml'
  push:
    paths:
      - 'scripts/weather/celestial_contract.py'
      - 'scripts/weather/celestial_solver.py'
      - 'tests/weather/test_celestial_contract_m0.py'
      - 'tests/weather/test_celestial_solver_m1.py'
      - '.github/workflows/weather-magick-jpl-skyfield-m1.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: M0 and M1 offline tests
        run: |
          python3 -m unittest discover -s tests/weather -p 'test_celestial_contract_m0.py' -v
          python3 -m unittest discover -s tests/weather -p 'test_celestial_solver_m1.py' -v
  de440s-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated ephemeris runtime
        run: python3 -m pip install 'skyfield==1.55'
      - name: Obtain real JPL DE440s on temporary CI runner
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 --silent --show-error \
            'https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp' \
            --output "$RUNNER_TEMP/de440s.bsp"
          test "$(stat -c %s "$RUNNER_TEMP/de440s.bsp")" -gt 30000000
      - name: Run real JPL numerical and boundary tests
        env:
          MAGICK_M1_KERNEL: ${{ runner.temp }}/de440s.bsp
        run: python3 -m unittest discover -s tests/weather -p 'test_celestial_solver_m1.py' -v
