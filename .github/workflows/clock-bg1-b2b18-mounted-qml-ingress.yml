name: Clock BG1-B2B18 mounted QML native ingress trust hold
on:
  pull_request:
    paths:
      - "services/time/AlarmManagerService.qml"
      - "services/time/AlarmNativeBridgeInboundPolicy.js"
      - "services/time/BG1-ALARM-MOUNTED-QML-NATIVE-INGRESS.md"
      - "tests/time/test_clock_bg1_b2b18_qml_receiver.cjs"
      - ".github/workflows/clock-bg1-b2b18-mounted-qml-ingress.yml"
  push:
    paths:
      - "services/time/AlarmManagerService.qml"
      - "services/time/AlarmNativeBridgeInboundPolicy.js"
      - "services/time/BG1-ALARM-MOUNTED-QML-NATIVE-INGRESS.md"
      - "tests/time/test_clock_bg1_b2b18_qml_receiver.cjs"
      - ".github/workflows/clock-bg1-b2b18-mounted-qml-ingress.yml"
permissions:
  contents: read
jobs:
  default-off-receiver-and-candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise actual mounted QML observer and strict untrusted frame policy
        run: node --test tests/time/test_clock_bg1_b2b18_qml_receiver.cjs
      - name: Preserve QML private save drain and oldest writer guards
        run: |
          node --test tests/time/test_clock_bg1_b2b15_mounted_save_drain.cjs
          node --test tests/time/test_clock_bg1_b2b6_mounted_barrier.cjs
          node --test tests/time/test_clock_bg1_b2b4_writer_quiescence.cjs
      - name: Preserve alarm save and note crash recovery
        run: |
          python3 -m unittest discover -s tests/time -p 'test_clock_alarm_manager_v2_contract.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_alarm_note_recovery_contract.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_alarm_reliability_popup_actions_contract.py' -v
      - name: Preserve B2B17 signed native bridge
        run: |
          python3 -m pip install cryptography==46.0.4
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b17_signed_bridge_channel.py' -v
      - name: Exact eight-file Clock-only review boundary
        run: |
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines())
          expected={
              "services/time/AlarmManagerService.qml",
              "services/time/AlarmNativeBridgeInboundPolicy.js",
              "services/time/BG1-ALARM-MOUNTED-QML-NATIVE-INGRESS.md",
              "tests/time/test_clock_bg1_b2b18_qml_receiver.cjs",
              ".github/workflows/clock-bg1-b2b18-mounted-qml-ingress.yml",
              ".github/workflows/clock-bg1-b2b4-writer-quiescence.yml",
              ".github/workflows/clock-bg1-b2b6-mounted-barrier.yml",
              ".github/workflows/clock-bg1-b2b15-mounted-save-drain.yml"}
          assert changed==expected, f"Unapproved Clock scope: {sorted(changed ^ expected)}"
          print("Eight Clock-only files; no installed keys, native source changes, systemd, Identity, Connections or BG2: PASS")
          PY
