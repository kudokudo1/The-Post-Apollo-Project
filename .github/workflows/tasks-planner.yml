name: Tasks Planner
on:
  pull_request:
    paths:
      - 'widgets/tasks/TaskPlanner*'
      - 'widgets/TasksW.qml'
      - 'tests/tasks/test_task_planner*'
      - 'tests/fixtures/TaskPlannerPreview.qml'
      - '.github/workflows/tasks-planner.yml'
  push:
    paths:
      - 'widgets/tasks/TaskPlanner*'
      - 'widgets/TasksW.qml'
      - 'tests/tasks/test_task_planner*'
      - 'tests/fixtures/TaskPlannerPreview.qml'
      - '.github/workflows/tasks-planner.yml'
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/tasks/test_task_planner_ui_contracts.py
      - run: node tests/tasks/test_task_planner_policy.cjs
      - run: python3 tests/tasks/test_task_planner_preview.py
      - run: python3 tests/tasks/test_task_planner_layout.py
      - run: python3 tests/tasks/test_task_planner_mount.py
      - run: python3 tests/tasks/test_task_planner_week_day_ui.py
