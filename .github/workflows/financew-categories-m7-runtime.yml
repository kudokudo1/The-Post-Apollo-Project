name: FinanceW Categories M7 real-pane Qt smoke

on:
  pull_request:
    paths:
      - "widgets/FinanceCategoriesPane.qml"
      - "services/finance/FinanceCategoryGroupPlan.js"
      - "tests/finance/finance_categories_m7_runtime_harness.qml"
      - "tests/finance/test_finance_categories_m7_qt_runtime.py"
      - ".github/workflows/financew-categories-m7-runtime.yml"
  push:
    branches: [main]
    paths:
      - "widgets/FinanceCategoriesPane.qml"
      - "services/finance/FinanceCategoryGroupPlan.js"
      - "tests/finance/finance_categories_m7_runtime_harness.qml"
      - "tests/finance/test_finance_categories_m7_qt_runtime.py"
      - ".github/workflows/financew-categories-m7-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  categories-real-qml:
    name: Actual Categories pane in offscreen Qt, fictional data only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Qt prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install pinned-range PySide6 bindings
        run: python -m pip install "PySide6>=6.10,<6.12"
      - name: Exercise actual Categories QML without financial write services
        run: python tests/finance/test_finance_categories_m7_qt_runtime.py
