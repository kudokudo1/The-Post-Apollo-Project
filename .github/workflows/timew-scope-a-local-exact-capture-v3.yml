name: TimeW Scope A local-only exact fractional captures (non-authorizing)

on:
  pull_request:
    paths:
      - 'services/time/MachineV3LocalExactCaptureStore.py'
      - 'tests/timew/test_machine_v3_local_exact_capture_store.py'
      - 'docs/timew-scope-a-local-first-exact-capture-v3.md'
      - '.github/workflows/timew-scope-a-local-exact-capture-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-local-data-not-native-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test new isolated local-only exact capture storage
        run: python3 -B -I tests/timew/test_machine_v3_local_exact_capture_store.py
      - name: Recheck existing exact values and hold-only observation semantics
        run: |
          python3 -B -I tests/timew/test_machine_v2_exact_logical_geometry.py
          python3 -B -I tests/timew/test_machine_v2_fractional_observation_review.py
      - name: Verify historical geometry checkpoint and crash journal are untouched
        run: |
          python3 -B -I tests/timew/test_machine_geometry_store_v2.py
          python3 -B -I tests/timew/test_machine_v2_geometry_journal.py
