name: Identity Center signed native command receipt and client v0

on:
  pull_request:
    paths:
      - 'services/identity/signed_command_receipt_v0.py'
      - 'services/identity/desktop_signed_command_client_v0.py'
      - 'services/identity/signed_gateway_origin_probe_v0.py'
      - 'services/identity/desktop_command_gateway_v0.py'
      - 'tests/identity/test_desktop_signed_command_client_v0.py'
      - 'tests/identity/test_signed_gateway_origin_probe_v0.py'
      - '.github/workflows/identity-center-signed-command-client-v0.yml'
      - 'docs/identity-center-signed-command-client-v0.md'
      - 'docs/identity-center-gateway-origin-probe-v1.md'
  push:
    branches: [main, 'feat/identity-signed-receipt-*']
    paths:
      - 'services/identity/signed_command_receipt_v0.py'
      - 'services/identity/desktop_signed_command_client_v0.py'
      - 'services/identity/signed_gateway_origin_probe_v0.py'
      - 'services/identity/desktop_command_gateway_v0.py'
      - 'tests/identity/test_desktop_signed_command_client_v0.py'
      - 'tests/identity/test_signed_gateway_origin_probe_v0.py'
      - '.github/workflows/identity-center-signed-command-client-v0.yml'
      - 'docs/identity-center-signed-command-client-v0.md'
      - 'docs/identity-center-gateway-origin-probe-v1.md'

permissions:
  contents: read

jobs:
  signed-host-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing approved Python cryptographic primitive
        run: python3 -m pip install cryptography==46.0.4
      - name: Compile signed native command client/gateway
        run: |
          python3 -m py_compile services/identity/desktop_command_gateway_v0.py
          python3 -m py_compile services/identity/signed_command_receipt_v0.py
          python3 -m py_compile services/identity/desktop_signed_command_client_v0.py
          python3 -m py_compile services/identity/signed_gateway_origin_probe_v0.py
          python3 -m py_compile tests/identity/test_signed_gateway_origin_probe_v0.py
          python3 -m py_compile tests/identity/test_desktop_signed_command_client_v0.py
      - name: Signed real AF_UNIX receipt, actual host callback and adversarial trust tests
        run: python3 -m unittest discover -s tests/identity -p 'test_desktop_signed_command_client_v0.py' -v
      - name: Signed Identity gateway enrollment and actual Linux PID/start/argv/script measurement
        run: python3 -m unittest discover -s tests/identity -p 'test_signed_gateway_origin_probe_v0.py' -v
      - name: Existing unsigned disposable gateway and Identity Center lifecycle
        run: |
          python3 -m unittest discover -s tests/identity -p 'test_desktop_command_gateway_v0.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_desktop_host_lifecycle_v0.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_desktop_session_host_v0.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_private_context_ipc_v0.py' -v
      - name: CPU++ still permanently deny-only before installed attestation and real C5 consent
        run: |
          node tests/cpuplus/test_cpuplus_universal_signin_host_boundary_v4.cjs
          node tests/cpuplus/test_cpuplus_universal_signin_intent_v5.cjs
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_identity_host_seam_v6.py' -v
