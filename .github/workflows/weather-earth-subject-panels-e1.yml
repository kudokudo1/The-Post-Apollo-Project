name: Weather Station EARTH E1 real event and dossier subject panels

on:
  pull_request:
    paths:
      - 'widgets/weather/StationEarthSubjectPanelPolicy.js'
      - 'widgets/weather/StationEarthSubjectPane.qml'
      - 'widgets/weather/StationDiscovery.qml'
      - 'widgets/weather/StationSubjectNavigator.qml'
      - 'widgets/weather/WeatherStationW.qml'
      - 'tests/weather/test_earth_subject_panels_e1.js'
      - '.github/workflows/weather-earth-subject-panels-e1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earth-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all subject contracts and EARTH provider/inspector reuse
        run: |
          node --test tests/weather/subject_navigation_contract.test.js
          node --test tests/weather/subject_navigation_browser.test.js
          node --test tests/weather/test_weather_subject_panels_m2a.js
          node --test tests/weather/test_weather_subject_panels_m2b.js
          node --test tests/weather/test_cosmos_subject_panels_c1.js
          node --test tests/weather/test_earth_subject_panels_e1.js
