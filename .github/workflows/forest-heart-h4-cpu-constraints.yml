name: Forest Heart H4 CPU constraints CI
on:
  pull_request:
    paths:
      - 'scripts/forest/heart_cpu_constraints_h4.py'
      - 'scripts/forest/HEART_CPU_CONSTRAINTS_H4.md'
      - 'scripts/forest/cgroup_observation_i5.py'
      - 'tests/forest/test_heart_cpu_constraints_h4.py'
      - '.github/workflows/forest-heart-h4-cpu-constraints.yml'
permissions:
  contents: read
jobs:
  cpu-constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_heart_cpu_constraints_h4.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_cgroup_observation_i5.py' -v
      - run: python3 -B -m unittest discover -s tests/forest -p 'test_heart_memory_headroom_h3.py' -v
      - run: python3 -m py_compile scripts/forest/heart_cpu_constraints_h4.py tests/forest/test_heart_cpu_constraints_h4.py
