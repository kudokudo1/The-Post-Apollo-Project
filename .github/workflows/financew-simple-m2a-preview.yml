name: FinanceW Simple M2a envelope move read-only preview

on:
  pull_request:
    paths:
      - "services/finance/FinanceEnvelopeMovePlan.js"
      - "widgets/FinanceEnvelopeMovePreviewPane.qml"
      - "tests/finance/test_finance_envelope_move_plan_m2a.mjs"
      - "tests/finance/test_finance_envelope_move_m2a_contracts.py"
      - "tests/finance/finance_envelope_move_m2a_runtime_harness.qml"
      - "tests/finance/test_finance_envelope_move_m2a_qt_runtime.py"
      - ".github/workflows/financew-simple-m2a-preview.yml"
  push:
    branches: [main]
    paths:
      - "services/finance/FinanceEnvelopeMovePlan.js"
      - "widgets/FinanceEnvelopeMovePreviewPane.qml"
      - "tests/finance/test_finance_envelope_move_plan_m2a.mjs"
      - "tests/finance/test_finance_envelope_move_m2a_contracts.py"
      - "tests/finance/finance_envelope_move_m2a_runtime_harness.qml"
      - "tests/finance/test_finance_envelope_move_m2a_qt_runtime.py"
      - ".github/workflows/financew-simple-m2a-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-policy:
    name: M2a conservation, negative-balance and no-write contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test fictional envelope move math and source guards
        run: node --test tests/finance/test_finance_envelope_move_plan_m2a.mjs
      - name: Verify dormant preview UI and absent writer
        run: python3 -B tests/finance/test_finance_envelope_move_m2a_contracts.py

  actual-pane:
    name: M2a actual envelope move QML in offscreen Qt, fictional data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Qt prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install pinned-range PySide6 Qt bindings
        run: python -m pip install "PySide6>=6.10,<6.12"
      - name: Exercise actual view-only envelope move pane
        run: python tests/finance/test_finance_envelope_move_m2a_qt_runtime.py
