# Post-Apollo // Super-key widget toggles (OPT-IN Sway include)
#
# Include this file from the operator's real Sway config only AFTER reviewing
# existing Mod4 bindings for collisions. This file is not auto-installed.
#
# Sway is the global key owner; Quickshell's existing controlMenus IPC target
# toggles the SAME panel instance that its taskbar dock opens.
# Mod4 = physical Super / Windows key. --no-repeat prevents held-key flicker.
# No standalone focus mode, Sway keymap rewrite, daemon, or service required.

bindsym --no-repeat Mod4+t         exec qs ipc call controlMenus todo
bindsym --no-repeat Mod4+m         exec qs ipc call controlMenus social
bindsym --no-repeat Mod4+Shift+m   exec qs ipc call controlMenus finance
bindsym --no-repeat Mod4+n         exec qs ipc call controlMenus notifications
bindsym --no-repeat Mod4+a         exec qs ipc call controlMenus apolloHub
bindsym --no-repeat Mod4+Shift+t   exec qs ipc call controlMenus clock
bindsym --no-repeat Mod4+Shift+w   exec qs ipc call controlMenus weatherStation
bindsym --no-repeat Mod4+r         exec qs ipc call controlMenus media
