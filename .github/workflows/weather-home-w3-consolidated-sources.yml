name: Weather HOME W3 consolidated SOURCES and non-scrolling HISTORY

on:
  pull_request:
    paths:
      - 'widgets/weather/StationHome.qml'
      - 'widgets/weather/StationWeatherSubjectPanelPolicy.js'
      - 'widgets/weather/StationWeatherSubjectPane.qml'
      - 'widgets/weather/StationWeatherServicesPane.qml'
      - 'tests/weather/test_weather_w5_canonical_services.js'
      - 'tests/weather/test_weather_w4_services_history.js'
      - 'tests/weather/fixtures/W4WeatherServicesNative.qml'
      - 'widgets/weather/StationHomeMetricCard.qml'
      - 'widgets/weather/WeatherTrendInspector.qml'
      - 'widgets/weather/StationWorkspaceNavigationPolicy.js'
      - 'widgets/weather/StationWorkspaceSurface.qml'
      - 'widgets/weather/StationHomeDeckPolicy.js'
      - 'services/weather/WeatherHomeFavoritesPolicy.js'
      - 'tests/weather/test_home_w3_sources_and_history_fit.js'
      - 'tests/weather/fixtures/W3HomeSourcesHistoryNative.qml'
      - '.github/workflows/weather-home-w3-consolidated-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: W3 HOME source-only routes, compact HISTORY and existing navigation/store contracts
        run: |
          node --test tests/weather/test_home_w3_sources_and_history_fit.js
          node --test tests/weather/test_weather_w4_services_history.js
          node --test tests/weather/test_weather_w5_canonical_services.js
          node --test tests/weather/test_workspace_landing_w1.js
          node --test tests/weather/test_workspace_left_rail_w1r.js
          node --test tests/weather/test_home_deck_w2a.js
          node --test tests/weather/test_home_favorites_w2b.js
          node --test tests/weather/test_index_home_cutover_m28k.js
          node --test tests/weather/test_station_home_recent_history.js
          node tests/weather/test_weather_history_inspectors_m11.js
  native-history:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 12
    steps:
      - name: Install disposable Quickshell and Qt runtime
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git quickshell qt6-qpa-plugins \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects \
            coreutils findutils
      - uses: actions/checkout@v4
      - name: Native 520x300 original HOME sources isolation and HISTORY geometry
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/home-w3.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services" "$work/config/services"
          cp "$root/tests/weather/fixtures/W3HomeSourcesHistoryNative.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 40s \
            env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            quickshell --no-color -p "$work/config/shell.qml" \
            > "$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "W3_NATIVE_PASS // SOURCES_LAST_AND_HISTORY_FITS_520X300" "$work/native.log"
          if grep -E 'W3_NATIVE_FAIL|Failed to load configuration|ReferenceError|TypeError|Cannot assign' "$work/native.log"; then
            exit 1
          fi

      - name: Native WEATHER SERVICES W5 dark surface and rows-only scroll
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/weather-w4.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services" "$work/config/services"
          cp "$root/tests/weather/fixtures/W4WeatherServicesNative.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 40s \
            env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            quickshell --no-color -p "$work/config/shell.qml" \
            > "$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "W5_NATIVE_PASS // WEATHER_DARK_PINNED_SERVICES_AND_LIST_SCROLL" "$work/native.log"
          if grep -E 'W5_NATIVE_FAIL|Failed to load configuration|ReferenceError|TypeError|Cannot assign' "$work/native.log"; then
            exit 1
          fi
