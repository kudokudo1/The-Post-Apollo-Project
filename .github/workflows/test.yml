name: "PX / test"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/git/**"
      - "services/github/**"
      - "services/hospital/HospitalCertificationCoordinator.qml"
      - "services/hospital/HospitalInterpretationService.qml"
      - "widgets/Git*.qml"
      - "widgets/RepositoryProfileView.qml"
      - "widgets/WorkflowLibraryView.qml"
      - "tests/git/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "services/git/**"
      - "services/github/**"
      - "services/hospital/HospitalCertificationCoordinator.qml"
      - "services/hospital/HospitalInterpretationService.qml"
      - "widgets/Git*.qml"
      - "widgets/RepositoryProfileView.qml"
      - "widgets/WorkflowLibraryView.qml"
      - "tests/git/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Git control contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report execution identity
        run: |
          echo "repo=$GITHUB_REPOSITORY"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "PX workflow is alive."

      - name: Validate Git control contracts
        run: |
          set -euo pipefail
          for contract in tests/git/test_*contracts.py; do
            echo "==> $contract"
            python3 "$contract"
          done
