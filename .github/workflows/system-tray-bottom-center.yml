name: System tray bottom-center layout

on:
  pull_request:
    paths:
      - "shell.qml"
      - "modules/Tray.qml"
      - "tests/components/test_bottom_center_system_tray.py"
      - "tests/components/test_tray_workspace_card_parity.py"
      - "tests/components/test_tray_native_context_menu.cjs"
      - "tests/components/test_tray_desktop_window_visibility.cjs"
      - "tests/components/test_tray_window_read_join.cjs"
      - "modules/TrayDesktopVisibility.js"
      - "modules/TrayWindowReadJoin.js"
      - "tests/components/test_tray_native_qapplication.py"
      - ".github/workflows/system-tray-bottom-center.yml"
  push:
    branches: [main]
    paths:
      - "shell.qml"
      - "modules/Tray.qml"
      - "tests/components/test_bottom_center_system_tray.py"
      - "tests/components/test_tray_workspace_card_parity.py"
      - "tests/components/test_tray_native_context_menu.cjs"
      - "tests/components/test_tray_desktop_window_visibility.cjs"
      - "tests/components/test_tray_window_read_join.cjs"
      - "modules/TrayDesktopVisibility.js"
      - "modules/TrayWindowReadJoin.js"
      - "tests/components/test_tray_native_qapplication.py"
      - ".github/workflows/system-tray-bottom-center.yml"

permissions:
  contents: read

jobs:
  source-and-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single live tray, true horizontal center and masked input
        run: python3 -B -I tests/components/test_bottom_center_system_tray.py
      - name: Verify QApplication root bootstrap for native tray menus
        run: python3 -B -I tests/components/test_tray_native_qapplication.py
      - name: Compare tray card layers directly against Workspace source
        run: python3 -B -I tests/components/test_tray_workspace_card_parity.py
      - name: Verify desktop-visible Sway window app matching
        run: node tests/components/test_tray_desktop_window_visibility.cjs
      - name: Verify two-signal Sway stdout completion and actual QML publish behavior
        run: node tests/components/test_tray_window_read_join.cjs
      - name: Execute real native tray menu dispatch and color-state logic
        run: node tests/components/test_tray_native_context_menu.cjs
      - name: Existing dock button grammar regression
        run: python3 -B -I tests/components/test_dock_button_contracts.py
