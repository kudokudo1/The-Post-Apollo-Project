# Koinoikos // Post Apollo MOMENTARY widget-only focus (OPT-IN INCLUDE)
#
# Included once from ~/.config/sway/config by the symlink-safe installer.
# Display notation: Super + ~, physical trigger: Mod4 + unshifted grave.
#
# Hold Super and grave, THEN press a direction to move widget focus. Merely
# pressing the prefix does not select/cycle anything. Ordinary Super+arrows
# remain the native Sway focus commands outside this momentary mode.
#
# The Sway binding mode is only a temporary key dispatcher. Releasing either
# the grave key or the physical Super key must restore the default mode.
# No Esc required. The router never navigates ordinary Sway app windows.
# No custom SwayFX animation/shadow directives are changed here.
#
# This synchronous compositor mode transition avoids an asynchronous swaymsg
# entry/exit race; QS begins its widget focus session on the first direction.
bindsym Mod4+grave mode "Koinoikos Focus"

mode "Koinoikos Focus" {
    # These deliberately include BOTH held non-modifier keys and Mod4.
    # A bare arrow binding cannot match the physical held chord.
    bindsym --no-repeat Mod4+grave+Left  exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move left
    bindsym --no-repeat Mod4+grave+Right exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move right
    bindsym --no-repeat Mod4+grave+Up    exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move up
    bindsym --no-repeat Mod4+grave+Down  exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move down

    bindsym --no-repeat Mod4+grave+h exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move left
    bindsym --no-repeat Mod4+grave+l exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move right
    bindsym --no-repeat Mod4+grave+k exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move up
    bindsym --no-repeat Mod4+grave+j exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move down

    # Key-up ends this one hold gesture. The release action is scoped INSIDE
    # this temporary mode, never installed globally against other Sway keys.
    bindsym --release Mod4+grave exec sh -c 'swaymsg mode default; python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" exit'
    bindsym --release Super_L exec sh -c 'swaymsg mode default; python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" exit'
    bindsym --release Super_R exec sh -c 'swaymsg mode default; python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" exit'
}
