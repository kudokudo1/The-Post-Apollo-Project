name: Connections C4b signed witness and protected C3e-N origin join (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/identity_silverblue/c4b_c3en_signed_origin_join_ci.py'
      - 'tests/connections/identity_silverblue/test_c4b_c3en_signed_origin_join_ci.py'
      - 'tests/connections/identity_silverblue/c4b_signed_host_origin_binding_ci.py'
      - 'tests/connections/identity_silverblue/test_c4b_signed_host_origin_binding_ci.py'
      - '.github/workflows/connections-c4b-c3en-signed-origin-join-ci.yml'
      - 'docs/connections-c4b-c3en-signed-origin-join.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c4b-c3en-source-only-no-grant:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin disposable Ed25519 verification dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Enforce C4b-only source, exact C3e consumer and denied production flags
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/identity_silverblue/c4b_c3en_signed_origin_join_ci.py \
            tests/connections/identity_silverblue/test_c4b_c3en_signed_origin_join_ci.py \
            tests/connections/identity_silverblue/c4b_signed_host_origin_binding_ci.py \
            tests/connections/identity_silverblue/test_c4b_signed_host_origin_binding_ci.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path('tests/connections/identity_silverblue/c4b_c3en_signed_origin_join_ci.py').read_text()
          qml=Path('services/connections/ConnectionsBroker.qml').read_text()
          assert 'C3eNOriginWitnessHandoff.py' in src
          assert 'T.fetch_current_witness_ci_only(' in src
          assert 'c3en.inspect(' in src
          assert 'W._proof(' in src
          for flag in ('cryptographicallyJoinedInstalledHostAndExternalSigner',
                       'operatorEnrolledWitnessPeer',
                       'offHostWitnessKeyCustodyVerified',
                       'independentlyDurableExternalNonceHistoryVerified',
                       'hostAuthenticated', 'canApprove', 'canBeginSignIn',
                       'credentialActionsEnabled', 'productionAuthority'):
              assert '"'+flag+'": False' in src, flag
          assert 'readonly property bool credentialActionsEnabled: false' in qml
          assert 'Ed25519PrivateKey.generate(' not in src
          binding=Path('tests/connections/identity_silverblue/c4b_signed_host_origin_binding_ci.py').read_text()
          assert 'L.inspect_current_ci_only(controller_ledger_root)' in binding
          assert 'J.inspect_ci_only(**join_inputs)' in binding
          assert 'Ed25519PrivateKey' not in binding
          for key in ('realInstalledHostAttestationVerified', 'hostAuthenticated',
                      'canBeginSignIn', 'productionAuthority', 'credentialActionsEnabled'):
              assert '"'+key+'": False' in binding, key
          print('C4B_C3EN_JOIN_HOLD // NO_HOST_AUTH_OR_SIGNIN')
          PY
      - name: Actual nonroot socket signer versus original C3e-N source and hostile floors
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_ACTOR" = kudokudo1
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_ACTOR="$GITHUB_ACTOR" POST_APOLLO_C4B_P1_ROOT_LEDGER_TEST_ONLY=1 \
            POST_APOLLO_C4B_P1_TRANSPORT_TEST_ONLY=1 \
            "$(command -v python3)" -B \
            tests/connections/identity_silverblue/test_c4b_c3en_signed_origin_join_ci.py
          echo "C4B_C3EN_JOIN_PASS // 19_REAL_SIGNED_SOCKET_AND_ORIGINAL_C3EN_SOURCE_CASES"
          echo "C4B_C3EN_JOIN_HOLD // UNBOUND_TEST_ORIGINS_NOT_NATIVE_AUTHORITY"
      - name: Third-root signed snapshot binding and stale-controller rollback refusals
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_ACTOR="$GITHUB_ACTOR" POST_APOLLO_C4B_P1_ROOT_LEDGER_TEST_ONLY=1 \
            POST_APOLLO_C4B_P1_TRANSPORT_TEST_ONLY=1 \
            "$(command -v python3)" -B \
            tests/connections/identity_silverblue/test_c4b_signed_host_origin_binding_ci.py
          echo "C4B_C3EN_JOIN_PASS // 32_THIRD_SIGNER_CROSS_EVIDENCE_REFUSAL_CASES"
          echo "C4B_C3EN_JOIN_HOLD // NO_REAL_HOST_SIGNER_CUSTODY_OR_ACTUAL_INSTALLED_SEAT_ATTESTATION"
      - name: Preserve original protected C3e-N verifier and existing C4b consumer
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_ACTOR="$GITHUB_ACTOR" POST_APOLLO_C4B_P1_ROOT_LEDGER_TEST_ONLY=1 \
            POST_APOLLO_C4B_P1_TRANSPORT_TEST_ONLY=1 \
            "$(command -v python3)" -B \
            tests/connections/identity_silverblue/test_c4b_witness_transport_consumer_ci.py
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_ACTOR="$GITHUB_ACTOR" POST_APOLLO_C4B_P1_ROOT_LEDGER_TEST_ONLY=1 \
            POST_APOLLO_C4B_P1_TRANSPORT_TEST_ONLY=1 \
            "$(command -v python3)" -B \
            tests/connections/test_connections_c3en_origin_witness_handoff.py
          echo "C4B_C3EN_JOIN_PASS // INHERITED_23_C4B_AND_19_C3EN_REGRESSIONS"
      - name: Preserve merged signed rotation and root-owned witness gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/connections/identity_silverblue/test_c4b_signed_trust_transition_ci.py
          python3 -B tests/connections/identity_silverblue/test_c4b_rotated_c3eaf_role_gate_ci.py
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_ACTOR="$GITHUB_ACTOR" POST_APOLLO_C4B_P1_ROOT_LEDGER_TEST_ONLY=1 \
            "$(command -v python3)" -B \
            tests/connections/identity_silverblue/test_c4b_root_owned_controller_ledger_ci.py
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_ACTOR="$GITHUB_ACTOR" POST_APOLLO_C4B_P1_ROOT_LEDGER_TEST_ONLY=1 \
            "$(command -v python3)" -B \
            tests/connections/identity_silverblue/test_c4b_signed_external_checkpoint_ci.py
          echo "C4B_C3EN_JOIN_PASS // INHERITED_104_C4B_ROOT_ROTATION_CASES"
