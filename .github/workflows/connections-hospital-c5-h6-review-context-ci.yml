name: Connections DOC 4 C5-H6 protected PX writer review binding

on:
  pull_request:
    paths:
      - 'services/connections/hospital/HospitalNativeIssuerService.py'
      - 'tests/connections/test_connections_hospital_doc4_consent_details.py'
      - 'tests/connections/hospital_c5/HospitalC5ExactConsentProbe.py'
      - 'tests/connections/hospital_c5/test_hospital_c5_exact_consent_probe.py'
      - '.github/workflows/connections-hospital-c5-h6-review-context-ci.yml'
      - 'docs/connections-hospital-c5-h6-px-review-binding.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-px-writer-context-no-consent-authority:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned synthetic verification dependency
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Compile fixed issuer, versioned review and fixtures
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            services/connections/hospital/HospitalNativeIssuerService.py \
            tests/connections/test_connections_hospital_doc4_consent_details.py \
            tests/connections/hospital_c5/HospitalC5ExactConsentProbe.py \
            tests/connections/hospital_c5/test_hospital_c5_exact_consent_probe.py
      - name: Per-writer, per-epoch review context and source-only no-authority proofs
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests/connections/test_connections_hospital_doc4_consent_details.py
          python3 -B -I tests/connections/hospital_c5/test_hospital_c5_exact_consent_probe.py
          python3 -B - <<'PY'
          from pathlib import Path
          source = Path("services/connections/hospital/HospitalNativeIssuerService.py").read_text()
          probe = Path("tests/connections/hospital_c5/HospitalC5ExactConsentProbe.py").read_text()
          for marker in (
              '"hospital-writer-instance", prepared["writerInstance"]',
              '"hospital-policy-generation", str(prepared["policyGeneration"])',
              '"hospital-review-expires-at", str(prepared["expiresAt"])',
              '"hospital-request-nonce", prepared["requestNonce"]',
              'C.deny("INDEPENDENT_EXACT_ROOM_HUMAN_CONSENT_UNAVAILABLE")',
          ):
              assert marker in source, marker
          assert "_require_independent_room_consent(request, prepared, peer, first_seat)" in source
          assert "postapollo.hospital.c5h6.exact-room-review.v2" in probe
          assert "HospitalC5ExactConsentProbe" not in source
          assert "C.load_installed_key()" in source
          assert 'or type(claim["writerInstance"]) is not str' in probe
          print("DOC4_C5H6_HOLD // WRITER_INSTANCE_AND_POLICY_BOUND_NO_HUMAN_CONSENT")
          PY
