name: TimeW MACHINE Brave read-only window topology pilot

on:
  pull_request:
    paths:
      - "integrations/machine/brave-topology/**"
      - "tests/timew/test_machine_brave_topology.mjs"
      - "tests/timew/test_machine_brave_topology_contract.py"
      - "docs/timew-machine-brave-topology-pilot.md"
      - ".github/workflows/timew-machine-brave-topology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brave-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact zero-permission extension and no host connection
        run: python3 -B -I tests/timew/test_machine_brave_topology_contract.py
      - name: Verify 17 windows, incognito exclusion and no sensitive data reads
        run: node tests/timew/test_machine_brave_topology.mjs
      - name: Preserve M2b through M2d2 identity and anti-impersonation groundwork
        run: |
          python3 -B -I tests/timew/test_machine_session_identity_v2.py
          python3 -B -I tests/timew/test_machine_adapter_registry.py
          python3 -B -I tests/timew/test_machine_adapter_fixture_correlation.py
          python3 -B -I tests/timew/test_machine_adapter_handshake_trial.py
      - name: Preserve original v1 checkpoint storage
        run: python3 -B -I tests/timew/test_machine_checkpoint_store.py
