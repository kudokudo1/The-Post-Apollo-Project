name: Apollo Hub B7 local To-do contracts

on:
  pull_request:
    paths:
      - "services/hub/ApolloHubTodoPolicy.js"
      - "services/hub/ApolloHubTodoStore.qml"
      - "services/hub/qmldir"
      - "tests/hub/test_apollo_hub_todo_policy.cjs"
      - "tests/hub/test_apollo_hub_todo_store.py"
      - "tests/tasks/test_task_details_policy.cjs"
      - "tests/tasks/test_task_projects_policy.cjs"
      - "tests/tasks/test_task_project_management.cjs"
      - ".github/workflows/apollo-hub-todo.yml"
  push:
    branches:
      - main
    paths:
      - "services/hub/ApolloHubTodoPolicy.js"
      - "services/hub/ApolloHubTodoStore.qml"
      - "services/hub/qmldir"
      - "tests/hub/test_apollo_hub_todo_policy.cjs"
      - "tests/hub/test_apollo_hub_todo_store.py"
      - "tests/tasks/test_task_details_policy.cjs"
      - "tests/tasks/test_task_projects_policy.cjs"
      - "tests/tasks/test_task_project_management.cjs"
      - ".github/workflows/apollo-hub-todo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise pure To-do policy and guarded mutations
        run: node tests/hub/test_apollo_hub_todo_policy.cjs
      - name: Guard single writer and file failure handling
        run: python3 tests/hub/test_apollo_hub_todo_store.py
      - name: Validate TASKS v2 fields and legacy v1 compatibility
        run: node tests/tasks/test_task_details_policy.cjs
      - name: Validate TASKS v3 local Projects and legacy migration
        run: node tests/tasks/test_task_projects_policy.cjs
      - name: Validate PROJECTS rename and confirmed non-destructive deletion
        run: node tests/tasks/test_task_project_management.cjs
