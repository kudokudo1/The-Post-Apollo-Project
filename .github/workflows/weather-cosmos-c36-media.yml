name: Weather COSMOS C36 native solar media
on:
  pull_request:
    paths:
      - 'widgets/weather/StationCosmosSolarMoviePolicy.js'
      - 'widgets/weather/StationCosmosSolarMoviePane.qml'
      - 'widgets/weather/StationCosmosSolarMovieDecoder.qml'
      - 'widgets/weather/StationCosmosSunInstrumentPane.qml'
      - 'widgets/weather/StationCosmosSunTerminalPane.qml'
      - 'tests/weather/test_cosmos_c12_sun_terminal.js'
      - 'tests/weather/fixtures/C36SolarMovieDecoderNativeShell.qml'
      - '.github/workflows/weather-cosmos-c36-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify NASA clip whitelist, lazy decoder and Observation control contracts
        run: node --test tests/weather/test_cosmos_c12_sun_terminal.js
  native-decoder:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install isolated Quickshell, QtMultimedia and synthetic clip generator
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git quickshell qt6-qpa-plugins \
            qml6-module-qtmultimedia qml6-module-qtquick-effects \
            qml6-module-qt5compat-graphicaleffects \
            ffmpeg coreutils findutils
      - uses: actions/checkout@v4
      - name: Decode actual local MP4 with QtMultimedia, seek and pause
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/cosmos-c36.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          ffmpeg -hide_banner -nostdin -loglevel error \
            -f lavfi -i testsrc2=size=160x90:rate=12 \
            -t 3 -c:v mpeg4 -q:v 5 -pix_fmt yuv420p -an \
            "$work/sample.mp4"
          test -s "$work/sample.mp4"
          sed "s|C36_SAMPLE_VIDEO_URL|file://$work/sample.mp4|g" \
            "$root/tests/weather/fixtures/C36SolarMovieDecoderNativeShell.qml" \
            > "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 36s \
            env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            QT_MEDIA_BACKEND=ffmpeg \
            quickshell --no-color -p "$work/config/shell.qml" \
            > "$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "C36_NATIVE_PASS // QTMULTIMEDIA_REAL_MP4_DECODING_VIDEO_TRACK_SEEK_PAUSE" "$work/native.log"
          if grep -E 'C36_NATIVE_FAIL|Failed to load configuration|module "QtMultimedia" is not installed|ReferenceError|TypeError' "$work/native.log"; then
            exit 1
          fi
