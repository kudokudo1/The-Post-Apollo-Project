name: Git map native viewport candidate
on:
  pull_request:
    paths:
      - "scripts/git_map_history_index.py"
      - "services/git/GitMapViewportPolicy.js"
      - "services/git/GitMapPageBridge.qml"
      - "widgets/git/GitMapVirtualViewport.qml"
      - "tests/git/test_git_map_viewport_native.py"
      - "tests/git/fixtures/GitMapVirtualViewportNative.qml"
      - ".github/workflows/git-map-native-viewport.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 coreutils quickshell=0.3.2-1 qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects qml6-module-qtquick-shapes \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtqml
      - uses: actions/checkout@v4
      - run: python3 -B tests/git/test_git_map_viewport_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
