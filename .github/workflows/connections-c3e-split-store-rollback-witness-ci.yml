name: Connections C3e two disposable SQLite stores are not independent custody (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eSplitStoreRollbackWitnessCI.py'
      - 'tests/connections/test_connections_c3e_split_store_rollback_witness.py'
      - '.github/workflows/connections-c3e-split-store-rollback-witness-ci.yml'
      - 'docs/connections-c3e-split-store-rollback-witness-ci.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-local-stores-still-hold:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin existing disposable Ed25519 fixture dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Validate test-only split-store scoping and deny-only broker
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eSplitStoreRollbackWitnessCI.py \
            tests/connections/test_connections_c3e_split_store_rollback_witness.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path("tests/connections/c3e_release_trust/C3eSplitStoreRollbackWitnessCI.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          for forbidden in ("socket.socket(", "subprocess.run(", "Ed25519PrivateKey",
                            '"canBeginSignIn": True',
                            '"productionSignInAllowed": True',
                            '"safeToRetry": True'):
              assert forbidden not in src, forbidden
          for needed in ("C3eStorageIndependentTrustBoundary.py",
                         'root.parent != Path("/run")',
                         '"GITHUB_ACTIONS") != "true"',
                         '"RUNNER_ENVIRONMENT") != "github-hosted"',
                         "BEGIN IMMEDIATE", "FORK_OR_STALE_EXPECTATION_REFUSED",
                         '"safeToRetry": False',
                         "C3E_SPLITSTORE_CI_SHADOW_NOT_AN_INDEPENDENT_TRUST_CUSTODIAN"):
              assert needed in src, needed
          assert "readonly property bool credentialActionsEnabled: false" in broker
          print("C3E_SPLITSTORE_CI // NO_ENROLLED_ROOT_OR_SIGNIN")
          PY
      - name: 24 fork, restored-both-files, stale-head and lost-ACK negative cases
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "$(command -v python3)" -B \
            tests/connections/test_connections_c3e_split_store_rollback_witness.py
          echo "C3E_SPLITSTORE_ROLLBACK_GAP // SAME_HOST_NOT_INDEPENDENT"
      - name: Preserve C3e/C4b original signed and rollback security tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/test_connections_c3e_custodian_cutover_negative.py
          python3 -B -I tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py
          python3 -B tests/connections/identity_silverblue/test_c4b_raw_challenge_evidence_candidate_ci.py
          python3 -B tests/connections/identity_silverblue/test_controller_challenge_ci.py
          for test in \
            tests/connections/test_connections_c3e_c4b_local_denial_shadow.py \
            tests/connections/test_connections_c3e_local_process_sigkill_recovery.py \
            tests/connections/test_connections_c3e_storage_independent_trust_boundary.py \
            tests/connections/test_connections_c3e_local_development_history_ledger.py
          do
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              "$(command -v python3)" -B "$test"
          done
          echo "C3E_SPLITSTORE_HOLD // LOCAL_CANDIDATE_NOT_AUTHORITY"
