name: TASKS M12z synthetic exclusive-create contract

on:
  pull_request:
    paths:
      - 'tests/tasks/fixtures/TaskFirstCreateContractM12z.cjs'
      - 'tests/tasks/test_task_first_create_contract_m12z.cjs'
      - 'docs/tasks-exclusive-first-create-contract-m12z.md'
      - '.github/workflows/tasks-exclusive-first-create-contract-m12z.yml'
      - 'tests/tasks/fixtures/TaskSourcePreflightM12t.cjs'
      - 'services/hub/ApolloHubTodoStore.qml'
  push:
    branches: [main]
    paths:
      - 'tests/tasks/fixtures/TaskFirstCreateContractM12z.cjs'
      - 'tests/tasks/test_task_first_create_contract_m12z.cjs'
      - '.github/workflows/tasks-exclusive-first-create-contract-m12z.yml'

permissions:
  contents: read

jobs:
  synthetic-exclusive-create:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: M12z synthetic no-clobber, interrupted-create and readback cases
        run: node --test tests/tasks/test_task_first_create_contract_m12z.cjs
      - name: M12y read-only source absence and backup-history contract
        run: node --test tests/tasks/test_task_absent_source_review_m12y.cjs
      - name: M12t existing-source preflight
        run: node --test tests/tasks/test_task_source_preflight_m12t.cjs
      - name: M12r ticket admission disabled
        run: node --test tests/tasks/test_task_disabled_admission_m12r.cjs
      - name: M11d single FileView mutation inventory
        run: python3 tests/tasks/test_task_writer_gate_inventory_m11d.py
      - name: M12x previous native smoke source protections
        run: python3 tests/tasks/test_task_native_self_report_m12u.py
