name: Git map isolated cache candidate
on:
  pull_request:
    paths:
      - "scripts/git_map_isolated_candidate.py"
      - "scripts/git_map_index_manager.py"
      - "tests/git/test_git_map_index_manager.py"
      - "tests/git/test_git_map_isolated_candidate.py"
      - ".github/workflows/git-map-isolated-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Isolated candidate and v1 reader regressions
        run: |
          python3 -B tests/git/test_git_map_isolated_candidate.py
          python3 -B tests/git/test_git_map_index_manager.py
          python3 -B tests/git/test_git_map_reader_candidate.py
