name: Weather W2b durable HOME and card favorites

on:
  pull_request:
    paths:
      - "services/weather/WeatherHomeFavoritesPolicy.js"
      - "services/weather/WeatherHomeFavoritesStore.qml"
      - "widgets/weather/StationHomeCardProvenancePolicy.js"
      - "widgets/weather/StationHomeMetricCard.qml"
      - "widgets/weather/StationHome.qml"
      - "widgets/weather/StationSubjectNavigator.qml"
      - "widgets/weather/StationWorkspaceSurface.qml"
      - "widgets/weather/StationWeatherSubjectPane.qml"
      - "widgets/weather/WeatherStationW.qml"
      - "tests/weather/test_home_favorites_w2b.js"
      - "tests/weather/fixtures/M27BHomeFavoritesProbe.qml"
      - "scripts/weather/verify_home_favorites_fedora_w2b.sh"
      - "tests/weather/test_workspace_landing_w1.js"
      - "tests/weather/test_weather_subject_panels_m2b.js"
      - "docs/weather-home-favorites-w2b-handoff.md"
      - ".github/workflows/weather-home-favorites-w2b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-persistence:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install Fedora Quickshell 0.3.2 and Xvfb
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf copr enable -y errornointernet/quickshell
          dnf install -y --setopt=install_weak_deps=False \
            quickshell qt6-qtdeclarative qt6-qt5compat qt6-qtbase-gui \
            qt6-qtsvg git nodejs coreutils findutils \
            xdotool xorg-x11-server-Xvfb
          quickshell --version
          quickshell --version | grep '0.3.'
      - uses: actions/checkout@v4
      - name: W2b schema and real HOME source metadata contracts
        run: node --test tests/weather/test_home_favorites_w2b.js
      - name: W2a HOME panel randomizer regression
        run: node --test tests/weather/test_home_deck_w2a.js
      - name: W1 original HOME lifetime regression
        run: node --test tests/weather/test_workspace_landing_w1.js
      - name: M27-A weather HOME relevant cards regression
        run: node --test tests/weather/test_weather_subject_panels_m2b.js
      - name: Native card click, atomic FileView save, restart and corrupt refusal
        run: bash scripts/weather/verify_home_favorites_fedora_w2b.sh
