name: Hospital Room Reports

on:
  pull_request:
    paths:
      - "services/hospital/HospitalRoomReportService.qml"
      - "widgets/HospitalRoomReportsView.qml"
      - "widgets/HospitalW.qml"
      - "tests/hospital/test_room_reports_contracts.py"
      - ".github/workflows/hospital-room-reports.yml"
  push:
    branches:
      - main
    paths:
      - "services/hospital/HospitalRoomReportService.qml"
      - "widgets/HospitalRoomReportsView.qml"
      - "widgets/HospitalW.qml"
      - "tests/hospital/test_room_reports_contracts.py"
      - ".github/workflows/hospital-room-reports.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Room Reports contracts
        run: python3 tests/hospital/test_room_reports_contracts.py
