name: Syntagma optional UI lag probe contracts

on:
  pull_request:
    paths:
      - "shell.qml"
      - "modules/Mediaplayer.qml"
      - "modules/Network.qml"
      - "widgets/notifications/NotificationsHubW.qml"
      - "widgets/GitW.qml"
      - "widgets/HospitalW.qml"
      - "tests/components/test_syntagma_ui_lag_probe.py"
      - "tests/components/test_syntagma_bg_lag_probe.py"
      - "tests/components/test_syntagma_quickshell_thread_sampler.py"
      - "tests/components/test_syntagma_array_copy_probe.py"
      - "services/system/GraphHistory.qml"
      - "services/notifications/NotificationsService.qml"
      - "OPERATE/syntagma-ui-lag-probe.md"
      - "scripts/syntagma_quickshell_thread_sampler.py"
      - "docs/syntagma-ui-lag-probe.md"
      - ".github/workflows/syntagma-ui-lag-probe.yml"
  push:
    branches: [main]
    paths:
      - "shell.qml"
      - "modules/Mediaplayer.qml"
      - "modules/Network.qml"
      - "widgets/notifications/NotificationsHubW.qml"
      - "widgets/GitW.qml"
      - "widgets/HospitalW.qml"
      - "tests/components/test_syntagma_ui_lag_probe.py"
      - "tests/components/test_syntagma_bg_lag_probe.py"
      - "tests/components/test_syntagma_quickshell_thread_sampler.py"
      - "tests/components/test_syntagma_array_copy_probe.py"
      - "services/system/GraphHistory.qml"
      - "services/notifications/NotificationsService.qml"
      - "OPERATE/syntagma-ui-lag-probe.md"
      - "scripts/syntagma_quickshell_thread_sampler.py"
      - ".github/workflows/syntagma-ui-lag-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify opt-in diagnostics and preserved widget lifecycles
        run: |
          python3 tests/components/test_syntagma_ui_lag_probe.py
          python3 tests/components/test_syntagma_bg_lag_probe.py
          python3 tests/components/test_syntagma_quickshell_thread_sampler.py
          python3 tests/components/test_syntagma_array_copy_probe.py
