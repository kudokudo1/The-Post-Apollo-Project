  push:
    paths:
      - 'widgets/FinanceTransferGuidePolicy.js'
      - 'widgets/FinanceTransferGuidePane.qml'
      - 'widgets/FinanceAccountsPane.qml'
      - 'widgets/FinanceW.qml'
      - 'widgets/FinanceBankingPane.qml'
      - 'widgets/FinanceBankingAccountsPane.qml'
      - 'widgets/FinanceBankingProviderPane.qml'
      - 'widgets/FinanceBankingProviderPolicy.js'
