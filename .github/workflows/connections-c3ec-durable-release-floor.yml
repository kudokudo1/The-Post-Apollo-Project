name: Connections C3e-C durable signed-release floor (CI only)

on:
  pull_request:
    paths:
      - "tests/connections/c3e_release_trust/C3eDurableFloor.py"
      - "tests/connections/test_connections_c3ec_durable_floor.py"
      - ".github/workflows/connections-c3ec-durable-release-floor.yml"
      - "docs/connections-c3ec-durable-release-floor.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-durable-release-checkpoint:
    # Test identities and ledger are disposable; no production signing state.
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify synthetic GPG, SQLite, and production deny-only baseline
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg
          command -v gpgv
          python3 - <<'PY'
          import sqlite3
          print("C3EC_SQLITE_VERSION //", sqlite3.sqlite_version)
          PY
          python3 -m py_compile \
            tests/connections/c3e_release_trust/C3eDurableFloor.py \
            tests/connections/test_connections_c3ec_durable_floor.py
          python3 -B tests/connections/test_connections_c2n_policy_contract.py
          python3 - <<'PY'
          from pathlib import Path
          base=Path("services/connections")
          assert "readonly property bool credentialActionsEnabled: false" in (base/"ConnectionsBroker.qml").read_text()
          assert "readonly property bool hostAuthenticated: false" in (base/"ConnectionsRequestStatus.qml").read_text()
          for f in (*base.glob("*.qml"), *base.glob("*.js"), base/"qmldir"):
              assert "C3eDurableFloor" not in f.read_text(), f
          print("C3EC_PASS // PRODUCTION_BROKER_REMAINS_DENY_ONLY")
          PY
      - name: Exercise signed-release rollback, restart, state conflict and crash tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/connections/test_connections_c3ec_durable_floor.py
          echo "C3EC_PASS // TRANSACTIONAL_STATE_SURVIVES_RESTART_AND_REFUSES_STALE_SIGNATURES"
      - name: Recheck existing root delegation and signer revocation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/connections/test_connections_c3e_release_trust.py
          echo "C3EC_PASS // PREEXISTING_ROOT_SIGNATURE_POLICY_STILL_ENFORCED"
      - name: Explicitly retain rollback resistance limitation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Ordinary SQLite' tests/connections/c3e_release_trust/C3eDurableFloor.py
          grep -Fq 'external_root_pin' tests/connections/c3e_release_trust/C3eDurableFloor.py
          grep -Fq 'external_epoch_floor' tests/connections/c3e_release_trust/C3eDurableFloor.py
          grep -Fq 'external_sequence_floor' tests/connections/c3e_release_trust/C3eDurableFloor.py
          echo "C3EC_LIMITATION // SQLITE_IS_NOT_HARDWARE_ANTI_ROLLBACK_OR_OPERATOR_ROOT"
