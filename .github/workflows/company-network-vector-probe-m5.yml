name: Company Network M5 isolated Qt6 vector proof

on:
  pull_request:
    paths:
      - 'experiments/company-vector-qt/**'
      - 'tests/company/test_company_vector_probe_m5.py'
      - '.github/workflows/company-network-vector-probe-m5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Offline and authority contracts
        run: python3 -m unittest discover -s tests/company -p 'test_company_vector_probe_m5.py' -v

  native-qt:
    # All Qt/MapLibre downloads happen on the disposable GitHub runner.
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Disposable graphics prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ cmake curl bzip2 xvfb mesa-utils \
            libgl1-mesa-dri libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtlocation qtpositioning'
          cache: false

      - name: Fetch pinned MapLibre v3 for exact Qt6.7.3 ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maplibre"
          curl -fLS --retry 2 --max-time 120 \
            'https://github.com/maplibre/maplibre-native-qt/releases/download/v3.0.0/maplibre-native-qt_v3.0.0_Qt6.7.3_Linux.tar.bz2' \
            -o "$RUNNER_TEMP/maplibre.tar.bz2"
          tar -xjf "$RUNNER_TEMP/maplibre.tar.bz2" -C "$RUNNER_TEMP/maplibre"
          config="$(find "$RUNNER_TEMP/maplibre" -type f -name QMapLibreConfig.cmake -print -quit)"
          test -n "$config"
          # The release archive includes an extra package-name directory.
          # Find actual QML and geoservices plugin roots, not the extraction dir.
          qmldir="$(find "$RUNNER_TEMP/maplibre" -type f -path '*/MapLibre/qmldir' -print -quit)"
          geoplugin="$(find "$RUNNER_TEMP/maplibre" -type f -path '*/geoservices/*' -iname '*maplibre*.so' -print -quit)"
          echo "MapLibre QML descriptor: $qmldir"
          echo "MapLibre geoservices plugin: $geoplugin"
          test -n "$qmldir"
          test -n "$geoplugin"
          qmlroot="$(dirname "$(dirname "$qmldir")")"
          pluginroot="$(dirname "$(dirname "$geoplugin")")"
          # MapLibre package ships shared libraries under the extracted prefix.
          libdir="$(find "$RUNNER_TEMP/maplibre" -type f -name 'libQMapLibre.so*' -print -quit)"
          test -n "$libdir"
          libdir="$(dirname "$libdir")"
          echo "QMAPLIBRE_DIR=$(dirname "$config")" >> "$GITHUB_ENV"
          echo "MAPLIBRE_QML_ROOT=$qmlroot" >> "$GITHUB_ENV"
          echo "MAPLIBRE_PLUGIN_ROOT=$pluginroot" >> "$GITHUB_ENV"
          echo "MAPLIBRE_LIB_DIR=$libdir" >> "$GITHUB_ENV"

      - name: Compile independent QtQuick MapLibre app
        shell: bash
        run: |
          set -euo pipefail
          cmake -S experiments/company-vector-qt \
            -B "$RUNNER_TEMP/company-vector-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQMapLibre_DIR="$QMAPLIBRE_DIR"
          cmake --build "$RUNNER_TEMP/company-vector-build" --parallel 2

      - name: Offscreen software-OpenGL render and PNG capture
        shell: bash
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export QSG_RHI_BACKEND=opengl
          export QT_PLUGIN_PATH="$MAPLIBRE_PLUGIN_ROOT:$QT_ROOT_DIR/plugins"
          export QML_IMPORT_PATH="$MAPLIBRE_QML_ROOT:$QT_ROOT_DIR/qml"
          export QML2_IMPORT_PATH="$MAPLIBRE_QML_ROOT:$QT_ROOT_DIR/qml"
          export LD_LIBRARY_PATH="$MAPLIBRE_LIB_DIR:$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          echo "MapLibre QML module: $MAPLIBRE_QML_ROOT/MapLibre"
          echo "MapLibre plugin dir: $MAPLIBRE_PLUGIN_ROOT/geoservices"
          test -f "$MAPLIBRE_QML_ROOT/MapLibre/qmldir"
          cd "$RUNNER_TEMP/company-vector-build"
          xvfb-run -a -s '-screen 0 1280x900x24' \
            timeout 25s ./company-vector-probe --capture
          test -s company-vector-probe.png
          cp company-vector-probe.png "$GITHUB_WORKSPACE/company-vector-probe.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-vector-qt-native-capture
          path: company-vector-probe.png
          if-no-files-found: ignore
