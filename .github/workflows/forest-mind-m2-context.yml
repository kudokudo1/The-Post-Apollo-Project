name: Forest Mind M2 Context CI
on:
  pull_request:
    paths:
      - 'scripts/forest/context_first_tree_m2.py'
      - 'scripts/forest/CONTEXT_FIRST_TREE_M2.md'
      - 'scripts/forest/session_journal_v0.py'
      - 'scripts/forest/shared_context_b6r1.py'
      - 'scripts/forest/capability_registry_b6r2.py'
      - 'scripts/forest/ollama_chat_transport.py'
      - 'tests/forest/test_context_first_tree_m2.py'
      - '.github/workflows/forest-mind-m2-context.yml'
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mind context tests
        run: python3 -B -m unittest discover -s tests/forest -p 'test_context_first_tree_m2.py' -v
      - name: B1 journal
        run: python3 -B -m unittest discover -s tests/forest -p 'test_session_journal_v0.py' -v
      - name: B6 R1
        run: python3 -B -m unittest discover -s tests/forest -p 'test_shared_context_b6r1.py' -v
      - name: B6 R2
        run: python3 -B -m unittest discover -s tests/forest -p 'test_capability_registry_b6r2.py' -v
      - name: B3 bridge
        run: python3 -B -m unittest discover -s tests/forest -p 'test_turn_bridge_b3.py' -v
