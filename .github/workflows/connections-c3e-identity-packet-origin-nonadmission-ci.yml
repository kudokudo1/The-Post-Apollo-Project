name: Connections C3e Identity per-packet kernel origin still not trusted (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eIdentityPacketOriginNonAdmissionCI.py'
      - 'tests/connections/test_connections_c3e_identity_packet_origin_nonadmission.py'
      - '.github/workflows/connections-c3e-identity-packet-origin-nonadmission-ci.yml'
      - 'docs/connections-c3e-identity-packet-origin-nonadmission-ci.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-packet-origin-not-identity-authority:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original C3e signed development fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Enforce reusing old kernel observer and deny-only Identity route
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eIdentityPacketOriginNonAdmissionCI.py \
            tests/connections/test_connections_c3e_identity_packet_origin_nonadmission.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path("tests/connections/c3e_release_trust/C3eIdentityPacketOriginNonAdmissionCI.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          forbidden=("sqlite3.connect(", "socket.socket(", "subprocess.run(",
                     "Ed25519PrivateKey", "recvmsg(", "setsockopt(",
                     '"safeToRetry": True', '"signInAllowed": True')
          for marker in forbidden:
              assert marker not in src, marker
          needed=("C3eLocalReadOnlyIpcProbe.py",
                  "ConnectionsTimeWNativePacketObservation.py",
                  "K.inspect_one_untrusted_packet(receiver)",
                  "P._route(boundary, request)",
                  "HOLD_NO_PROTECTED_IDENTITY_OR_AUTO_RETRY",
                  '"safeToRetry": False',
                  "C3E_IDENTITY_PACKET_NO_INDEPENDENT_SIGNIN_SOURCE_OR_CUSTODY")
          for marker in needed:
              assert marker in src, marker
          assert "readonly property bool credentialActionsEnabled: false" in broker
          print("C3E_IDENTITY_PACKET_CI // NO_SIGNIN_OR_SOURCE_PROMOTION")
          PY
      - name: 22 genuine kernel packet, inherited sender and Identity denial cases
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "$(command -v python3)" -B \
            tests/connections/test_connections_c3e_identity_packet_origin_nonadmission.py
          echo "C3E_IDENTITY_PACKET_CI // NO_PER_MESSAGE_SIGNIN_AUTHORITY"
      - name: Retain original Linux native packet and C3e custody security cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/connections/test_connections_c3e_timew_native_packet_observer.py
          python3 -B -I tests/connections/test_connections_c3e_custodian_cutover_negative.py
          python3 -B -I tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py
          for test in \
            tests/connections/test_connections_c3e_accepted_unix_readonly_peer.py \
            tests/connections/test_connections_c3e_local_readonly_ipc.py \
            tests/connections/test_connections_c3e_storage_independent_trust_boundary.py \
            tests/connections/test_connections_c3e_local_process_sigkill_recovery.py
          do
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              "$(command -v python3)" -B "$test"
          done
          echo "C3E_IDENTITY_PACKET_CI // HOSTED_HOLD_PRODUCTION_OFF"
