name: TimeW MACHINE disposable Brave host trial preflight

on:
  pull_request:
    paths:
      - "services/time/MachineBraveDisposableTrial.py"
      - "tests/timew/test_machine_brave_disposable_trial.py"
      - "docs/timew-machine-brave-disposable-trial.md"
      - ".github/workflows/timew-machine-brave-disposable-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Test temp-only profile registration, manifest and safe failures
        run: python3 -B -I tests/timew/test_machine_brave_disposable_trial.py
      - name: Preserve exact native host framing and optional-permission boundary
        run: |
          python3 -B -I tests/timew/test_machine_brave_native_probe_contract.py
          python3 -B -I tests/timew/test_machine_brave_native_probe.py
          python3 -B -I tests/timew/test_machine_brave_native_manifest.py
      - name: Preserve A/B/A and Sway focus non-identity semantics
        run: |
          python3 -B -I tests/timew/test_machine_brave_focus_sequence_review.py
          python3 -B -I tests/timew/test_machine_brave_focus_witness.py
