name: FinanceW Banking M4t4 disposable native visual controls
on:
  pull_request:
    paths:
      - 'tests/finance/test_banking_controls_native_m4t4.py'
      - 'tests/finance/fixtures/M4t4BankingControlsNative.qml'
      - 'tests/finance/test_banking_client_bridge_m4t2.py'
      - 'widgets/FinanceBanking*Candidate.qml'
      - 'widgets/FinanceBanking*ControlsPolicy.js'
      - 'services/finance/FinanceBanking*CandidateService.qml'
      - 'scripts/finance/banking_manual_*.py'
      - 'scripts/finance/banking_portable_crypto.mjs'
      - 'components/ActionButton.qml'
      - 'components/SafeDropShadow.qml'
      - 'components/Colors.qml'
      - 'components/GohuText.qml'
      - 'components/qmldir'
      - '.github/workflows/finance-banking-m4t4-native-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    env:
      POST_APOLLO_BANKING_NATIVE_CI: '1'
    steps:
      - name: Install pinned real Quickshell and Node crypto runtime
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 nodejs quickshell=0.3.2-1 \
            qt6-qpa-plugins xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml \
            qml6-module-qtquick-effects qml6-module-qtquick-layouts qml6-module-qt5compat-graphicaleffects
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native backup and portable control lifecycle
        run: xvfb-run -a -s "-screen 0 1200x900x24 -nolisten tcp" python3 -B tests/finance/test_banking_controls_native_m4t4.py
