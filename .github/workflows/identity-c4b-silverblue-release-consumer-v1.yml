name: Identity C4b Silverblue release candidate V1 deny-only contract

on:
  pull_request:
    paths:
      - 'services/identity/silverblue_release_candidate_v1.py'
      - 'tests/identity/test_silverblue_release_candidate_v1.py'
      - '.github/workflows/identity-c4b-silverblue-release-consumer-v1.yml'
      - 'docs/identity-center-c4b-silverblue-release-consumer-v1.md'
  push:
    branches: [main, 'feat/identity-c4b-silverblue-release-consumer-*']
    paths:
      - 'services/identity/silverblue_release_candidate_v1.py'
      - 'tests/identity/test_silverblue_release_candidate_v1.py'
      - '.github/workflows/identity-c4b-silverblue-release-consumer-v1.yml'
      - 'docs/identity-center-c4b-silverblue-release-consumer-v1.md'

permissions:
  contents: read

jobs:
  deny-only-candidate:
    name: Verify pinned C4b envelope contract and CPU++ locked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only signature verifier
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Exact source format, adversarial pins, false authority, and QML offline
        run: |
          python3 -m py_compile services/identity/silverblue_release_candidate_v1.py
          python3 -m unittest discover -s tests/identity -p 'test_silverblue_release_candidate_v1.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_native_adapter_only_call_path_v1.py' -v
          node tests/cpuplus/test_cpuplus_universal_signin_host_boundary_v4.cjs
          node tests/cpuplus/test_cpuplus_universal_signin_intent_v5.cjs
      - name: Confirm no installed-host authority was constructed by this test
        run: |
          test ! -e /usr/libexec/post-apollo/identity/identity-gateway-ci
          echo 'IDENTITY_C4B_CANDIDATE_ONLY // PRODUCTION_AUTHORITY_FALSE'
