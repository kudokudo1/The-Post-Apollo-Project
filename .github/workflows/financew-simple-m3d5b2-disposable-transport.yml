name: FinanceW Simple M3d5b2 disposable durable transport HOLD

on:
  pull_request:
    paths:
      - "scripts/finance/simple_m3d5b2_disposable_transport.mjs"
      - "tests/finance/fixtures/simple_m3d5b2_transport_child.mjs"
      - "tests/finance/test_simple_m3d5b2_transport.mjs"
      - "tests/finance/test_simple_m3d5b2_source_hold.py"
      - "scripts/finance/SIMPLE_MODE_M3D5B2_DISPOSABLE_TRANSPORT_README.md"
      - ".github/workflows/financew-simple-m3d5b2-disposable-transport.yml"
  push:
    paths:
      - "scripts/finance/simple_m3d5b2_disposable_transport.mjs"
      - "tests/finance/fixtures/simple_m3d5b2_transport_child.mjs"
      - "tests/finance/test_simple_m3d5b2_transport.mjs"
      - "tests/finance/test_simple_m3d5b2_source_hold.py"
      - "scripts/finance/SIMPLE_MODE_M3D5B2_DISPOSABLE_TRANSPORT_README.md"
      - ".github/workflows/financew-simple-m3d5b2-disposable-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-disposable-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and hard production HOLD
        run: |
          node --check scripts/finance/simple_m3d5b2_disposable_transport.mjs
          node --check tests/finance/test_simple_m3d5b2_transport.mjs
          node --check tests/finance/fixtures/simple_m3d5b2_transport_child.mjs
          python3 -B tests/finance/test_simple_m3d5b2_source_hold.py
      - name: Real separate-process fictional identity, replay and hostile path matrix
        run: node --test tests/finance/test_simple_m3d5b2_transport.mjs
      - name: Preserved M3d5b1 protected controller and category review
        run: |
          python3 -B tests/finance/test_simple_m3d5b_source_hold.py
          node --test tests/finance/test_simple_m3d5b_protected_controller.mjs
