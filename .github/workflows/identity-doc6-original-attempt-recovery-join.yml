name: Identity DOC 6 original-attempt dual read-only recovery join

on:
  pull_request:
    paths:
      - 'services/identity/native_original_attempt_recovery_join_v0.py'
      - 'services/identity/native_outcome_candidate_shadow_v0.py'
      - 'services/identity/native_attempt_fingerprint_v0.py'
      - 'services/identity/desktop_signed_command_client_v0.py'
      - 'tests/identity/test_native_original_attempt_recovery_join_v0.py'
      - '.github/workflows/identity-doc6-original-attempt-recovery-join.yml'
      - 'docs/identity-center-v5-original-attempt-dual-recovery-join-doc6.md'
  push:
    branches: [main]
    paths:
      - 'services/identity/native_original_attempt_recovery_join_v0.py'
      - 'services/identity/native_outcome_candidate_shadow_v0.py'
      - 'services/identity/native_attempt_fingerprint_v0.py'
      - 'services/identity/desktop_signed_command_client_v0.py'
      - 'tests/identity/test_native_original_attempt_recovery_join_v0.py'
      - '.github/workflows/identity-doc6-original-attempt-recovery-join.yml'

permissions:
  contents: read

jobs:
  original-attempt-recovery-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned existing signed receipt primitive
        run: python3 -m pip install cryptography==46.0.4
      - name: Compile nonauthorizing Identity original-attempt join
        run: |
          python3 -m py_compile services/identity/native_attempt_fingerprint_v0.py
          python3 -m py_compile services/identity/desktop_signed_command_client_v0.py
          python3 -m py_compile services/identity/native_original_attempt_recovery_join_v0.py
          python3 -m py_compile services/identity/native_outcome_candidate_shadow_v0.py
          python3 -m py_compile tests/identity/test_native_original_attempt_recovery_join_v0.py
      - name: Reject executable recovery providers, forged snapshots and unsafe joins
        run: python3 -m unittest discover -s tests/identity -p 'test_native_original_attempt_recovery_join_v0.py' -v
      - name: Preserve original source evidence and signed receipt denial contracts
        run: |
          python3 -m unittest discover -s tests/identity -p 'test_native_outcome_candidate_shadow_v0.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_native_recorded_signed_receipt_shadow_v0.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_local_command_outcome_hold_reference_v0.py' -v
      - name: Preserve real disposable native signed client and offline UI
        run: |
          python3 -m unittest discover -s tests/identity -p 'test_desktop_signed_command_client_v0.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_native_adapter_only_call_path_v1.py' -v
          node tests/cpuplus/test_cpuplus_universal_signin_host_boundary_v4.cjs
          node tests/cpuplus/test_cpuplus_universal_signin_intent_v5.cjs
