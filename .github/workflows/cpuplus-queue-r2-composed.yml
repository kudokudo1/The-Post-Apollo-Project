name: CPU++ queue R2 composed candidate fixture
on:
  pull_request:
    paths:
      - 'tests/cpuplus/queue_r2_composed_fixture.py'
      - 'tests/cpuplus/test_queue_r2_composed.cjs'
      - 'services/memory/QUEUE-R2-COMPOSED.md'
      - '.github/workflows/cpuplus-queue-r2-composed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e94715dd3428341b104019bc72c40422391eb906
          path: candidate-owner
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e276436897c0210dbe564054d9faf9ce03f266b0
          path: candidate-delivery
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2ca4e7c632839336013e9b0d5d2d54fd67498411
          path: candidate-consumer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d4ecae3baf6c6c472daf1a9387be91ca2c8525d0
          path: candidate-projector
          persist-credentials: false
      - name: Compose exact candidate modules in disposable directory
        run: |
          set -eu
          test "$(git -C candidate-owner rev-parse HEAD)" = e94715dd3428341b104019bc72c40422391eb906
          test "$(git -C candidate-delivery rev-parse HEAD)" = e276436897c0210dbe564054d9faf9ce03f266b0
          test "$(git -C candidate-consumer rev-parse HEAD)" = 2ca4e7c632839336013e9b0d5d2d54fd67498411
          test "$(git -C candidate-projector rev-parse HEAD)" = d4ecae3baf6c6c472daf1a9387be91ca2c8525d0
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp -a candidate-owner/services/memory/. "$scratch/"
          cp candidate-delivery/services/memory/memory_queue_delivery.py "$scratch/"
          node tests/cpuplus/test_queue_r2_composed.cjs "$scratch" \
            candidate-consumer/widgets/cpuplus/CpuPlusQueueConsumer.js \
            candidate-projector/widgets/cpuplus/CpuPlusQueuePresentation.js
