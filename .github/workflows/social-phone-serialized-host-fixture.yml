name: Social Phone Serialized Host Fixture P1

on:
  pull_request:
    paths:
      - 'services/phone/SerializedPhoneHostFixture.py'
      - 'tests/phone/test_serialized_phone_host_fixture.py'
      - 'MODEL/contracts/social-phone-serialized-host-fixture-p1-v0.md'
      - '.github/workflows/social-phone-serialized-host-fixture.yml'
  push:
    branches: [main]
    paths:
      - 'services/phone/SerializedPhoneHostFixture.py'
      - 'tests/phone/test_serialized_phone_host_fixture.py'
      - 'MODEL/contracts/social-phone-serialized-host-fixture-p1-v0.md'
      - '.github/workflows/social-phone-serialized-host-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-host-races:
    name: "Phone host: synthetic revocation/delivery serialization"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated host fixture and tests
        run: python3 -m py_compile services/phone/SerializedPhoneHostFixture.py tests/phone/test_serialized_phone_host_fixture.py
      - name: Verify deterministic fake-host concurrency cases
        run: python3 -m unittest discover -s tests/phone -p 'test_serialized_phone_host_fixture.py' -v
      - name: Regress entire offline Python Phone Bridge test suite
        run: python3 -m unittest discover -s tests/phone -p 'test_*.py' -q
