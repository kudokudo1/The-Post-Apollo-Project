name: Weather M28-H EARTH event and dossier parity

on:
  pull_request:
    paths:
      - 'widgets/weather/StationSubjectNavigationPreviewPolicy.js'
      - 'tests/weather/test_index_subject_cutover_m28d.js'
      - 'tests/weather/test_index_weather_cutover_m28f.js'
      - 'tests/weather/test_index_cosmos_cutover_m28g.js'
      - 'tests/weather/test_index_earth_cutover_m28h.js'
      - 'docs/weather-subjects-m28h-earth-parity-handoff.md'
      - '.github/workflows/weather-subjects-earth-parity-m28h.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earth-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M28-H exact EARTH native panel and manual archive proof
        run: node --test tests/weather/test_index_earth_cutover_m28h.js
      - name: Preserve E1 source separation and M26-F durable event selection
        run: |
          node --test tests/weather/test_earth_subject_panels_e1.js
          node --test tests/weather/test_dossier_navigation_boundary_m26f.js
      - name: Preserve M28-A/B NEWS mentioned places and event map separation
        run: |
          node --test tests/weather/test_media_earth_mentions_cutover_m28a.js
          node --test tests/weather/test_media_news_feed_map_companion_m28b.js
      - name: Preserve M0/M1 and previous D/F/G INDEX source-cutover contracts
        run: |
          node --test tests/weather/subject_navigation_contract.test.js
          node --test tests/weather/subject_navigation_browser.test.js
          node --test tests/weather/test_index_subject_cutover_m28d.js
          node --test tests/weather/test_index_radio_cutover_m28e.js
          node --test tests/weather/test_index_weather_cutover_m28f.js
          node --test tests/weather/test_index_cosmos_cutover_m28g.js
