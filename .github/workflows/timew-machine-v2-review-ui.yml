name: TimeW MACHINE V2 review UI (read-only)

on:
  pull_request:
    paths:
      - "widgets/TimeW.qml"
      - "services/time/MachineRestoreReviewV2.py"
      - "tests/timew/test_machine_restore_review_ui.py"
      - "tests/timew/test_machine_restore_review_v2.py"
      - "tests/timew/test_machine_one_click_restore_ui.py"
      - "tests/timew/test_timew_foundation_contracts.py"
      - ".github/workflows/timew-machine-v2-review-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-review-ui-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: One-shot V2 review UI contract and denied executable authority
        run: python3 -B -I tests/timew/test_machine_restore_review_ui.py
      - name: Existing V2 planner and synthetic SQLite Sway refusals
        run: python3 -B -I tests/timew/test_machine_restore_review_v2.py
      - name: One-click V1 restore behavior and source UI unchanged
        run: |
          python3 -B -I tests/timew/test_machine_one_click_restore.py
          python3 -B -I tests/timew/test_machine_one_click_restore_ui.py
      - name: TimeW foundation and MACHINE UI regressions
        run: |
          python3 -B -I tests/timew/test_timew_foundation_contracts.py
          python3 -B -I tests/timew/test_machine_persistent_mark_ui.py
          python3 -B -I tests/timew/test_machine_move_apply_ui.py
          python3 -B -I tests/timew/test_machine_move_confirm_ui.py
          python3 -B -I tests/timew/test_machine_move_review_ui.py
          python3 -B -I tests/timew/test_machine_window_resolver_ui.py
          python3 -B -I tests/timew/test_machine_stored_notes_ui_contract.py
