name: Social W native Stage Director handoff and fallback

on:
  pull_request:
    paths:
      - "widgets/messanger/DiscordGeometry.py"
      - "widgets/messanger/MessagingW.qml"
      - "tests/messaging/test_social_native_stage_director_bridge.py"
      - ".github/workflows/social-native-stage-director-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Python helper and verify native+legacy handshake
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for path in ("widgets/messanger/DiscordGeometry.py",
                       "tests/messaging/test_social_native_stage_director_bridge.py"):
              ast.parse(Path(path).read_text(), filename=path)
          print("SD_SOCIAL_NATIVE_BRIDGE_SYNTAX result=PASS")
          PY
          python3 -B tests/messaging/test_social_native_stage_director_bridge.py
          git status --porcelain
          test -z "$(git status --porcelain)"
