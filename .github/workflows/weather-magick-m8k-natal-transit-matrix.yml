name: MAGICK M8k verified natal x transit pair matrix

on:
  pull_request:
    paths:
      - 'scripts/weather/celestial_transit_matrix.py'
      - 'services/weather/CelestialTransitMatrixService.qml'
      - 'widgets/weather/StationMagickTransitMatrixPolicy.js'
      - 'widgets/weather/StationMagickTransitMatrixPane.qml'
      - 'widgets/weather/StationMagickAstrologyPane.qml'
      - 'widgets/weather/StationMagickTransitChartPane.qml'
      - 'tests/weather/test_magick_natal_transit_matrix_m8k.py'
      - 'tests/weather/test_magick_natal_transit_matrix_ui_m8k.js'
      - 'tests/weather/fixtures/M8kNativeMatrixShell.qml'
      - 'scripts/weather/verify_magick_native_m8k.sh'
      - '.github/workflows/weather-magick-m8k-natal-transit-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 3x3 exact-JPL pair identity, shared station and bounded source
        run: python3 -m unittest discover -s tests/weather -p 'test_magick_natal_transit_matrix_m8k.py' -v
      - name: Preserve accepted M8i/M8h/M8f numerical source contracts
        run: |
          python3 -m unittest discover -s tests/weather -p 'test_magick_station_reliability_m8i.py' -v
          python3 -m unittest discover -s tests/weather -p 'test_magick_transit_multi_m8h.py' -v
          python3 -m unittest discover -s tests/weather -p 'test_magick_transit_timeline_m8f.py' -v
  client-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate matrix counts, matching natal JPL SHA and once-only stations
        run: node --test tests/weather/test_magick_natal_transit_matrix_ui_m8k.js
      - name: Preserve accepted M8j/M8h/M8g viewer and event contracts
        run: |
          node --test tests/weather/test_magick_event_browser_m8j.js
          node --test tests/weather/test_magick_transit_multi_ui_m8h.js
          node --test tests/weather/test_magick_transit_timeline_ui_m8g.js
  native-quickshell:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable native Quickshell and Qt
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git nodejs quickshell qt6-qpa-plugins coreutils findutils \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects
          quickshell --version
      - uses: actions/checkout@v4
      - name: Load actual MATRIX pane and private service, verify cell and event selection
        run: bash scripts/weather/verify_magick_native_m8k.sh
