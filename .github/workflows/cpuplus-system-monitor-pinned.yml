name: CPU++ pinned system monitor
on:
  pull_request:
    paths:
      - 'widgets/CpuPlusW.qml'
      - 'widgets/appcontrol/SystemMonitorView.qml'
      - 'tests/cpuplus/test_system_monitor_pinned.cjs'
      - 'tests/cpuplus/test_system_monitor_pinned_native.py'
      - 'tests/cpuplus/fixtures/SystemMonitorPinnedNative.qml'
      - '.github/workflows/cpuplus-system-monitor-pinned.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/cpuplus/test_system_monitor_pinned.cjs
      - run: node tests/cpuplus/test_favorites_system_watch_u7bj.cjs
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt runtime
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 quickshell=0.3.2-1 qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects qml6-module-qtquick-shapes \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtqml
      - uses: actions/checkout@v4
      - name: Exercise real shared view with fake controller
        env:
          POST_APOLLO_SYSTEM_PIN_SMOKE: CI_DISPOSABLE_ONLY
        run: python3 -B tests/cpuplus/test_system_monitor_pinned_native.py
