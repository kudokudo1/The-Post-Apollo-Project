name: "Notification policy contracts"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/notifications/**"
      - "integrations/proton/**"
      - "widgets/notifications/**"
      - "tests/notifications/**"
      - ".github/workflows/notification-policy-contracts.yml"
  pull_request:
    paths:
      - "services/notifications/**"
      - "integrations/proton/**"
      - "widgets/notifications/**"
      - "tests/notifications/**"
      - ".github/workflows/notification-policy-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Notification policy contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate notification policy contracts
        run: python3 tests/notifications/test_notification_policy_contracts.py

      - name: Validate exact website DND/ZZ scope and legacy inheritance
        run: python3 tests/notifications/test_notification_website_scope.py

      - name: Validate dual Proton Browser + Bridge action policy
        run: python3 tests/notifications/test_proton_dual_adapter_policy.py

      - name: Validate private Proton event-to-message binding ledger (offline)
        run: python3 tests/notifications/test_proton_binding_ledger.py

      - name: Validate Proton independent notification/message correlation (offline)
        run: python3 tests/notifications/test_proton_notification_correlation_policy.py

      - name: Validate read-only Proton browser native handshake
        run: python3 tests/notifications/test_proton_browser_handshake.py

      - name: Validate default-off native-to-desktop Proton Unix relay
        run: python3 tests/notifications/test_proton_local_relay_pilot.py

      - name: Validate Chromium and Firefox shared Proton companion
        run: python3 tests/notifications/test_proton_multibrowser_companion.py

      - name: Validate Proton Mark Read page readiness (read-only)
        run: python3 tests/notifications/test_proton_readiness_probe.py

      - name: Validate email action deck live sender capabilities
        run: python3 tests/notifications/test_notification_email_actions.py

      - name: Validate native and browser notification intake contracts
        run: python3 tests/notifications/test_external_native_intake.py

      - name: Validate Apollo widget/menu/submenu notification destinations
        run: python3 tests/notifications/test_apollo_destination_routing.py

      - name: Validate Notifications Control Bay scroll speed and lock
        run: python3 tests/notifications/test_notification_scroll_speed.py

      - name: Validate native notification click destination and website fallback
        run: python3 tests/notifications/test_notification_destination_routing.py

      - name: Validate recorded Hospital certification lifecycle notifications
        run: python3 tests/notifications/test_hospital_certification_notifications.py

      - name: Validate Weather Station AQI producer and transition policy
        run: python3 tests/notifications/test_weather_aqi_producer.py

      - name: Validate opt-in official NWS alert intake
        run: python3 tests/notifications/test_nws_official_alert_producer.py

      - name: Validate daily Solar Report producer and NOAA snapshot policy
        run: python3 tests/notifications/test_solar_report_producer.py

      - name: Validate NOAA Kp storm transitions
        run: python3 tests/notifications/test_solar_storm_producer.py

      - name: Validate daily Weather Report producer
        run: python3 tests/notifications/test_weather_report_producer.py

      - name: Validate expanded Weather and Solar report cards
        run: python3 tests/notifications/test_rich_report_card_contracts.py

      - name: Validate CPU++ hardware thermal notifications
        run: python3 tests/notifications/test_cpu_plus_thermal_producer.py

      - name: Validate CPU++ hwmon fan-health notifications
        run: python3 tests/notifications/test_cpu_plus_fan_health_producer.py

      - name: Validate CPU++ telemetry and notification storage health
        run: python3 tests/notifications/test_monitor_and_storage_health.py

      - name: Validate passive default audio-output health
        run: python3 tests/notifications/test_audio_output_health.py

      - name: Validate origin/domain/severity classification
        run: python3 tests/notifications/test_notification_facets.py

      - name: Validate CPU++ SYSTEM observational reporting
        run: python3 tests/notifications/test_cpu_plus_system_report.py

      - name: Validate Network link transition producer
        run: python3 tests/notifications/test_network_link_producer.py

      - name: Validate bounded Internet reachability notifications
        run: python3 tests/notifications/test_network_internet_health_producer.py

      - name: Validate update-offer detection and explicit user authorization
        run: python3 tests/notifications/test_software_update_offers.py

      - name: Validate Flatpak downloads and firmware native review
        run: python3 tests/notifications/test_gnome_software_update_bridge.py

      - name: Validate safe Sway Kitty Zellij review window
        run: python3 tests/notifications/test_update_review_window.py

      - name: Validate completed local Git journal notifications
        run: python3 tests/notifications/test_local_git_journal_producer.py

      - name: Validate Hospital report arrival and GitHub issue/review outcomes
        run: python3 tests/notifications/test_hospital_reports_and_github_actions.py

      - name: Validate CPU++ RAM and root storage pressure alerts
        run: python3 tests/notifications/test_resource_pressure_producer.py
