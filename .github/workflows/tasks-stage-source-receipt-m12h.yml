name: TASKS M12h disposable stage-to-source durable receipt

on:
  pull_request:
    paths:
      - 'tests/tasks/fixtures/TaskStageSourceReceiptM12h.py'
      - 'tests/tasks/test_task_stage_source_receipt_m12h.py'
      - 'docs/tasks-stage-source-receipt-m12h.md'
      - '.github/workflows/tasks-stage-source-receipt-m12h.yml'
      - 'tests/tasks/fixtures/TaskSqliteWriterAuthorityFixture.py'
      - 'tests/tasks/fixtures/TaskFileViewOwnerHostM11g.py'
      - 'services/hub/ApolloHubTodoStore.qml'
      - 'shell.qml'
  push:
    branches: [main]
    paths:
      - 'tests/tasks/fixtures/TaskStageSourceReceiptM12h.py'
      - 'tests/tasks/test_task_stage_source_receipt_m12h.py'
      - 'docs/tasks-stage-source-receipt-m12h.md'
      - '.github/workflows/tasks-stage-source-receipt-m12h.yml'
      - 'services/hub/ApolloHubTodoStore.qml'
      - 'shell.qml'

permissions:
  contents: read

jobs:
  disposable-stage-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M12h actual disposable SQLite stage-to-source receipt and crash review
        run: python3 tests/tasks/test_task_stage_source_receipt_m12h.py
      - name: M12f native evidence inspector and disposable authority baseline
        run: python3 tests/tasks/test_task_native_evidence_inspector_m12f.py
      - name: M12e callback tags alone cannot attribute stage
        run: node --test tests/tasks/test_task_native_callback_attribution_m12e.cjs
      - name: M11g original isolated OS host, journal and source fixture
        run: python3 tests/tasks/test_task_fileview_owner_host_m11g.py
      - name: M11t production gates still open
        run: python3 tests/tasks/test_task_production_trust_contract_m11t.py
      - name: M11d one legacy production JSON writer
        run: python3 tests/tasks/test_task_writer_gate_inventory_m11d.py
