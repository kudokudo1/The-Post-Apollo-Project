name: TimeW MACHINE disposable encrypted selected-tab capture

on:
  pull_request:
    paths:
      - "services/time/MachineBraveSaveHost.py"
      - "services/time/MachineBraveSaveTrial.py"
      - "integrations/machine/brave-topology/**"
      - "tests/timew/test_machine_brave_save_native_trial.py"
      - "tests/timew/test_machine_brave_session_seal.mjs"
      - "tests/timew/test_machine_brave_save_review_ui.mjs"
      - "docs/timew-machine-brave-sealed-capture.md"
      - ".github/workflows/timew-machine-brave-sealed-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sealed-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Real WebCrypto PBKDF2 AES-GCM selected-tab encryption and no-plaintext protocol
        run: node tests/timew/test_machine_brave_session_seal.mjs
      - name: Simulated Brave review and explicit one-shot encrypted save
        run: node tests/timew/test_machine_brave_save_review_ui.mjs
      - name: Framed disposable-only native host and registration/rollback
        run: python3 -B -I tests/timew/test_machine_brave_save_native_trial.py
      - name: Preserve sealed vault, optional permission and title-marker contracts
        run: |
          python3 -B -I tests/timew/test_machine_brave_sealed_vault.py
          node tests/timew/test_machine_brave_sealed_vault_crypto.mjs
          node tests/timew/test_machine_brave_consent_preview.mjs
          node tests/timew/test_machine_brave_marker_lifecycle.mjs
          python3 -B -I tests/timew/test_machine_brave_session_recovery_contract.py
