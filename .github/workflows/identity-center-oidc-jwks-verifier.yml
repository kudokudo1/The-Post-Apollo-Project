name: Identity Center Offline JWKS Signature Verification

on:
  pull_request:
    paths:
      - 'services/identity/oidc_jwks_verifier_v0.py'
      - 'services/identity/requirements-jwks-verifier-v0.txt'
      - 'tests/identity/test_oidc_jwks_verifier_v0.py'
      - 'MODEL/contracts/identity-center-oidc-jwks-verifier-v0.md'
      - '.github/workflows/identity-center-oidc-jwks-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'services/identity/oidc_jwks_verifier_v0.py'
      - 'services/identity/requirements-jwks-verifier-v0.txt'
      - 'tests/identity/test_oidc_jwks_verifier_v0.py'
      - 'MODEL/contracts/identity-center-oidc-jwks-verifier-v0.md'
      - '.github/workflows/identity-center-oidc-jwks-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated verification library for CI
        run: python3 -m pip install -r services/identity/requirements-jwks-verifier-v0.txt
      - name: Compile identity source and tests
        run: |
          python3 -m py_compile services/identity/synthetic_policy_v0.py
          python3 -m py_compile services/identity/synthetic_request_boundary_v0.py
          python3 -m py_compile services/identity/oidc_jwks_verifier_v0.py
          python3 -m py_compile tests/identity/test_oidc_jwks_verifier_v0.py
      - name: Run all offline identity tests including signed-token security gates
        run: python3 -m unittest discover -s tests/identity -p 'test_*.py' -v
