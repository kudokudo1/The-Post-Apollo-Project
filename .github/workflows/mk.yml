name: "PX / mk"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    name: Shell syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -print0)
          if ((${#scripts[@]} == 0)); then
            echo "No .sh files found; nothing to validate."
            exit 0
          fi

          printf 'Checking %d shell script(s)\n' "${#scripts[@]}"
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done
