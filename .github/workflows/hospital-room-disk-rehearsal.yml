name: Hospital Room Disk Restore Rehearsal

on:
  pull_request:
    paths:
      - "scripts/hospital/room_lifecycle_disk_rehearsal_v2.py"
      - "tests/hospital/test_room_lifecycle_disk_rehearsal_v2.py"
      - "scripts/hospital/ROOM-LIFECYCLE-DISK-REHEARSAL-V2.md"
      - ".github/workflows/hospital-room-disk-rehearsal.yml"
  push:
    branches: [main]
    paths:
      - "scripts/hospital/room_lifecycle_disk_rehearsal_v2.py"
      - "tests/hospital/test_room_lifecycle_disk_rehearsal_v2.py"
      - "scripts/hospital/ROOM-LIFECYCLE-DISK-REHEARSAL-V2.md"
      - ".github/workflows/hospital-room-disk-rehearsal.yml"

permissions:
  contents: read

jobs:
  disposable-disk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kudokudo1/The-Post-Apollo-Dev-Exp
          ref: c856f6edafb27b3f2a233ad3beaf33653c9dbde9
          path: px-source
          persist-credentials: false
      - name: Execute disposable persistent SQLite safety matrix
        run: |
          python3 -B -m unittest discover -s tests/hospital -p 'test_room_lifecycle_disk_rehearsal_v2.py' -v
      - name: Refuse standalone file-backed lifecycle interface
        run: |
          if python3 scripts/hospital/room_lifecycle_disk_rehearsal_v2.py; then
            echo "CI-only rehearsal unexpectedly accepted direct use"
            exit 1
          fi
