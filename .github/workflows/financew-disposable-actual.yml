name: FinanceW disposable Actual server roundtrip

on:
  pull_request:
    paths:
      - "scripts/finance/write_transaction.mjs"
      - "scripts/finance/transaction_guard.mjs"
      - "scripts/finance/read_budget.mjs"
      - "scripts/finance/opening_history.mjs"
      - "scripts/finance/income_categorization_preview.mjs"
      - "scripts/finance/actual_readonly.mjs"
      - "scripts/finance/read_opening_history.mjs"
      - "scripts/finance/disposable_actual_roundtrip.mjs"
      - "scripts/finance/disposable_allocation_roundtrip.mjs"
      - "tests/finance/fixtures/funding_disposable_rehearsal.mjs"
      - "tests/finance/test_funding_disposable_rehearsal.mjs"
      - "scripts/finance/allocation_guard.mjs"
      - "scripts/finance/write_allocation.mjs"
      - "scripts/finance/funding_guard.mjs"
      - "scripts/finance/write_funding.mjs"
      - "scripts/finance/category_guard.mjs"
      - "scripts/finance/write_category.mjs"
      - "tests/finance/test_category_guard.mjs"
      - "tests/finance/test_category_cli_recovery.mjs"
      - "tests/finance/test_funding_guard.mjs"
      - "tests/finance/test_funding_write_gate.mjs"
      - ".github/workflows/financew-disposable-actual.yml"
  push:
    branches: [main]
    paths:
      - "scripts/finance/write_transaction.mjs"
      - "scripts/finance/transaction_guard.mjs"
      - "scripts/finance/read_budget.mjs"
      - "scripts/finance/opening_history.mjs"
      - "scripts/finance/income_categorization_preview.mjs"
      - "scripts/finance/actual_readonly.mjs"
      - "scripts/finance/read_opening_history.mjs"
      - "scripts/finance/disposable_actual_roundtrip.mjs"
      - "scripts/finance/disposable_allocation_roundtrip.mjs"
      - "tests/finance/fixtures/funding_disposable_rehearsal.mjs"
      - "tests/finance/test_funding_disposable_rehearsal.mjs"
      - "scripts/finance/allocation_guard.mjs"
      - "scripts/finance/write_allocation.mjs"
      - "scripts/finance/funding_guard.mjs"
      - "scripts/finance/write_funding.mjs"
      - "scripts/finance/category_guard.mjs"
      - "scripts/finance/write_category.mjs"
      - "tests/finance/test_category_guard.mjs"
      - "tests/finance/test_category_cli_recovery.mjs"
      - "tests/finance/test_funding_guard.mjs"
      - "tests/finance/test_funding_write_gate.mjs"
      - ".github/workflows/financew-disposable-actual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-actual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Actual API and server in isolated CI checkout
        run: |
          npm install --prefix scripts/finance --no-save --package-lock=false --no-audit --no-fund @actual-app/api@26.10.0 @actual-app/sync-server@26.10.0
      - name: End-to-end disposable server verification (fictional budget only)
        env:
          FINANCEW_DISPOSABLE_TEST: "yes"
        run: |
          node --check scripts/finance/disposable_actual_roundtrip.mjs
          node scripts/finance/disposable_actual_roundtrip.mjs
      - name: D12b / D17b / D17c real Actual disposable financial writer checks
        env:
          FINANCEW_DISPOSABLE_TEST: "yes"
        run: |
          node --check scripts/finance/disposable_allocation_roundtrip.mjs
          node scripts/finance/disposable_allocation_roundtrip.mjs
