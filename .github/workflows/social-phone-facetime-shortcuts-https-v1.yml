name: Social PHONE FaceTime iPhone HTTPS Gateway V1

on:
  pull_request:
    paths:
      - 'services/phone/PhoneFaceTimeShortcutHttps.py'
      - 'tests/phone/test_phone_facetime_shortcuts_https_v1.py'
      - 'MODEL/contracts/social-phone-facetime-iphone-https-gateway-v1.md'
      - 'MODEL/contracts/social-phone-facetime-iphone-https-readiness-v2.md'
      - '.github/workflows/social-phone-facetime-shortcuts-https-v1.yml'
  push:
    branches: [main]
    paths:
      - 'services/phone/PhoneFaceTimeShortcutHttps.py'
      - 'tests/phone/test_phone_facetime_shortcuts_https_v1.py'
      - 'MODEL/contracts/social-phone-facetime-iphone-https-gateway-v1.md'
      - 'MODEL/contracts/social-phone-facetime-iphone-https-readiness-v2.md'
      - '.github/workflows/social-phone-facetime-shortcuts-https-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-only-tls-1-3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile import-only HTTPS gateway, existing relay and local operator
        run: |
          python -m py_compile services/phone/PhoneFaceTimeShortcutHttps.py
          python -m py_compile services/phone/PhoneFaceTimeShortcutRelay.py services/phone/PhoneFaceTimeShortcutOperator.py
      - name: Real dual-listener TLS 1.3, no-socket configuration check, pinned key and private route refusal
        run: python -m unittest discover -s tests/phone -p 'test_phone_facetime_shortcuts_https_v1.py' -v
      - name: Inherited one-time request relay, privacy and typed confirmation
        run: python -m unittest discover -s tests/phone -p 'test_phone_facetime_shortcuts_relay_v1.py' -v
      - name: Existing FaceTime status, Bluetooth, contacts and invitation protections
        run: |
          python -m unittest discover -s tests/phone -p 'test_phone_facetime_iphone_only_pilot.py' -v
          python -m unittest discover -s tests/phone -p 'test_phone_facetime_audio_route_v2.py' -v
          python -m unittest discover -s tests/messaging -p 'test_social_phone_facetime_iphone_only_pilot_ui.py' -v
          node tests/messaging/test_social_phone_facetime_handoff_js.js
          python -m unittest discover -s tests/messaging -p 'test_social_phone_facetime_handoff_ui.py' -v
          python -m unittest discover -s tests/messaging -p 'test_social_phone_facetime_audio_route_v2_ui.py' -v
          python -m unittest discover -s tests/phone -p 'test_phone_audio_controls.py' -v
          python -m unittest discover -s tests/messaging -p 'test_social_phone_contact_metadata_locked_p40.py' -v
      - name: Explicit non-activation state
        run: |
          echo 'IPHONE_TLS // SOURCE_TEST_ONLY'
          echo 'IPHONE_TLS // NO_IPHONE_OR_APP_CONNECTIVITY_PROOF'
          echo 'IPHONE_TLS // NO_HOST_LAN_LISTENER_OR_TRUST_ROOT_CHANGED'
          echo 'IPHONE_TLS // NO_FACETIME_CALL_OR_INCOMING_ANSWER_VIDEO'
