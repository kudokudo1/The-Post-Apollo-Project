name: Weather Station MEDIA D1 NEWS WATCH RADIO CREATORS subject panels

on:
  pull_request:
    paths:
      - 'widgets/weather/StationMediaSubjectPanelPolicy.js'
      - 'widgets/weather/StationMediaSubjectPane.qml'
      - 'widgets/weather/StationMediaHeader.qml'
      - 'widgets/weather/StationMediaServicesPane.qml'
      - 'widgets/weather/StationSubjectNavigationPolicy.js'
      - 'widgets/weather/StationWorkspaceSurface.qml'
      - 'widgets/weather/StationNewsHub.qml'
      - 'widgets/weather/StationRadio.qml'
      - 'widgets/weather/StationDiscovery.qml'
      - 'widgets/weather/StationSubjectNavigator.qml'
      - 'widgets/weather/WeatherStationW.qml'
      - 'tests/weather/test_media_subject_panels_d1.js'
      - 'tests/weather/test_media_m1_fixed_regions.js'
      - 'tests/weather/fixtures/M1MediaFixedRadio.qml'
      - '.github/workflows/weather-media-subject-panels-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify media source routing and all preceding subject migrations
        run: |
          node --test tests/weather/subject_navigation_contract.test.js
          node --test tests/weather/subject_navigation_browser.test.js
          node --test tests/weather/test_weather_subject_panels_m2a.js
          node --test tests/weather/test_weather_subject_panels_m2b.js
          node --test tests/weather/test_cosmos_subject_panels_c1.js
          node --test tests/weather/test_earth_subject_panels_e1.js
          node --test tests/weather/test_media_subject_panels_d1.js
          node --test tests/weather/test_media_m1_fixed_regions.js
          node --test tests/weather/test_media_full_visual_parity_m28t.js
  native-fixed-radio:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable Quickshell and Qt
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git quickshell qt6-qpa-plugins \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects \
            coreutils findutils
      - uses: actions/checkout@v4
      - name: Verify pinned radio actions, non-scrolling MEDIA heading and SERVICES
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/media-m1.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services" "$work/config/services"
          cp "$root/tests/weather/fixtures/M1MediaFixedRadio.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 40s \
            env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            quickshell --no-color -p "$work/config/shell.qml" \
            > "$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "M1_NATIVE_PASS // RADIO_PINNED_CONTROLS_MEDIA_NEWS_HEADERS_SERVICES" "$work/native.log"
          if grep -E 'M1_NATIVE_FAIL|Failed to load configuration|ReferenceError|TypeError|Cannot assign' "$work/native.log"; then
            exit 1
          fi
