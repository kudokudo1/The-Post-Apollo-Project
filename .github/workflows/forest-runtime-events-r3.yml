name: Forest Runtime R3 correlated events
on:
  pull_request:
    paths:
      - 'scripts/forest/runtime_events_r3.py'
      - 'scripts/forest/turn_bridge_b3.py'
      - 'scripts/forest/runtime_stop_control_r2.py'
      - 'scripts/forest/context_first_tree_m2.py'
      - 'tests/forest/test_runtime_events_r3.py'
      - 'scripts/forest/RUNTIME_EVENTS_R3.md'
      - '.github/workflows/forest-runtime-events-r3.yml'
  push:
    paths:
      - 'scripts/forest/runtime_events_r3.py'
      - 'tests/forest/test_runtime_events_r3.py'
      - 'scripts/forest/RUNTIME_EVENTS_R3.md'
      - '.github/workflows/forest-runtime-events-r3.yml'
jobs:
  correlated-fixture-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/forest -p 'test_runtime_events_r3.py' -v
      - run: python3 -m unittest discover -s tests/forest -p 'test_turn_bridge_b3.py' -v
      - run: python3 -m py_compile scripts/forest/runtime_events_r3.py tests/forest/test_runtime_events_r3.py
