# Koinoikos // Post Apollo relationship focus (OPT-IN INCLUDE)
#
# Include once from your own ~/.config/sway/config:
#   include ~/.config/quickshell/config/sway/koinoikos-focus.conf
#
# This does NOT redefine $mod, move ordinary Sway keybindings, or alter
# installed window colors. The displayed shortcut is Super+~ (relationship
# symbol); the actual key is unshifted grave/backtick with Super. No Shift.
# Confirm the grave keysym matches the operator's active XKB keymap.
#
# In Focus Mode bare arrows and hjkl are compositor-owned. A router
# considers both visible Sway container windows and the registered QS
# layer-shell menus. If QS is absent the router falls back to Sway focus.
#
# The external 'exec' avoids relying on ambiguous multi-command bindsym
# delimiters. Escape always returns to the compositor's default key mode.
bindsym Mod4+grave exec sh -c 'swaymsg mode "Koinoikos Focus"; python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" enter'

mode "Koinoikos Focus" {
    bindsym Left  exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move left
    bindsym Right exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move right
    bindsym Up    exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move up
    bindsym Down  exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move down

    bindsym h exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move left
    bindsym l exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move right
    bindsym k exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move up
    bindsym j exec python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" move down

    bindsym Escape exec sh -c 'python3 "$HOME/.config/quickshell/scripts/koinoikos_focus.py" exit; swaymsg mode default'
}
