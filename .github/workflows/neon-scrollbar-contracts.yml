name: "Neon scrollbar contracts"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "components/NeonScrollBar.qml"
      - "widgets/GitBranchesView.qml"
      - "widgets/GitHistoryView.qml"
      - "widgets/GitRepositoryView.qml"
      - "widgets/HospitalArchiveView.qml"
      - "tests/components/test_neon_scrollbar_contracts.py"
      - "tests/components/test_neon_scrollbar_syntagma_contracts.py"
      - "tests/components/test_neon_scrollbar_qt_runtime.py"
      - "tests/components/neon_scrollbar_runtime_harness.qml"
      - "docs/neon-scrollbar-syntagma-api.md"
      - ".github/workflows/neon-scrollbar-contracts.yml"
  pull_request:
    paths:
      - "components/NeonScrollBar.qml"
      - "widgets/GitBranchesView.qml"
      - "widgets/GitHistoryView.qml"
      - "widgets/GitRepositoryView.qml"
      - "widgets/HospitalArchiveView.qml"
      - "tests/components/test_neon_scrollbar_contracts.py"
      - "tests/components/test_neon_scrollbar_syntagma_contracts.py"
      - "tests/components/test_neon_scrollbar_qt_runtime.py"
      - "tests/components/neon_scrollbar_runtime_harness.qml"
      - "docs/neon-scrollbar-syntagma-api.md"
      - ".github/workflows/neon-scrollbar-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Neon scrollbar contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate reusable scrollbar contracts
        run: python3 tests/components/test_neon_scrollbar_contracts.py

      - name: Validate Syntagma scrollbar configuration contracts
        run: python3 tests/components/test_neon_scrollbar_syntagma_contracts.py

  runtime-smoke:
    name: Offscreen Qt scrollbar smoke
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install Qt runtime bindings
        run: python -m pip install "PySide6>=6.10,<6.12"
      - name: Exercise live QML object and nested wheel handling
        run: python tests/components/test_neon_scrollbar_qt_runtime.py
