      - "widgets/FinanceIncomeCategorizationPane.qml"
      - "widgets/FinanceFundingSetupPane.qml"
      - "widgets/FinanceBudgetGrid.qml"
      - "widgets/FinanceQuickAddPane.qml"
      - "widgets/FinanceAccountsPane.qml"
