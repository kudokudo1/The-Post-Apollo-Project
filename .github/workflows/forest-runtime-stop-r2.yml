name: Forest Runtime R2 STOP arbitration
on:
  pull_request:
    paths:
      - 'scripts/forest/runtime_stop_control_r2.py'
      - 'tests/forest/test_runtime_stop_control_r2.py'
      - 'scripts/forest/RUNTIME_STOP_R2.md'
      - '.github/workflows/forest-runtime-stop-r2.yml'
  push:
    paths:
      - 'scripts/forest/runtime_stop_control_r2.py'
      - 'tests/forest/test_runtime_stop_control_r2.py'
      - 'scripts/forest/RUNTIME_STOP_R2.md'
      - '.github/workflows/forest-runtime-stop-r2.yml'
jobs:
  disposable-stop-arbitration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/forest -p 'test_runtime_stop_control_r2.py' -v
      - run: python3 -m py_compile scripts/forest/runtime_stop_control_r2.py tests/forest/test_runtime_stop_control_r2.py
