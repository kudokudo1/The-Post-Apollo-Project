name: "Neon scrollbar contracts"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "components/NeonScrollBar.qml"
      - "widgets/ForestWorkshopReferenceView.qml"
      - "tests/forest/workshop_scrollbar_native/**"
      - "widgets/GitBranchesView.qml"
      - "widgets/GitHistoryView.qml"
      - "widgets/GitRepositoryView.qml"
      - "widgets/HospitalArchiveView.qml"
      - "tests/components/test_neon_scrollbar_contracts.py"
      - "tests/components/test_neon_scrollbar_syntagma_contracts.py"
      - "tests/components/test_neon_scrollbar_surface_migration.py"
      - "components/ConversationFeed.qml"
      - "widgets/Git*.qml"
      - "widgets/Hospital*.qml"
      - "widgets/RepositoryProfileView.qml"
      - "widgets/WorkflowLibraryView.qml"
      - "widgets/RunInspectorDrawer.qml"
      - "widgets/notifications/NotificationsHubW.qml"
      - "tests/components/test_neon_scrollbar_qt_runtime.py"
      - "tests/components/neon_scrollbar_runtime_harness.qml"
      - "docs/neon-scrollbar-syntagma-api.md"
      - ".github/workflows/neon-scrollbar-contracts.yml"
  pull_request:
    paths:
      - "components/NeonScrollBar.qml"
      - "widgets/ForestWorkshopReferenceView.qml"
      - "tests/forest/workshop_scrollbar_native/**"
      - "widgets/GitBranchesView.qml"
      - "widgets/GitHistoryView.qml"
      - "widgets/GitRepositoryView.qml"
      - "widgets/HospitalArchiveView.qml"
      - "tests/components/test_neon_scrollbar_contracts.py"
      - "tests/components/test_neon_scrollbar_syntagma_contracts.py"
      - "tests/components/test_neon_scrollbar_surface_migration.py"
      - "components/ConversationFeed.qml"
      - "widgets/Git*.qml"
      - "widgets/Hospital*.qml"
      - "widgets/RepositoryProfileView.qml"
      - "widgets/WorkflowLibraryView.qml"
      - "widgets/RunInspectorDrawer.qml"
      - "widgets/notifications/NotificationsHubW.qml"
      - "tests/components/test_neon_scrollbar_qt_runtime.py"
      - "tests/components/neon_scrollbar_runtime_harness.qml"
      - "docs/neon-scrollbar-syntagma-api.md"
      - ".github/workflows/neon-scrollbar-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Neon scrollbar contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate reusable scrollbar contracts
        run: python3 tests/components/test_neon_scrollbar_contracts.py

      - name: Validate Syntagma scrollbar configuration contracts
        run: python3 tests/components/test_neon_scrollbar_syntagma_contracts.py

      - name: Validate Git/Hospital star migration and glow contracts
        run: python3 tests/components/test_neon_scrollbar_surface_migration.py

  runtime-smoke:
    name: Offscreen Qt scrollbar smoke
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install Qt runtime bindings
        run: python -m pip install "PySide6>=6.10,<6.12"
      - name: Exercise live QML object and nested wheel handling
        run: python tests/components/test_neon_scrollbar_qt_runtime.py

  workshop-native:
    name: Forest Workshop actual native scrollbar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install coherent Qt and Quickshell
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf copr enable -y errornointernet/quickshell
          dnf install -y --setopt=install_weak_deps=False quickshell qt6-qtdeclarative qt6-qt5compat qt6-qtbase-gui qt6-qtsvg python3 git coreutils findutils diffutils grep
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native actual Workshop with isolated reference-only helper
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_LOGGING_RULES: 'qml.debug=true;qml.info=true;qml.warning=true;qml.critical=true'
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          export HOME="$work/home" XDG_CONFIG_HOME="$work/config" XDG_CACHE_HOME="$work/cache" XDG_DATA_HOME="$work/data" XDG_RUNTIME_DIR="$work/run"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          scene="$work/config/workshop"
          mkdir -p "$scene/widgets" "$scene/services/forest" "$scene/scripts/forest"
          cp -a components "$scene/components"
          cp widgets/ForestWorkshopReferenceView.qml "$scene/widgets/"
          cp services/forest/ForestWorkshopReferencePolicy.js "$scene/services/forest/"
          for name in ui_workshop_reference.py shared_context_b6r1.py capability_registry_b6r2.py; do
            cp "scripts/forest/$name" "$scene/scripts/forest/$name"
          done
          for name in widgets/ForestWorkshopReferenceView.qml components/NeonScrollBar.qml services/forest/ForestWorkshopReferencePolicy.js scripts/forest/ui_workshop_reference.py; do
            cmp "$name" "$scene/$name"
          done
          cp tests/forest/workshop_scrollbar_native/shell.qml "$scene/shell.qml"
          timeout --signal=TERM --kill-after=3s 30s quickshell --path "$scene/shell.qml" --no-color --log-rules "$QT_LOGGING_RULES" 2>&1 | tee "$work/output"
          if grep -q WORKSHOP_SCROLL_FAIL "$work/output"; then exit 1; fi
          observed="$(grep -oE 'WORKSHOP_SCROLL_PHASE_PASS [0-5]' "$work/output" || true)"
          expected="$(printf 'WORKSHOP_SCROLL_PHASE_PASS %s\n' 0 1 2 3 4 5)"
          test "$observed" = "$expected"
          grep -q WORKSHOP_SCROLL_NATIVE_PASS "$work/output"
