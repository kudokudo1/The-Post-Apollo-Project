name: Connections C2m disposable private D-Bus service pilot

on:
  pull_request:
    paths:
      - "services/connections/experiments/C2mPrivateBusStatusPilot.py"
      - "services/connections/experiments/C2mConnectionsStatusPilot.xml"
      - "tests/connections/test_connections_c2m_private_bus_pilot.py"
      - ".github/workflows/connections-c2m-private-dbus-pilot.yml"
      - "docs/connections-c2m-private-bus-pilot.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-disposable-private-bus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only D-Bus tools on disposable runner
        run: |
          if ! command -v dbus-daemon >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y dbus-daemon
          fi
          python3 -m pip install --disable-pip-version-check --no-deps "dbus-next==0.2.3"
      - name: Actual private bus status, name collision, shutdown, denial and interface schema
        run: timeout 90s python3 -B tests/connections/test_connections_c2m_private_bus_pilot.py
      - name: Prior C2l identity refusal and C2k/C2i/C2j socket regressions
        run: |
          timeout 35s python3 -B tests/connections/test_connections_c2l_host_trust_boundary.py
          timeout 45s python3 -B tests/connections/test_connections_c2k_readonly_launcher.py
          timeout 35s python3 -B tests/connections/test_connections_c2j_host_status_server.py
          timeout 40s python3 -B tests/connections/test_connections_c2j_fake_host_socket.py
          timeout 35s python3 -B tests/connections/test_connections_c2i_host_inspection.py
      - name: Existing CPU++ status and credential policy stays deny-only
        run: |
          node tests/cpuplus/test_connections_host_inspection_c2i.js
          node tests/cpuplus/test_connections_status_c2g.js
          node tests/cpuplus/test_connections_broker_c2a.js
      - name: Pilot must not be imported into production
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parent=Path("services/connections")
          for path in [*parent.glob("*.qml"), *parent.glob("*.js"), parent/"qmldir"]:
              assert "C2mPrivateBusStatusPilot" not in path.read_text(), path
          for token in ("ConnectionsHostObservation.qml", "ConnectionsBroker.qml",
                        "ConnectionsRequestStatus.qml", "ConnectionsHostStatusInspect.py"):
              path=parent/token
              assert "C2mConnectionsStatusPilot" not in path.read_text(), path
          assert "readonly property bool credentialActionsEnabled: false" in (
              parent/"ConnectionsBroker.qml").read_text()
          assert "readonly property bool hostAuthenticated: false" in (
              parent/"ConnectionsRequestStatus.qml").read_text()
          print("C2M_PASS // PRIVATE_BUS_DISPOSABLE_TRANSPORT_ONLY_NO_PRODUCTION_GRANT")
          PY
