name: FinanceW Market M26-M27 loaded range and selected close comparisons

on:
  pull_request:
    paths:
      - "widgets/FinanceStockHistoryPane.qml"
      - "widgets/FinanceStockRangeAnalysisPolicy.js"
      - "tests/finance/test_market_m26_range_analysis.mjs"
      - "tests/finance/test_market_price_range.mjs"
      - "scripts/finance/MARKET_M26_RANGE_ANALYSIS_README.md"
      - "scripts/finance/MARKET_M27_SELECTED_CLOSE_COMPARISON_README.md"
      - ".github/workflows/financew-market-m26-range-analysis.yml"
  push:
    branches: [main]
    paths:
      - "widgets/FinanceStockHistoryPane.qml"
      - "widgets/FinanceStockRangeAnalysisPolicy.js"
      - "tests/finance/test_market_m26_range_analysis.mjs"
      - "tests/finance/test_market_price_range.mjs"
      - "scripts/finance/MARKET_M26_RANGE_ANALYSIS_README.md"
      - "scripts/finance/MARKET_M27_SELECTED_CLOSE_COMPARISON_README.md"
      - ".github/workflows/financew-market-m26-range-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loaded-range-analysis:
    name: Loaded range movement + selected-to-last close; no provider calls
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure Market M26-M27 range movement/selected compare, malformed source and UI contracts
        run: node tests/finance/test_market_m26_range_analysis.mjs
      - name: Existing M10-M27 Market price-range regression chain
        run: node tests/finance/test_market_price_range.mjs
