name: Git map incremental prefix proof
on:
  pull_request:
    paths:
      - "scripts/git_map_incremental_candidate.py"
      - "scripts/git_map_history_index.py"
      - "tests/git/test_git_map_incremental_candidate.py"
      - ".github/workflows/git-map-incremental-prefix.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare immutable candidate to full Git rebuild
        run: |
          python3 -B tests/git/test_git_map_history_index.py
          POST_APOLLO_INCREMENTAL_BENCH=1 python3 -B tests/git/test_git_map_incremental_candidate.py
