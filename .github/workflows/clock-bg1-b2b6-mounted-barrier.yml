name: Clock BG1-B2B6 mounted alarm writer barrier (inactive until trust)
on:
  pull_request:
    paths:
      - "services/time/AlarmManagerService.qml"
      - "services/time/AlarmWriterBarrierPolicy.js"
      - "services/time/BG1-ALARM-MOUNTED-WRITE-BARRIER.md"
      - "tests/time/test_clock_bg1_b2b6_mounted_barrier.cjs"
      - ".github/workflows/clock-bg1-b2b6-mounted-barrier.yml"
  push:
    paths:
      - "services/time/AlarmManagerService.qml"
      - "services/time/AlarmWriterBarrierPolicy.js"
      - "services/time/BG1-ALARM-MOUNTED-WRITE-BARRIER.md"
      - "tests/time/test_clock_bg1_b2b6_mounted_barrier.cjs"
      - ".github/workflows/clock-bg1-b2b6-mounted-barrier.yml"
permissions:
  contents: read
jobs:
  source-barrier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test default-deny barrier and actual mounted alarm QML paths
        run: node --test tests/time/test_clock_bg1_b2b6_mounted_barrier.cjs
      - name: Preserve all mounted Clock V2 and note editor contracts
        run: |
          python3 -m unittest discover -s tests/time -p 'test_clock_alarm_manager_v2_contract.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_alarm_note_recovery_contract.py' -v
      - name: Preserve BG1 ownership, synthetic broker and kernel peer
        run: |
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_owner_fencing_contract.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_broker_protocol.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2_shadow_transactions.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b_peer_identity.py' -v
      - name: Strict scoped owner file change check
        run: |
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"], text=True
          ).splitlines())
          permitted={
              "services/time/AlarmManagerService.qml",
              "services/time/AlarmWriterBarrierPolicy.js",
              "services/time/BG1-ALARM-MOUNTED-WRITE-BARRIER.md",
              "tests/time/test_clock_bg1_b2b6_mounted_barrier.cjs",
              ".github/workflows/clock-bg1-b2b6-mounted-barrier.yml"}
          assert changed==permitted, f"Unapproved change: {changed ^ permitted}"
          print("No Clock broker, background observer, sound, notifications, Identity or Connections modified: PASS")
          PY
