name: Trash Bottom-Left Launcher Contracts

on:
  pull_request:
    paths:
      - shell.qml
      - modules/Trash.qml
      - modules/Power.qml
      - components/DockButton.qml
      - tests/trash/**
      - scripts/trash/**
      - .github/workflows/trash-bottom-left-launcher.yml
  push:
    paths:
      - shell.qml
      - modules/Trash.qml
      - modules/Power.qml
      - components/DockButton.qml
      - tests/trash/**
      - scripts/trash/**
      - .github/workflows/trash-bottom-left-launcher.yml

permissions:
  contents: read

jobs:
  bottom-left-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify Trash launcher, scoped GIO adapter, and deletion safeguards
        run: python3 -m unittest discover -s tests/trash -p 'test_*.py' -v
