name: Weather COSMOS C8 Moon fixed viewport

on:
  pull_request:
    paths:
      - 'widgets/weather/StationCosmosMoonCompactPane.qml'
      - 'widgets/weather/StationCosmosSubjectPane.qml'
      - 'tests/weather/test_cosmos_c8_moon_compact.js'
      - 'tests/weather/fixtures/C8MoonCompactNativeShell.qml'
      - '.github/workflows/weather-cosmos-c8-moon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moon-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Moon-only routing and data ownership
        run: node --test tests/weather/test_cosmos_c8_moon_compact.js

  native-moon:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable offscreen Quickshell
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git quickshell qt6-qpa-plugins \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects \
            coreutils findutils
          quickshell --version
      - uses: actions/checkout@v4
      - name: Exercise full-source compact Moon within 450x276 stage
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/cosmos-c8-moon.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets" "$work/config/services" "$work/config/scripts"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services/." "$work/config/services/"
          cp -a "$root/scripts/weather" "$work/config/scripts/weather"
          cp "$root/tests/weather/fixtures/C8MoonCompactNativeShell.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 20s env \
            HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen \
            quickshell --no-color -p "$work/config/shell.qml" \
            >"$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          if [ "$rc" -ne 0 ] \
              || ! grep -F "C8_MOON_PASS // NINE_FACTS COMPACT_PHASE NO_SCROLL PROVIDER_LIMITS" "$work/native.log" >/dev/null \
              || grep -F "C8_MOON_FAIL" "$work/native.log" >/dev/null \
              || grep -F "Failed to load configuration" "$work/native.log" >/dev/null \
              || grep -E "StationCosmosMoonCompactPane.qml.*(TypeError|ReferenceError|Unable to assign)" "$work/native.log" >/dev/null; then
            echo "C8_MOON_FAIL // process_exit=$rc" >&2
            exit 1
          fi
          echo "C8_MOON_PASS // NATIVE_SOURCE_TO_RENDERED_VIEW"
