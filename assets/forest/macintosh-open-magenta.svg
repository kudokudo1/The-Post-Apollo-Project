<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><title>Macintosh, Forest Tree glyph</title><desc>Line-only fruit/apple Macintosh icon with red-to-green top-to-bottom stroke gradient, green leaf and digital hollow square details; Forest provides red external glow.</desc>
<g fill="none" stroke="#C74EC7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
  <!-- open right edge with digital break, no large opaque fills -->
  <path d="M24 16 C18 12 11 14 8 19 C4 25 8 37 13 42 C16 45 21 43 24 42 C28 44 31 44 34 41"/>
  <path d="M24 16 C28 13 34 13 39 17"/>
  <path d="M39 17 Q36 19 37 22"/>
  <path d="M35 36 C36 33 34 30 35 27"/>
  <path d="M23 15 C23 12 22 9 19 7" stroke-width="2"/>
</g>
<!-- a handful of digital breakup squares, visible at 26px -->
<g fill="none" stroke="#C74EC7" stroke-width="1.8" stroke-linejoin="miter">
  <path d="M39 22 H44 V27 H39 Z M37 32 H41 V36 H37 Z M33 24 H36 V27 H33 Z"/>
</g>
<g fill="none" stroke="#C74EC7" stroke-width="1.3" stroke-linecap="round">
  <path d="M12 22 Q10 28 14 34 M16 20 Q18 18 22 20"/>
</g>
<!-- independent green leaf, small enough to read at glyph scale -->
<g fill="none" stroke="#C74EC7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M25 15 C25 9 30 5 39 5 C37 13 32 17 25 15 Z"/>
  <path d="M26 14 C30 11 33 9 36 8" stroke-width="1.4"/>
</g>
</svg>
