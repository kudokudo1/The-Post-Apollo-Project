name: Weather Station W6 canonical SERVICES rollout

on:
  pull_request:
    paths:
      - 'widgets/weather/StationServicesConsole.qml'
      - 'widgets/weather/StationHome.qml'
      - 'widgets/weather/StationEarthServicesPane.qml'
      - 'widgets/weather/StationMediaServicesPane.qml'
      - 'widgets/weather/StationCosmosSpaceWeatherHubPane.qml'
      - 'widgets/weather/StationWorkspaceNavigationPolicy.js'
      - 'tests/weather/test_services_w6_canonical_rollout.js'
      - 'tests/weather/test_cosmos_full_visual_parity_m28p.js'
      - 'tests/weather/test_cosmos_subject_panels_c1.js'
      - 'tests/weather/fixtures/W3HomeSourcesHistoryNative.qml'
      - 'tests/weather/fixtures/W6ServicesConsoleNative.qml'
      - '.github/workflows/weather-services-w6-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve service owners and previous family contracts
        run: |
          node --test tests/weather/test_services_w6_canonical_rollout.js
          node --test tests/weather/test_home_w3_sources_and_history_fit.js
          node --test tests/weather/test_workspace_landing_w1.js
          node --test tests/weather/test_earth_e2_unified_map.js
          node --test tests/weather/test_earth_e3_pinned_controls.js
          node --test tests/weather/test_earth_e8_c44_header.js
          node --test tests/weather/test_media_m1_fixed_regions.js
          node --test tests/weather/test_media_m2_context_rails.js
          node --test tests/weather/test_media_m5_feeds_services.js
          node --test tests/weather/test_cosmos_c42_space_runtime_dashboard.js
          node --test tests/weather/test_cosmos_c44_header_alignment.js
          node --test tests/weather/test_cosmos_subject_panels_c1.js
          node --test tests/weather/test_cosmos_full_visual_parity_m28p.js
          node --test tests/weather/test_weather_w5_canonical_services.js

  native-canonical:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 12
    steps:
      - name: Install disposable Quickshell runtime
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git quickshell qt6-qpa-plugins \
            qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects \
            coreutils findutils
      - uses: actions/checkout@v4
      - name: Native 520x300 canonical console for EARTH HOME MEDIA
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/services-w6.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services" "$work/config/services"
          cp "$root/tests/weather/fixtures/W6ServicesConsoleNative.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 40s \
            env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" \
            XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            quickshell --no-color -p "$work/config/shell.qml" \
            > "$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "W6_NATIVE_PASS // EARTH_HOME_MEDIA_CANONICAL_SERVICES_520X300" "$work/native.log"
          if grep -E 'W6_NATIVE_FAIL|Failed to load configuration|ReferenceError|TypeError|Cannot assign' "$work/native.log"; then
            exit 1
          fi
