name: Weather Station Teardown Contracts

on:
  pull_request:
    paths:
      - "widgets/weather/**"
      - "modules/Weather.qml"
      - "components/WeatherCelestialGlyph.qml"
      - "components/qmldir"
      - "services/weather/**"
      - "shell.qml"
      - "tests/weather/**"
      - ".github/workflows/weather-teardown-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "widgets/weather/**"
      - "modules/Weather.qml"
      - "components/WeatherCelestialGlyph.qml"
      - "components/qmldir"
      - "services/weather/**"
      - "shell.qml"
      - "tests/weather/**"
      - ".github/workflows/weather-teardown-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Weather Station effect teardown contracts
        run: python3 tests/weather/test_shader_teardown_contracts.py
      - name: Validate live Weather dock state classification
        run: node tests/weather/test_weather_dock_policy.js
      - name: Validate Weather data parsing and forecast contracts
        run: node tests/weather/test_weather_data_policy.js
      - name: Verify SKY hourly detail inspection of existing forecast data
        run: node tests/weather/test_station_sky_hourly_inspector.js
      - name: Validate Weather solar and lunar cycle with flat icon contracts
        run: node tests/weather/test_weather_cycle_policy.js
      - name: Validate Weather Station Home relevance policy
        run: node tests/weather/test_station_home_policy.js
      - name: Validate Weather core source-health and per-feed state
        run: node tests/weather/test_station_source_health.js
      - name: Validate Kitty Sway workarea coordinate contracts
        run: node tests/weather/test_station_terminal_geometry.js
      - name: Validate internal NEWS viewer and URL boundary contracts
        run: node tests/weather/test_station_news_viewer.js
      - name: Validate NEWS compositor host namespace and local viewport geometry
        run: node tests/weather/test_station_news_viewport_geometry.js
      - name: Validate NEWS source catalog and creator subscriptions
        run: node tests/weather/test_station_news_channel_hub.js
      - name: Validate NEWS isolated browser preflight safety contract
        run: python3 tests/weather/test_station_news_viewer_preflight.py
      - name: Validate optional YouTube creator feed parser offline
        run: python3 tests/weather/test_station_youtube_feed.py
      - name: Validate GDELT NEWS rate limit, cache and live source reporting
        run: node tests/weather/test_station_discovery_rate_limit.js
      - name: Validate Weather Station domain palette and live meter contracts
        run: node tests/weather/test_domain_palette_contracts.js
      - name: Verify GROUND individual pollen readings and unavailable states
        run: node tests/weather/test_station_ground_pollen_species.js
      - name: Verify GROUND shared official NWS alert surface
        run: node tests/weather/test_station_ground_nws_alerts.js
      - name: Verify official NWS alert hierarchy across HOME header and dock
        run: node tests/weather/test_station_official_alert_hierarchy.js
