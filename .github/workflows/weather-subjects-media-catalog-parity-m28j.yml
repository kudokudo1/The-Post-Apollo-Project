name: Weather M28-J MEDIA WATCH and CREATORS catalog parity

on:
  pull_request:
    paths:
      - 'widgets/weather/StationSubjectNavigationPreviewPolicy.js'
      - 'tests/weather/test_index_subject_cutover_m28d.js'
      - 'tests/weather/test_index_radio_cutover_m28e.js'
      - 'tests/weather/test_index_weather_cutover_m28f.js'
      - 'tests/weather/test_index_cosmos_cutover_m28g.js'
      - 'tests/weather/test_index_earth_cutover_m28h.js'
      - 'tests/weather/test_index_tools_cutover_m28i.js'
      - 'tests/weather/test_index_media_catalog_cutover_m28j.js'
      - 'docs/weather-subjects-m28j-media-catalog-parity-handoff.md'
      - '.github/workflows/weather-subjects-media-catalog-parity-m28j.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M28-J exact MEDIA WATCH and CREATORS cutover with WebEngine safe mode gate
        run: node --test tests/weather/test_index_media_catalog_cutover_m28j.js
      - name: Original MEDIA D1 and NEWS map requirements still hold
        run: |
          node --test tests/weather/test_media_subject_panels_d1.js
          node --test tests/weather/test_media_earth_mentions_cutover_m28a.js
          node --test tests/weather/test_media_news_feed_map_companion_m28b.js
      - name: Preserve original all-milestone source and provenance records
        run: |
          node --test tests/weather/test_index_subject_cutover_m28d.js
          node --test tests/weather/test_index_radio_cutover_m28e.js
          node --test tests/weather/test_index_weather_cutover_m28f.js
          node --test tests/weather/test_index_cosmos_cutover_m28g.js
          node --test tests/weather/test_index_earth_cutover_m28h.js
          node --test tests/weather/test_index_tools_cutover_m28i.js
      - name: M0/M1 contract and native workspace remain unchanged
        run: |
          node --test tests/weather/subject_navigation_contract.test.js
          node --test tests/weather/subject_navigation_browser.test.js
          node --test tests/weather/test_workspace_landing_w1.js
          node --test tests/weather/test_workspace_left_rail_w1r.js
