name: Prism native Canvas rendering

on:
  pull_request:
    paths:
      - 'components/PrismButton.qml'
      - 'components/PrismBorderGlow.qml'
      - 'components/PrismTextGlow.qml'
      - 'components/PrismArtwork.js'
      - 'tests/components/prism_native/**'
      - '.github/workflows/prism-native-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: fedora:44
    steps:
      - name: Install coherent Fedora Quickshell and Qt runtime
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf copr enable -y errornointernet/quickshell
          dnf install -y --setopt=install_weak_deps=False quickshell qt6-qtdeclarative qt6-qt5compat qt6-qtbase-gui qt6-qtsvg git coreutils python3 python3-pillow
          quickshell --version
          quickshell --version | grep '0.3.'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe actual Prism Canvas pixels and composited button
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_LOGGING_RULES: 'qml.debug=true;qml.info=true;qml.warning=true;qml.critical=true'
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"; rm -f /tmp/prism-render-composite.png /tmp/prism-render-idle.png /tmp/prism-render-spectrum.png' EXIT
          export HOME="$work/home" XDG_CONFIG_HOME="$work/config" XDG_CACHE_HOME="$work/cache" XDG_DATA_HOME="$work/data" XDG_RUNTIME_DIR="$work/run"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          scene="$work/config/prism"
          mkdir -p "$scene/components"
          cp tests/components/prism_native/shell.qml "$scene/shell.qml"
          for name in ActionButton PrismButton PrismBorderGlow PrismTextGlow PrismArtwork Colors VisualLanguage GohuText SafeDropShadow; do
            if [ "$name" = PrismArtwork ]; then ext=js; else ext=qml; fi
            cp "components/$name.$ext" "$scene/components/$name.$ext"
          done
          grep -E '^(singleton Colors|singleton VisualLanguage|ActionButton|PrismButton|PrismBorderGlow|PrismTextGlow|GohuText|SafeDropShadow) ' components/qmldir > "$scene/components/qmldir"
          timeout --signal=TERM --kill-after=3s 18s quickshell --path "$scene/shell.qml" --no-color --log-rules "$QT_LOGGING_RULES" 2>&1 | tee "$work/output"
          grep -q PRISM_NATIVE_DONE "$work/output"
          if grep -q PRISM_NATIVE_FAIL "$work/output"; then exit 1; fi
          python3 - <<'PY'
          from PIL import Image
          with Image.open("/tmp/prism-render-idle.png") as idle_file, \
               Image.open("/tmp/prism-render-composite.png") as selected_file:
              idle=idle_file.convert("RGBA")
              selected=selected_file.convert("RGBA")
              if idle.size != (50,50) or selected.size != (50,50):
                  raise SystemExit("Prism button geometry changed across states")
              pixels=list(selected.getdata())
              colorful=sum(1 for r,g,b,a in pixels if a>100 and
                           max(r,g,b)-min(r,g,b)>28)
              differences=sum(1 for a,b in zip(idle.getdata(),pixels)
                              if max(abs(int(a[k])-int(b[k])) for k in range(3))>=4)
              print(f"PRISM_NATIVE_IMAGE_COMPOSITE {selected.size} "
                    f"center={selected.getpixel((25,25))} colorful={colorful} "
                    f"state_changed_pixels={differences}",flush=True)
              if colorful<40 or differences<25:
                  raise SystemExit("Prism glow failed to brighten in the actual native composite")
          with Image.open("/tmp/prism-render-spectrum.png") as original:
              im=original.convert("RGB")
              # Sample 3px outside the edge at each corner, rather than
              # the white edge itself. A monochrome halo must fail.
              corners=[im.getpixel((9,9)),im.getpixel((140,9)),
                       im.getpixel((9,190)),im.getpixel((140,190))]
              tl,tr,bl,br=corners
              print("PRISM_NATIVE_SPECTRUM_CORNERS",corners,flush=True)
              if not (tl[1]>tl[0]+8 and tl[2]>tl[0]+8 and
                      tr[0]>tr[1]+8 and tr[2]>tr[1]+8 and
                      bl[0]>bl[1]+8 and bl[1]>bl[2]+8 and
                      br[1]>br[0]+8 and br[2]>br[0]+8):
                  raise SystemExit("Prism rectangular halo missing or spectral corner orientation wrong")
              # Interior glyph halo: exclude border and white lettering.
              text_pixels=list(im.crop((30,85,120,115)).getdata())
              colorful=sum(1 for r,g,b in text_pixels
                           if max(r,g,b)-min(r,g,b)>35 and max(r,g,b)>65)
              print("PRISM_NATIVE_TEXT_HALO",colorful,flush=True)
              if colorful<20:
                  raise SystemExit("Spectral text halo did not render")
          PY
