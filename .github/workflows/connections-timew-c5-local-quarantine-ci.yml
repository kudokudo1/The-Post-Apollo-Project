name: Connections TimeW C5 local history nonpromotion (deny-only)
on:
  pull_request:
    paths:
      - "tests/connections/timew/TimeWC5LocalHistoryQuarantineReference.py"
      - "tests/connections/timew/test_timew_c5_local_history_quarantine.py"
      - "docs/connections/timew-c5-local-to-protected-genesis-quarantine.md"
      - ".github/workflows/connections-timew-c5-local-quarantine-ci.yml"
  workflow_dispatch:
jobs:
  quarantine-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Historical C5 local authority must never be promoted
        run: python3 -B -I tests/connections/timew/test_timew_c5_local_history_quarantine.py
      - name: Inherited DOC 5 spend-before-effect fixture refusals
        run: python3 -B -I tests/connections/timew/test_timew_c5_spend_fence_reference.py
      - name: Inherited DOC 5 provider-neutral external custody refusal
        run: python3 -B -I tests/connections/timew/test_timew_c5_custodian_boundary_reference.py
      - name: Inherited DOC 5 exact selected-window review shadow
        run: python3 -B -I tests/connections/timew/test_timew_c5_review_shadow_reference.py
