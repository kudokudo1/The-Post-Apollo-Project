name: Connections C3e-to-C4b local challenge signed-denial shadow (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eC4bLocalDenialShadowCI.py'
      - 'tests/connections/test_connections_c3e_c4b_local_denial_shadow.py'
      - '.github/workflows/connections-c3e-c4b-local-denial-shadow-ci.yml'
      - 'docs/connections-c3e-c4b-local-denial-shadow-ci.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-challenge-signed-denial-still-protected-hold:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin synthetic Ed25519 receipt dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Refuse production writes, new signer, protocol or entitlement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eC4bLocalDenialShadowCI.py \
            tests/connections/test_connections_c3e_c4b_local_denial_shadow.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path("tests/connections/c3e_release_trust/C3eC4bLocalDenialShadowCI.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          for forbidden in ("sqlite3.connect(", "socket.socket(", "subprocess.run(",
                            "Ed25519PrivateKey", '"productionAuthority": True',
                            '"credentialActionsEnabled": True',
                            '"safeToRetry": True'):
              assert forbidden not in src, forbidden
          for expected in ("C3eStorageIndependentTrustBoundary.py",
                           "c4b_raw_challenge_evidence_candidate_ci.py",
                           "protected.protected_required_status()",
                           "local.lookup_terminal_outcome(local_challenge)",
                           '"safeToRetry": False',
                           "C3E_C4B_SHADOW_NO_INDEPENDENT_CUSTODY_OR_PRODUCTION"):
              assert expected in src, expected
          assert "readonly property bool credentialActionsEnabled: false" in broker
          print("C3E_C4B_SHADOW_CI_ONLY // NO_PRODUCTION_OR_NEW_SIGNER")
          PY
      - name: Test 20 signed denial and local SQLite rollback trust gaps
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "$(command -v python3)" -B \
            tests/connections/test_connections_c3e_c4b_local_denial_shadow.py
          echo "C3E_C4B_SIGNED_DENIAL_LOCAL_BRIDGE_HOLD // NO_CUSTODIAN"
      - name: Preserve relevant DOC 1 and DOC 2 security regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/test_connections_c3e_custodian_cutover_negative.py
          python3 -B -I tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py
          python3 -B tests/connections/identity_silverblue/test_c4b_raw_challenge_evidence_candidate_ci.py
          python3 -B tests/connections/identity_silverblue/test_controller_challenge_ci.py
          for test in \
            tests/connections/test_connections_c3e_local_process_sigkill_recovery.py \
            tests/connections/test_connections_c3e_storage_independent_trust_boundary.py \
            tests/connections/test_connections_c3e_local_development_history_ledger.py
          do
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              "$(command -v python3)" -B "$test"
          done
          echo "C3E_C4B_SHADOW_HOLD // NO_REMOTE_ROOT_NO_SAFE_RETRY"
