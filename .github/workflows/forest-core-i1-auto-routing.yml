name: Forest Core I1 AUTO Routing CI
on:
  pull_request:
    paths:
      - 'scripts/forest/model_form_routing_i1.py'
      - 'scripts/forest/MODEL_FORM_ROUTING_I1.md'
      - 'tests/forest/test_model_form_routing_i1.py'
      - 'scripts/forest/shared_context_b6r1.py'
      - 'scripts/forest/resource_governor_p1.py'
      - '.github/workflows/forest-core-i1-auto-routing.yml'
permissions:
  contents: read
jobs:
  auto-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: AUTO routing policy
        run: python3 -B -m unittest discover -s tests/forest -p 'test_model_form_routing_i1.py' -v
      - name: R1 shared context
        run: python3 -B -m unittest discover -s tests/forest -p 'test_shared_context_b6r1.py' -v
      - name: P1 resource governor
        run: python3 -B -m unittest discover -s tests/forest -p 'test_resource_governor_p1.py' -v
      - name: Compile
        run: python3 -m py_compile scripts/forest/model_form_routing_i1.py tests/forest/test_model_form_routing_i1.py
