name: Media Headless Controller Contracts

on:
  pull_request:
    paths:
      - "widgets/MediaDeckW.qml"
      - "modules/Mediaplayer.qml"
      - "modules/mediaplayer-cava.conf"
      - "tests/media/test_media_dock_performance.cjs"
      - "services/media/MediaDockMpdStatus.js"
      - "tests/media/test_media_dock_mpd_status.cjs"
      - "widgets/MediaDeckBrowserControls.qml"
      - "services/media/HeadlessMediaController.qml"
      - "tests/media/test_headless_deck_bridge.cjs"
      - "scripts/media/headless_mpd.py"
      - "scripts/media/youtube_catalog.py"
      - "scripts/media/direct_stream_source.py"
      - "scripts/media/radio_browser_catalog.py"
      - "tests/media/test_radio_browser_catalog.py"
      - "scripts/media/media_controller.py"
      - "scripts/media/media_intent_store.py"
      - "scripts/media/mpd_audio_probe.py"
      - "scripts/media/native_pipewire_evidence.py"
      - "scripts/media/media_controller_server.py"
      - "scripts/media/media_controller_cli.py"
      - "tests/media/test_headless_controller.py"
      - "tests/media/test_youtube_catalog.py"
      - "tests/media/test_direct_stream_source.py"
      - "tests/media/test_media_intent_store.py"
      - "tests/media/test_mpd_audio_probe.py"
      - "tests/media/test_native_pipewire_evidence.py"
      - ".github/workflows/media-headless-controller.yml"
  workflow_dispatch:

jobs:
  pure-controller-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax and Unix-socket/source/backend contract tests
        run: |
          python3 -m py_compile \
            scripts/media/headless_mpd.py \
            scripts/media/youtube_catalog.py \
            scripts/media/direct_stream_source.py \
            scripts/media/radio_browser_catalog.py \
            scripts/media/media_controller.py \
            scripts/media/media_intent_store.py \
            scripts/media/mpd_audio_probe.py \
            scripts/media/native_pipewire_evidence.py \
            scripts/media/media_controller_server.py \
            scripts/media/media_controller_cli.py \
            tests/media/test_headless_controller.py \
            tests/media/test_youtube_catalog.py \
            tests/media/test_direct_stream_source.py \
            tests/media/test_radio_browser_catalog.py \
            tests/media/test_media_intent_store.py \
            tests/media/test_mpd_audio_probe.py \
            tests/media/test_native_pipewire_evidence.py
          python3 -m unittest discover \
            -s tests/media -p 'test_*.py' -v
      - name: Hi-Fi deck source and ownership safety contracts
        run: node --test tests/media/test_headless_deck_bridge.cjs
      - name: Validate existing MPD dock status parser
        run: node --test tests/media/test_media_dock_mpd_status.cjs
      - name: Guard Media dock spectrum render budget
        run: node --test tests/media/test_media_dock_performance.cjs
