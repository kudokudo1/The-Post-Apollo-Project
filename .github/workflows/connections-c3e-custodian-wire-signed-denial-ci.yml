name: Connections C3e real local signed denial wire remains untrusted (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eCustodianWireDenialCI.py'
      - 'tests/connections/test_connections_c3e_custodian_wire_signed_denial.py'
      - '.github/workflows/connections-c3e-custodian-wire-signed-denial-ci.yml'
      - 'docs/connections-c3e-custodian-wire-signed-denial-ci.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-candidate-over-real-process-still-hold:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin original development-only signature verifier dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: No live signer, service, enrolled trust root, or credential actions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eCustodianWireDenialCI.py \
            tests/connections/test_connections_c3e_custodian_wire_signed_denial.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("tests/connections/c3e_release_trust/C3eCustodianWireDenialCI.py").read_text()
          b=Path("services/connections/ConnectionsBroker.qml").read_text()
          for forbidden in ("Ed25519PrivateKey", "socket.socket(",
                            "sqlite3.connect(", "subprocess.run(", "os.system(",
                            '"productionSignInAllowed": True', '"safeToRetry": True'):
              assert forbidden not in s, forbidden
          for required in ("C3eSignedCustodianCandidateCI.py",
                           "receiver.recvmsg(MAX_PACKET + 1, 512)",
                           "_discard_ancillary(ancillary)",
                           "C.inspect_ci_only(",
                           "HOLD_UNENROLLED_TEST_KEY_NO_TERMINAL_SETTLEMENT",
                           "C3E_WIRE_NO_INDEPENDENT_CUSTODIAN_OR_PRODUCTION_SIGNIN"):
              assert required in s, required
          # The old implementation leaked a received SCM_RIGHTS fd when
          # recvmsg() returned an empty payload. Keep cleanup ordered
          # immediately after recvmsg and before the EOF refusal.
          assert s.index("    _discard_ancillary(ancillary)\n    if not data:") > s.index("receiver.recvmsg(MAX_PACKET + 1, 512)")
          tests=Path("tests/connections/test_connections_c3e_custodian_wire_signed_denial.py").read_text()
          assert "test_31_empty_packet_with_real_scm_rights_closes_fd_before_unknown" in tests
          assert "test_32_linux_empty_seqpacket_actually_delivers_rights" in tests
          assert "readonly property bool credentialActionsEnabled: false" in b
          print("C3E_SIGNED_WIRE_CI // NO_PROTECTED_CUSTODIAN")
          PY
      - name: 32 real signed-denial and empty-payload SCM_RIGHTS cleanup cases
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "$(command -v python3)" -B \
            tests/connections/test_connections_c3e_custodian_wire_signed_denial.py
          echo "C3E_SIGNED_WIRE // NO_ACK_NEVER_AUTORETRY"
      - name: Preserve original 233 signed-candidate and C3e rollback regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I tests/connections/test_connections_c3e_custodian_cutover_negative.py
          python3 -B -I tests/connections/test_connections_c3e_ipc_receipt_non_evidence.py
          for test in \
            tests/connections/test_connections_c3e_signed_custodian_candidate_ci.py \
            tests/connections/test_connections_c3e_split_store_rollback_witness.py \
            tests/connections/test_connections_c3e_split_brain_witness_dispute.py \
            tests/connections/test_connections_c3e_identity_packet_origin_nonadmission.py \
            tests/connections/test_connections_c3e_storage_independent_trust_boundary.py \
            tests/connections/test_connections_c3e_local_process_sigkill_recovery.py \
            tests/connections/test_connections_c3e_local_development_history_ledger.py
          do
            sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
              "$(command -v python3)" -B "$test"
          done
          echo "C3E_SIGNED_WIRE_HOLD // NO_OPERATOR_ENROLLED_ROOT_OR_SIGNIN"
