name: "PX / sa"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Repository smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report execution identity
        run: |
          echo "repo=$GITHUB_REPOSITORY"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "PX workflow is alive."
