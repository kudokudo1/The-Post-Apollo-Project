name: Zellij update-review header plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/updates/zellij/**"
      - ".github/workflows/update-review-header.yml"
      - "tests/notifications/test_update_review_wasm.py"
  pull_request:
    paths:
      - "scripts/updates/zellij/**"
      - ".github/workflows/update-review-header.yml"
      - "tests/notifications/test_update_review_wasm.py"

permissions:
  contents: read

jobs:
  wasm:
    name: Build isolated Zellij WASM close header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Test close hitbox logic
        run: cargo test --manifest-path scripts/updates/zellij/update-review-header/Cargo.toml
      - name: Build WebAssembly plugin for Zellij 0.45
        run: cargo build --release --target wasm32-wasip1 --manifest-path scripts/updates/zellij/update-review-header/Cargo.toml
      - name: Check compiled Zellij WASI command entry point
        run: python3 tests/notifications/test_update_review_wasm.py
      - uses: actions/upload-artifact@v4
        with:
          name: post-apollo-update-header-wasm
          path: scripts/updates/zellij/update-review-header/target/wasm32-wasip1/release/post_apollo_update_header.wasm
          if-no-files-found: error
