name: EnergyProgress native laboratory
on:
  pull_request:
    paths:
      - 'components/EnergyProgress*'
      - 'components/qmldir'
      - 'widgets/GitHubPullRequestControlView.qml'
      - 'tests/fixtures/EnergyProgress*'
      - 'tests/components/energy-progress-motion.test.cjs'
      - '.github/workflows/energy-progress-native.yml'
      - 'scripts/components/run_energy_progress_lab.sh'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 12
    steps:
      - name: Install disposable native runtime
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf copr enable -y errornointernet/quickshell
          dnf install -y --setopt=install_weak_deps=False quickshell qt6-qtdeclarative qt6-qt5compat xorg-x11-server-Xvfb xorg-x11-xauth nodejs git mesa-dri-drivers dbus-daemon
      - uses: actions/checkout@v4
      - name: Motion contracts
        run: node --test tests/components/energy-progress-motion.test.cjs
      - name: Native QML smoke
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d -t energy-native.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/run" "$work/data" "$work/cache" "$work/config"
          export HOME="$work/home"
          export XDG_RUNTIME_DIR="$work/run"
          export XDG_DATA_HOME="$work/data"
          export XDG_CACHE_HOME="$work/cache"
          export XDG_CONFIG_HOME="$work/config"
          export QT_QPA_PLATFORM=xcb
          export QT_QUICK_BACKEND=software
          export QT_LOGGING_RULES=qml.debug=true
          timeout --kill-after=3s 30s xvfb-run -a bash scripts/components/run_energy_progress_lab.sh native 2>&1 | tee /tmp/energy-native.log
          grep -F 'ENERGY_NATIVE_PASS' /tmp/energy-native.log
          if grep -E 'ENERGY_NATIVE_FAIL|ReferenceError:|TypeError:|SyntaxError:|Binding loop detected|Failed to load configuration' /tmp/energy-native.log; then exit 1; fi
      - name: Native paint cadence under 32-button load
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d -t energy-load.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/run" "$work/data" "$work/cache" "$work/config"
          export HOME="$work/home"
          export XDG_RUNTIME_DIR="$work/run"
          export XDG_DATA_HOME="$work/data"
          export XDG_CACHE_HOME="$work/cache"
          export XDG_CONFIG_HOME="$work/config"
          export QT_QPA_PLATFORM=xcb
          export QT_QUICK_BACKEND=software
          export QT_LOGGING_RULES=qml.debug=true
          { time -p timeout --kill-after=3s 45s xvfb-run -a bash scripts/components/run_energy_progress_lab.sh load; } 2>&1 | tee /tmp/energy-load.log
          grep -F 'DEBUG qml: ENERGY_LOAD_PASS' /tmp/energy-load.log
          test "$(grep -c 'DEBUG qml: ENERGY_LOAD_SAMPLE ' /tmp/energy-load.log)" -eq 5
          if grep -E 'ENERGY_LOAD_FAIL|ReferenceError:|TypeError:|SyntaxError:|Binding loop detected|Failed to load configuration' /tmp/energy-load.log; then exit 1; fi
      - name: Native queue layout and action custody
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d -t queue-native.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/run" "$work/data" "$work/cache" "$work/config"
          export HOME="$work/home" XDG_RUNTIME_DIR="$work/run" XDG_DATA_HOME="$work/data"
          export XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config"
          export QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software QT_LOGGING_RULES=qml.debug=true
          timeout --kill-after=3s 30s xvfb-run -a bash scripts/components/run_energy_progress_lab.sh queue 2>&1 | tee /tmp/queue-native.log
          grep -F 'QUEUE_NATIVE_PASS' /tmp/queue-native.log
          if grep -E 'QUEUE_NATIVE_FAIL|ReferenceError:|TypeError:|SyntaxError:|Binding loop detected|Failed to load configuration' /tmp/queue-native.log; then exit 1; fi
