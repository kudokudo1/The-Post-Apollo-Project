name: Apollo Hub live bridge contracts

on:
  pull_request:
    paths:
      - "services/hub/ApolloHubLiveBridge.qml"
      - "services/hub/ApolloHubAppsPolicy.js"
      - "tests/hub/test_apollo_hub_apps_policy.cjs"
      - "tests/hub/test_apollo_hub_apps_bridge.py"
      - "services/hub/ApolloHubUptimeSource.qml"
      - "services/hub/ApolloHubUptimePolicy.js"
      - "tests/hub/test_apollo_hub_uptime_bridge.py"
      - "tests/hub/test_apollo_hub_uptime_policy.cjs"
      - "services/hub/ApolloHubMediaPolicy.js"
      - "services/media/HeadlessMediaController.qml"
      - "services/media/MprisPlaybackAdapter.qml"
      - "tests/hub/test_apollo_hub_media_bridge.py"
      - "tests/hub/test_apollo_hub_media_policy.cjs"
      - "services/hub/ApolloHubNetworkPolicy.js"
      - "modules/Network.qml"
      - "tests/hub/test_apollo_hub_network_policy.cjs"
      - "tests/hub/test_apollo_hub_network_bridge.py"
      - "shell.qml"
      - "widgets/ApolloHubW.qml"
      - "widgets/hub/ApolloHubTile.qml"
      - "tests/hub/test_apollo_hub_shell_weather_wiring.py"
      - "services/hub/ApolloHubSystemPolicy.js"
      - "services/system/SystemTelemetry.qml"
      - "tests/hub/test_apollo_hub_system_bridge.py"
      - "tests/hub/test_apollo_hub_system_policy.cjs"
      - "services/hub/qmldir"
      - "services/weather/WeatherDockPolicy.js"
      - "services/weather/WeatherService.qml"
      - "tests/hub/test_apollo_hub_live_bridge.py"
      - ".github/workflows/apollo-hub-live-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "services/hub/ApolloHubLiveBridge.qml"
      - "services/hub/ApolloHubAppsPolicy.js"
      - "tests/hub/test_apollo_hub_apps_policy.cjs"
      - "tests/hub/test_apollo_hub_apps_bridge.py"
      - "services/hub/ApolloHubUptimeSource.qml"
      - "services/hub/ApolloHubUptimePolicy.js"
      - "tests/hub/test_apollo_hub_uptime_bridge.py"
      - "tests/hub/test_apollo_hub_uptime_policy.cjs"
      - "services/hub/ApolloHubMediaPolicy.js"
      - "services/media/HeadlessMediaController.qml"
      - "services/media/MprisPlaybackAdapter.qml"
      - "tests/hub/test_apollo_hub_media_bridge.py"
      - "tests/hub/test_apollo_hub_media_policy.cjs"
      - "services/hub/ApolloHubNetworkPolicy.js"
      - "modules/Network.qml"
      - "tests/hub/test_apollo_hub_network_policy.cjs"
      - "tests/hub/test_apollo_hub_network_bridge.py"
      - "shell.qml"
      - "widgets/ApolloHubW.qml"
      - "widgets/hub/ApolloHubTile.qml"
      - "tests/hub/test_apollo_hub_shell_weather_wiring.py"
      - "services/hub/ApolloHubSystemPolicy.js"
      - "services/system/SystemTelemetry.qml"
      - "tests/hub/test_apollo_hub_system_bridge.py"
      - "tests/hub/test_apollo_hub_system_policy.cjs"
      - "services/hub/qmldir"
      - "services/weather/WeatherDockPolicy.js"
      - "services/weather/WeatherService.qml"
      - "tests/hub/test_apollo_hub_live_bridge.py"
      - ".github/workflows/apollo-hub-live-bridge.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only shared Weather bridge
        run: python3 tests/hub/test_apollo_hub_live_bridge.py
      - name: Verify W1 shared-shell Weather binding
        run: python3 tests/hub/test_apollo_hub_shell_weather_wiring.py
      - name: Verify shared CPU++ telemetry bridge
        run: python3 tests/hub/test_apollo_hub_system_bridge.py
      - name: Exercise CPU++ projection and freshness states
        run: node tests/hub/test_apollo_hub_system_policy.cjs
      - name: Verify B3 passive Network bridge
        run: python3 tests/hub/test_apollo_hub_network_bridge.py
      - name: Exercise network link and unknown states
        run: node tests/hub/test_apollo_hub_network_policy.cjs
      - name: Guard B4 Media bridge against duplicate controllers
        run: python3 tests/hub/test_apollo_hub_media_bridge.py
      - name: Exercise B4 MPD/MPRIS snapshot semantics
        run: node tests/hub/test_apollo_hub_media_policy.cjs
      - name: Guard B5 uptime source isolation and read-only access
        run: python3 tests/hub/test_apollo_hub_uptime_bridge.py
      - name: Exercise B5 uptime parser and aging states
        run: node tests/hub/test_apollo_hub_uptime_policy.cjs
      - name: Guard B6 native app index and no-launch boundary
        run: python3 tests/hub/test_apollo_hub_apps_bridge.py
      - name: Exercise B6 application search and safe normalization
        run: node tests/hub/test_apollo_hub_apps_policy.cjs
