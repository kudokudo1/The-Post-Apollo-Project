# CAVA visualizer for the Post-Apollo taskbar music module.
# Uses the PulseAudio-compatible PipeWire monitor, so it also works with
# CAVA builds that lack native PipeWire input. Does not alter ~/.config/cava.
[general]
bars = 16
framerate = 30
autosens = 1
sleep_timer = 0

[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
