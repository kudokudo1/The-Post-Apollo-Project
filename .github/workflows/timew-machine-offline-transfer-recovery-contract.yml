name: TimeW MACHINE offline transfer and recovery evidence contract

on:
  pull_request:
    paths:
      - "services/time/MachineBraveOfflineTransferRecoveryContract.py"
      - "tests/timew/test_machine_offline_transfer_recovery_contract.py"
      - "docs/timew-machine-offline-transfer-recovery-contract.md"
      - ".github/workflows/timew-machine-offline-transfer-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic source and destination snapshots, replay and unsigned receipt refusal
        run: python3 -B -I tests/timew/test_machine_offline_transfer_recovery_contract.py
      - name: Existing vault and deny-only request intent regressions
        run: |
          python3 -B -I tests/timew/test_machine_brave_sealed_vault.py
          python3 -B -I tests/timew/test_machine_brave_archive_admission_intent.py
          python3 -B -I tests/timew/test_machine_brave_absolute_frame_deadline.py
