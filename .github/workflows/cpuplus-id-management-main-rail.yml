  workflow_dispatch:

permissions:
  contents: read

jobs:
  id-management:
    name: CPU++ fixed rail / three-bay ID mode contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CPU++ ID mode and regressions
        run: |
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_id_management_main_mode.py' -v
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_id_management_editor.py' -v
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_identity_host_context_v0.py' -v
          node tests/messaging/test_identity_center_ipc_viewer_v0.cjs
          python3 -m unittest discover -s tests/identity -p 'test_identity_display_reader_cli_v0.py' -v
          python3 -m unittest discover -s tests/identity -p 'test_desktop_context_projection_v0.py' -v
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_id_organization_links.py' -v
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_social_local_management_bays.py' -v
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_social_relationship_editors.py' -v
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_social_link_modifiers.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_identity_center_inline_modifiers_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_branch_locations_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_unit_locations_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_functional_reporting_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_identity_center_archive_tray_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_archived_permanent_removal_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_organizations.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_org_structure_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_portfolios_v1.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_org_links_v1.py' -v
          node tests/messaging/test_social_identity_policy.cjs
          python3 -m unittest discover -s tests/messaging -p 'test_social_identity_store.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_account_details.py' -v
          python3 tests/components/test_cpuplus_settings_mode_contracts.py
          python3 -m unittest discover -s tests/cpuplus -p 'test_cpuplus_time_three_bay_contract.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_identity_center_settings_sections.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_social_settings_workspace.py' -v
