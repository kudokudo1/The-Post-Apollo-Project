name: Connections C3e protected operator witness enrollment preflight (CI only)

on:
  pull_request:
    paths:
      - 'tests/connections/c3e_release_trust/C3eOperatorWitnessEnrollmentPreflight.py'
      - 'tests/connections/test_connections_c3e_operator_witness_enrollment_preflight.py'
      - 'tests/connections/c3e_release_trust/C3eAFSignedRoleEnrollment.py'
      - 'tests/connections/c3e_release_trust/C3eZReleaseBoundHostEvidence.py'
      - '.github/workflows/connections-c3e-operator-witness-enrollment-preflight.yml'
      - 'docs/connections-c3e-operator-witness-enrollment-preflight.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-root-signature-preflight-deny-only:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned disposable test signature dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Source-scope, signed parent reuse and hard-denied production boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/c3e_release_trust/C3eOperatorWitnessEnrollmentPreflight.py \
            tests/connections/test_connections_c3e_operator_witness_enrollment_preflight.py
          python3 - <<'PY'
          from pathlib import Path
          source=Path("tests/connections/c3e_release_trust/C3eOperatorWitnessEnrollmentPreflight.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          host=Path("services/connections/ConnectionsRequestStatus.qml").read_text()
          assert "AF.verify_signed_enrollment_ci_only(" in source
          assert "Ed25519PrivateKey" not in source
          for forbidden in ("sqlite3.connect(", "socket.socket(", "subprocess.run(",
                            "credentialActionsEnabled\\\": True", "productionAuthority\\\": True"):
              assert forbidden not in source, forbidden
          for field in ("operatorEnrollmentRootCustodyVerified",
                        "independentWitnessSigningKeyCustodyVerified",
                        "independentReleaseFloorCustodyVerified",
                        "externalChallengeIssuerVerified",
                        "externalRollbackResistanceVerified",
                        "realInstalledHostAuthenticated",
                        "authenticatedActiveSeatVerified",
                        "c5HumanConsentVerified",
                        "hostAuthenticated","canApprove",
                        "canBeginSignIn","credentialActionsEnabled",
                        "productionAuthority"):
              assert '"'+field+'": False' in source, field
          assert "readonly property bool credentialActionsEnabled: false" in broker
          assert "readonly property bool hostAuthenticated: false" in host
          print("C3E_OPERATOR_HOLD // NO_KEYS_ENROLLED_OR_NATIVE_AUTHORITY")
          PY
      - name: 22 adversarial root pin, revocation, key role and floor cases
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true "$(command -v python3)" -B \
            tests/connections/test_connections_c3e_operator_witness_enrollment_preflight.py
          echo "C3E_OPERATOR_PASS // 22_NO_GRANT_PREFLIGHT_CASES"
      - name: Original C3e-AF signed role enrollment and C3e-Z regression
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env GITHUB_ACTIONS=true "$(command -v python3)" -B \
            tests/connections/test_connections_c3eaf_signed_role_enrollment.py
          sudo -n env GITHUB_ACTIONS=true "$(command -v python3)" -B \
            tests/connections/test_connections_c3ez_release_bound_host_evidence.py
          echo "C3E_OPERATOR_HOLD // ROOT_LOCAL_CHALLENGE_NOT_INDEPENDENT_CUSTODY"
