name: Weather Station MAGICK G1 observational reference subject

on:
  pull_request:
    paths:
      - 'widgets/weather/StationMagickSubjectPanelPolicy.js'
      - 'widgets/weather/StationMagickSubjectPane.qml'
      - 'widgets/weather/StationSubjectNavigator.qml'
      - 'widgets/weather/WeatherStationW.qml'
      - 'tests/weather/test_magick_subject_panels_g1.js'
      - '.github/workflows/weather-magick-subject-panels-g1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  magick-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all prior subject routes and MAGICK evidence labels
        run: |
          node --test tests/weather/subject_navigation_contract.test.js
          node --test tests/weather/subject_navigation_browser.test.js
          node --test tests/weather/test_weather_subject_panels_m2a.js
          node --test tests/weather/test_weather_subject_panels_m2b.js
          node --test tests/weather/test_cosmos_subject_panels_c1.js
          node --test tests/weather/test_earth_subject_panels_e1.js
          node --test tests/weather/test_media_subject_panels_d1.js
          node --test tests/weather/test_magick_subject_panels_g1.js
