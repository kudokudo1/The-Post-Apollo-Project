name: FinanceW Budget Simple M1 selector contracts

on:
  pull_request:
    paths:
      - "widgets/FinanceW.qml"
      - "tests/finance/test_finance_budget_experience_mode_contracts.py"
      - "tests/finance/test_finance_control_sections_contracts.py"
      - ".github/workflows/financew-budget-simple-m1.yml"
  push:
    branches: [main]
    paths:
      - "widgets/FinanceW.qml"
      - "tests/finance/test_finance_budget_experience_mode_contracts.py"
      - "tests/finance/test_finance_control_sections_contracts.py"
      - ".github/workflows/financew-budget-simple-m1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-contracts:
    name: Simple / Advanced mode switch and existing Budget routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Simple mode source and protected transitions
        run: python3 -B tests/finance/test_finance_budget_experience_mode_contracts.py
      - name: Verify existing Budget section and transaction routes
        run: python3 -B tests/finance/test_finance_control_sections_contracts.py
      - name: Verify read-only Budget data/source boundaries
        run: python3 -B tests/finance/test_finance_budget_ui_contracts.py
