name: Forest Runtime R5 connected public conversation
on:
  pull_request:
    paths:
      - 'scripts/forest/runtime_public_conversation_r5.py'
      - 'scripts/forest/runtime_public_delivery_r4b.py'
      - 'scripts/forest/runtime_events_r3.py'
      - 'scripts/forest/history_public_fixture_m4.py'
      - 'scripts/forest/RUNTIME_PUBLIC_CONVERSATION_R5.md'
      - 'tests/forest/test_runtime_public_conversation_r5.py'
      - 'tests/forest/ui22b_runtime_status_harness.qml'
      - 'widgets/forest/ui2/PublicRuntimeStatusView.qml'
      - 'widgets/forest/ui2/PublicRuntimeStatusDisplay.js'
      - '.github/workflows/forest-runtime-public-conversation-r5.yml'
permissions:
  contents: read
jobs:
  connected-public-conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - run: python -m pip install "PySide6>=6.10,<6.12"
      - run: python -B tests/forest/test_runtime_public_conversation_r5.py
      - run: python -B tests/forest/test_ui22b_runtime_status_qt.py
