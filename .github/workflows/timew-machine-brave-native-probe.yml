name: TimeW MACHINE opt-in Brave native messaging probe

on:
  pull_request:
    paths:
      - "integrations/machine/brave-topology/**"
      - "services/time/MachineBraveNativeProbe.py"
      - "services/time/MachineBraveNativeManifest.py"
      - "tests/timew/test_machine_brave_native_probe.py"
      - "tests/timew/test_machine_brave_native_probe.mjs"
      - "tests/timew/test_machine_brave_native_manifest.py"
      - "tests/timew/test_machine_brave_native_probe_contract.py"
      - "tests/timew/test_machine_brave_topology_contract.py"
      - "docs/timew-machine-brave-native-probe.md"
      - ".github/workflows/timew-machine-brave-native-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Forbid hidden browser permission or OS restore authority
        run: python3 -B -I tests/timew/test_machine_brave_native_probe_contract.py
      - name: Test actual isolated native messaging frame parser and rejects
        run: python3 -B -I tests/timew/test_machine_brave_native_probe.py
      - name: Test challenge and fail-closed browser reply validation
        run: node tests/timew/test_machine_brave_native_probe.mjs
      - name: Test exact extension-origin manifest preview without installing
        run: python3 -B -I tests/timew/test_machine_brave_native_manifest.py
      - name: Preserve original zero-required permission inventory and M2 identity tests
        run: |
          python3 -B -I tests/timew/test_machine_brave_topology_contract.py
          node tests/timew/test_machine_brave_topology.mjs
          python3 -B -I tests/timew/test_machine_brave_focus_witness.py
          python3 -B -I tests/timew/test_machine_brave_focus_witness_contract.py
          python3 -B -I tests/timew/test_machine_adapter_handshake_trial.py
          python3 -B -I tests/timew/test_machine_checkpoint_store.py
