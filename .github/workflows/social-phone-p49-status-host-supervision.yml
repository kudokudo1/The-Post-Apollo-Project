name: Social PHONE P49 Supervised Status-Only Host (Linux Subprocess)

on:
  pull_request:
    paths:
      - 'services/phone/PhonePersonalStatusHostP49.py'
      - 'services/phone/systemd/post-apollo-phone-personal-status-ci.service'
      - 'tests/phone/test_phone_personal_status_host_p49.py'
      - 'MODEL/contracts/social-phone-p49-status-host-supervision-v0.md'
      - '.github/workflows/social-phone-p49-status-host-supervision.yml'
  push:
    branches: [main]
    paths:
      - 'services/phone/PhonePersonalStatusHostP49.py'
      - 'services/phone/systemd/post-apollo-phone-personal-status-ci.service'
      - 'tests/phone/test_phone_personal_status_host_p49.py'
      - 'MODEL/contracts/social-phone-p49-status-host-supervision-v0.md'
      - '.github/workflows/social-phone-p49-status-host-supervision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-subprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile status launcher and dependency modules
        run: |
          python -m py_compile services/phone/PhonePersonalStatusHostP49.py
          python -m py_compile services/phone/PhonePersonalHostSocketP47.py
          python -m py_compile services/phone/PhonePersonalPeerEvidenceP48.py
      - name: Actual isolated Python process launch, socket and shutdown
        run: python -m unittest discover -s tests/phone -p 'test_phone_personal_status_host_p49.py' -v
      - name: Real kernel socket and peer-process regressions
        run: |
          python -m unittest discover -s tests/phone -p 'test_phone_personal_host_socket_p47.py' -v
          python -m unittest discover -s tests/phone -p 'test_phone_personal_peer_evidence_p48.py' -v
      - name: Original mainline recovery and locked editor remain true
        run: |
          python -m unittest discover -s tests/messaging -p 'test_social_phone_mainline_completeness_p45.py' -v
          python -m unittest discover -s tests/messaging -p 'test_social_phone_transaction_review_p44.py' -v
