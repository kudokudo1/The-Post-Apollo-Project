name: Finance Research M10d native anchored directory read probe

on:
  pull_request:
    paths:
      - "scripts/finance/research_directory_anchor.mjs"
      - "tests/finance/test_research_m10d_directory_anchor.mjs"
      - "scripts/finance/RESEARCH_INVESTIGATIONS_M10D_README.md"
      - ".github/workflows/finance-research-dirfd-m10d.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-directory-anchor:
    name: Fedora Linux fd-anchored no-write race and symlink checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: fedora:44
    steps:
      - name: Install native Linux Node runtime
        run: |
          dnf install -y --setopt=install_weak_deps=False nodejs git
          node --version
      - uses: actions/checkout@v4
      - name: Test anchored read and prior M10b/M10c safety
        run: |
          set -eu
          node --check scripts/finance/research_directory_anchor.mjs
          node tests/finance/test_research_m10d_directory_anchor.mjs
          node tests/finance/test_research_m10c_write_intent.mjs
          node tests/finance/test_research_m10b_recovery_probe.mjs
