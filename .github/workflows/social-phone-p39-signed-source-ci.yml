name: Social PHONE P39 Signed Source Bytes (DENY ONLY)

on:
  pull_request:
    paths:
      - 'services/phone/PhonePersonalSignedSourceP39.py'
      - 'services/phone/PhonePersonalSignedTrustP37.py'
      - 'services/identity/silverblue_release_candidate_v1.py'
      - 'tests/connections/c3e_release_trust/C3eYSignedHostChallenge.py'
      - 'tests/connections/c3e_release_trust/C3eXIdentityRunningEvidence.py'
      - 'tests/phone/test_phone_personal_signed_source_p39.py'
      - 'MODEL/contracts/social-phone-p39-signed-source-ci-v0.md'
      - '.github/workflows/social-phone-p39-signed-source-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/phone/PhonePersonalSignedSourceP39.py'
      - 'services/phone/PhonePersonalSignedTrustP37.py'
      - 'tests/phone/test_phone_personal_signed_source_p39.py'
      - '.github/workflows/social-phone-p39-signed-source-ci.yml'

permissions:
  contents: read

jobs:
  verify-fake-signed-source-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crypto only on disposable CI runner
        run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - name: Compile PHONE-side source verifier and tests
        run: |
          python -m py_compile services/phone/PhonePersonalSignedSourceP39.py tests/phone/test_phone_personal_signed_source_p39.py
      - name: Verify original C4b/C3e-Y signed format against exact P37 request
        run: |
          python -m unittest discover -s tests/phone -p 'test_phone_personal_signed_source_p39.py' -v
      - name: Recheck P37 signed receipts and P38 external-format contract
        run: |
          python -m unittest discover -s tests/phone -p 'test_phone_personal_signed_trust_p37.py' -v
          python -m unittest discover -s tests/phone -p 'test_phone_personal_upstream_handoff_p38.py' -v
      - name: Recheck P36 protected fixture and P35 encrypted vault
        run: |
          python -m unittest discover -s tests/phone -p 'test_phone_personal_host_gate_p36.py' -v
          python -m unittest discover -s tests/phone -p 'test_phone_personal_contact_vault.py' -v
