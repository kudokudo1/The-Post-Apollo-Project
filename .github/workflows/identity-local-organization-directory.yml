name: Identity local organization directory
on:
  pull_request:
    paths:
      - 'services/social/SocialOrganizationDirectory*'
      - 'services/social/qmldir'
      - 'widgets/messanger/IdentityCenterLocalOrganizationEditor.qml'
      - 'widgets/messanger/IdentityCenterSettingsSections.qml'
      - 'widgets/messanger/AppSelector.qml'
      - 'tests/messaging/test_social_local_organizations.py'
      - '.github/workflows/identity-local-organization-directory.yml'
      - 'MODEL/contracts/identity-center-local-organization-directory-v1.md'
  workflow_dispatch:
jobs:
  private-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Local directory and Settings regression
        run: |
          python3 -m unittest discover -s tests/messaging -p 'test_social_local_organizations.py' -v
          python3 -m unittest discover -s tests/messaging -p 'test_identity_center_settings_sections.py' -v
