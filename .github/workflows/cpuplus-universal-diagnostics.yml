name: CPU++ universal diagnostics
on:
  pull_request:
    paths:
      - "services/diagnostics/DiagnosticWidgetLifecycle.js"
      - "services/diagnostics/DiagnosticWidgetLifecycleAdapter.qml"
      - "services/diagnostics/qmldir"
      - "services/diagnostics/CpuPlusDiagnostics.qml"
      - "services/diagnostics/DiagnosticWorkflowCatalog.js"
      - "services/diagnostics/DiagnosticWorkflowStore.qml"
      - "scripts/cpuplus_diagnostic_workflow_catalog.py"
      - "widgets/cpuplus/CpuPlusLifecycleDumpPopup.qml"
      - "shell.qml"
      - "tests/cpuplus/test_diagnostic_widget_lifecycle_native.py"
      - "tests/cpuplus/fixtures/DiagnosticWidgetLifecycleNative.qml"
      - "tests/cpuplus/test_diagnostic_widget_lifecycle.cjs"
      - ".github/workflows/cpuplus-universal-diagnostics.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/cpuplus/test_diagnostic_widget_lifecycle.cjs
  native-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt runtime
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates python3 coreutils quickshell=0.3.2-1 qt6-qpa-plugins qml6-module-qtquick qml6-module-qtqml
      - uses: actions/checkout@v4
      - name: Verify passive adapter with disposable widget flags
        env:
          POST_APOLLO_MEMORY_UI_SMOKE: CI_DISPOSABLE_ONLY
        run: python3 -B tests/cpuplus/test_diagnostic_widget_lifecycle_native.py
