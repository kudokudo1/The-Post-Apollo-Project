name: TimeW foundation source contracts

on:
  pull_request:
    paths:
      - "widgets/TimeW.qml"
      - "widgets/TimeZonePicker.qml"
      - "services/time/WorldClockPolicy.js"
      - "services/time/TimeZoneConverter.py"
      - "services/time/TimeArithmetic.py"
      - "services/time/TimeConverterFormat.js"
      - "services/time/WorldZoneSearch.js"
      - "timew_click_preview.qml"
      - "modules/Clock.qml"
      - "shell.qml"
      - "tests/timew/**"
      - ".github/workflows/timew-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "widgets/TimeW.qml"
      - "widgets/TimeZonePicker.qml"
      - "services/time/WorldClockPolicy.js"
      - "services/time/TimeZoneConverter.py"
      - "services/time/TimeArithmetic.py"
      - "services/time/TimeConverterFormat.js"
      - "services/time/WorldZoneSearch.js"
      - "modules/Clock.qml"
      - "shell.qml"
      - "tests/timew/**"
      - ".github/workflows/timew-foundation.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check TimeW first-milestone source contracts
        run: python3 tests/timew/test_timew_foundation_contracts.py
      - name: Verify world-clock timezone and DST projections
        run: node tests/timew/test_world_clock_policy.cjs
      - name: Verify searchable world-zone catalog
        run: node tests/timew/test_world_zone_search.cjs
      - name: Verify time-zone conversions and DST edge cases
        run: python3 -B -I tests/timew/test_zone_converter.py
      - name: Verify CALC independent 12/24 input and output formatting
        run: node tests/timew/test_time_converter_format.cjs
      - name: Verify elapsed time arithmetic and DST behavior
        run: python3 -B -I tests/timew/test_time_arithmetic.py
