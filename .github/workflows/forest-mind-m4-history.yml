name: Forest Mind M4 Public History CI
on:
  pull_request:
    paths:
      - 'scripts/forest/history_public_fixture_m4.py'
      - 'scripts/forest/layered_hot_context_m7a.py'
      - 'scripts/forest/task_sticky_context_m7b.py'
      - 'scripts/forest/TASK_STICKY_CONTEXT_M7C.md'
      - 'tests/forest/test_task_sticky_context_m7c.py'
      - 'scripts/forest/TASK_STICKY_CONTEXT_M7B.md'
      - 'tests/forest/test_task_sticky_context_m7b.py'
      - 'scripts/forest/MIND_ORIGINAL_RECOVERY_M7.md'
      - 'tests/forest/test_layered_hot_context_m7a.py'
      - 'tests/forest/test_mind_version_resolution_m7d.py'
      - 'tests/forest/test_mind_final_composition_m7e.py'
      - 'tests/forest/test_mind_versioned_sticky_m7f.py'
      - 'scripts/forest/MIND_RETRIEVAL_M7D_CONTRACT.md'
      - 'scripts/forest/HISTORY_PUBLIC_FIXTURE_M4.md'
      - 'scripts/forest/context_first_tree_m2.py'
      - 'scripts/forest/session_journal_v0.py'
      - 'scripts/forest/shared_context_b6r1.py'
      - 'tests/forest/test_history_public_fixture_m4.py'
      - 'tests/forest/test_mind_integrated_continuity_m6.py'
      - 'scripts/forest/turn_bridge_b3.py'
      - 'scripts/forest/first_light_trial_host.py'
      - 'scripts/forest/ollama_chat_transport.py'
      - 'scripts/forest/ollama_inventory.py'
      - 'tests/forest/test_ollama_chat_transport.py'
      - 'scripts/forest/runtime_stop_control_r2.py'
      - 'scripts/forest/runtime_events_r3.py'
      - 'scripts/forest/runtime_public_status_r4.py'
      - 'scripts/forest/runtime_public_delivery_r4b.py'
      - 'scripts/forest/runtime_public_conversation_r5.py'
      - 'scripts/forest/capability_registry_b6r2.py'
      - 'widgets/forest/ui2/PublicHistoryDisplay.js'
      - 'tests/forest/test_ui23b_history_controller.js'
      - 'tests/forest/ui2_m4_public_fixture.py'
      - '.github/workflows/forest-mind-m4-history.yml'
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: M4 history and reopening
        run: python3 -B -m unittest discover -s tests/forest -p 'test_history_public_fixture_m4.py' -v
      - name: M2 context regression
        run: python3 -B -m unittest discover -s tests/forest -p 'test_context_first_tree_m2.py' -v
      - name: B1 journal regression
        run: python3 -B -m unittest discover -s tests/forest -p 'test_session_journal_v0.py' -v
      - name: UI2 public display regression
        run: node tests/forest/test_ui21_public_display.js
      - name: M6 integrated durable continuity, R4a status, R5 paging and UI2 projection
        run: python3 -B -m unittest discover -s tests/forest -p 'test_mind_integrated_continuity_m6.py' -v
      - name: UI2 history controller regression
        run: node tests/forest/test_ui23b_history_controller.js
      - name: M7a recovered layered Hot Context
        run: python3 -B -m unittest discover -s tests/forest -p 'test_layered_hot_context_m7a.py' -v
      - name: M7b recovered task-sticky context
        run: python3 -B -m unittest discover -s tests/forest -p 'test_task_sticky_context_m7b.py' -v

      - name: M7c selective derived shedding
        run: python3 -B -m unittest discover -s tests/forest -p 'test_task_sticky_context_m7c.py' -v

      - name: M7d-b fixed public exact-version resolution
        run: python3 -B -m unittest discover -s tests/forest -p 'test_mind_version_resolution_m7d.py' -v

      - name: M7e-b fixed public composition and framing
        run: python3 -B -m unittest discover -s tests/forest -p 'test_mind_final_composition_m7e.py' -v

      - name: M7f-b version-aware fixed public sticky cache
        run: python3 -B -m unittest discover -s tests/forest -p 'test_mind_versioned_sticky_m7f.py' -v
