name: TASKS dock contracts

on:
  pull_request:
    paths:
      - "shell.qml"
      - "modules/Tasks.qml"
      - "widgets/TasksW.qml"
      - "tests/components/test_tasks_dock_contracts.py"
      - "tests/components/test_tasks_menu_contracts.py"
      - "tests/components/test_tasks_m3_shared_editor_contracts.py"
      - "widgets/tasks/TaskDetailsPane.qml"
      - "widgets/tasks/TaskDateSegment.qml"
      - "widgets/tasks/TaskDateSegments.js"
      - "widgets/hub/ApolloHubTodoMini.qml"
      - "tests/tasks/test_task_details_ui_contracts.py"
      - "tests/tasks/test_task_date_segments.cjs"
      - "widgets/tasks/TaskTodayPane.qml"
      - "widgets/tasks/TaskTodayPolicy.js"
      - "tests/tasks/test_task_today_policy.cjs"
      - "tests/tasks/test_task_today_ui_contracts.py"
      - "widgets/tasks/TaskProjectsPane.qml"
      - "tests/tasks/test_task_projects_ui_contracts.py"
      - "tests/tasks/test_task_project_management_ui.py"
      - "widgets/tasks/TaskProjectsAck.js"
      - "tests/tasks/test_task_projects_ack.cjs"
      - "widgets/tasks/TaskGitHubMappingPolicy.js"
      - "widgets/tasks/TaskSyncPreviewPane.qml"
      - "tests/tasks/test_task_github_mapping_policy.cjs"
      - "tests/tasks/test_task_github_mapping_ui_contracts.py"
      - "widgets/tasks/TaskSyncConnectionsPane.qml"
      - "tests/tasks/test_task_sync_connections_ui_contracts.py"
      - ".github/workflows/tasks-dock-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "shell.qml"
      - "modules/Tasks.qml"
      - "widgets/TasksW.qml"
      - "tests/components/test_tasks_dock_contracts.py"
      - "tests/components/test_tasks_menu_contracts.py"
      - "tests/components/test_tasks_m3_shared_editor_contracts.py"
      - "widgets/tasks/TaskDetailsPane.qml"
      - "widgets/tasks/TaskDateSegment.qml"
      - "widgets/tasks/TaskDateSegments.js"
      - "widgets/hub/ApolloHubTodoMini.qml"
      - "tests/tasks/test_task_details_ui_contracts.py"
      - "tests/tasks/test_task_date_segments.cjs"
      - "widgets/tasks/TaskTodayPane.qml"
      - "widgets/tasks/TaskTodayPolicy.js"
      - "tests/tasks/test_task_today_policy.cjs"
      - "tests/tasks/test_task_today_ui_contracts.py"
      - "widgets/tasks/TaskProjectsPane.qml"
      - "tests/tasks/test_task_projects_ui_contracts.py"
      - "tests/tasks/test_task_project_management_ui.py"
      - "widgets/tasks/TaskProjectsAck.js"
      - "tests/tasks/test_task_projects_ack.cjs"
      - "widgets/tasks/TaskGitHubMappingPolicy.js"
      - "widgets/tasks/TaskSyncPreviewPane.qml"
      - "tests/tasks/test_task_github_mapping_policy.cjs"
      - "tests/tasks/test_task_github_mapping_ui_contracts.py"
      - "widgets/tasks/TaskSyncConnectionsPane.qml"
      - "tests/tasks/test_task_sync_connections_ui_contracts.py"
      - ".github/workflows/tasks-dock-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TASKS dock source contracts
        run: python3 tests/components/test_tasks_dock_contracts.py
      - name: Validate TASKS basic menu source contracts
        run: python3 tests/components/test_tasks_menu_contracts.py
      - name: Validate TASKS shared editor/store source contracts
        run: python3 tests/components/test_tasks_m3_shared_editor_contracts.py
      - name: Validate TASKS v2 details UI and single-writer contracts
        run: python3 tests/tasks/test_task_details_ui_contracts.py
      - name: Validate three-part Gregorian due date steppers
        run: node tests/tasks/test_task_date_segments.cjs
      - name: Validate TODAY pure due-date projection
        run: node tests/tasks/test_task_today_policy.cjs
      - name: Validate TODAY menu wiring and single-store boundary
        run: python3 tests/tasks/test_task_today_ui_contracts.py
      - name: Validate PROJECTS group UI and shared-store boundary
        run: python3 tests/tasks/test_task_projects_ui_contracts.py
      - name: Validate PROJECTS rename and deletion UI safety
        run: python3 tests/tasks/test_task_project_management_ui.py
      - name: Validate PROJECTS save acknowledgement ordering
        run: node tests/tasks/test_task_projects_ack.cjs
      - name: Validate GitHub mapping preview never guesses identities
        run: node tests/tasks/test_task_github_mapping_policy.cjs
      - name: Validate SYNC mapping preview has no external side effects
        run: python3 tests/tasks/test_task_github_mapping_ui_contracts.py
      - name: Validate SYNC Connections and safe navigation to GitW
        run: python3 tests/tasks/test_task_sync_connections_ui_contracts.py
