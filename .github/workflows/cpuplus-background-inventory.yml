name: CPU++ DOC 3 background workload inventory
on:
  pull_request:
    paths:
      - "scripts/cpuplus_qml_workload_inventory.py"
      - "tests/cpuplus/test_qml_workload_inventory.py"
      - ".github/workflows/cpuplus-background-inventory.yml"
      - "EVIDENCE/cpuplus-background-workload-inventory-20261124.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify lexical markers and fail-closed inventory
        run: python3 -B tests/cpuplus/test_qml_workload_inventory.py
      - name: Inventory tracked QML source
        run: |
          python3 -B scripts/cpuplus_qml_workload_inventory.py
          python3 -B scripts/cpuplus_qml_workload_inventory.py --detail > /tmp/post-apollo-qml-workload.json
      - uses: actions/upload-artifact@v4
        with:
          name: qml-workload-inventory
          path: /tmp/post-apollo-qml-workload.json
          retention-days: 7
