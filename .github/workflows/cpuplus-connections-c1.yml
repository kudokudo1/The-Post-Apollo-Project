name: CPU++ C1 shared Connections inventory

on:
  pull_request:
    paths:
      - "services/connections/**"
      - "widgets/CpuPlusW.qml"
      - "widgets/cpuplus/CpuPlusSettingsConnections*.qml"
      - "tests/cpuplus/test_cpuplus_connections_c1.js"
      - "tests/cpuplus/fixtures/C1ConnectionsNative.qml"
      - "scripts/cpuplus/verify_connections_native_c1.sh"
      - ".github/workflows/cpuplus-connections-c1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify read-only Social/Notifications/Weather connection seams
        run: node tests/cpuplus/test_cpuplus_connections_c1.js
      - name: Preserve current CPU++ TIME owner and three-bay structure
        run: |
          python3 tests/cpuplus/test_cpuplus_time_settings_contract.py
          python3 tests/cpuplus/test_cpuplus_time_three_bay_contract.py
      - name: Preserve independent Social writer contracts
        run: |
          python3 -m py_compile services/social/SocialAccountDetails.py

  native-connections:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    timeout-minutes: 15
    steps:
      - name: Install Fedora Quickshell and isolated pointer runner
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf copr enable -y errornointernet/quickshell
          dnf install -y --setopt=install_weak_deps=False \
            quickshell qt6-qtdeclarative qt6-qt5compat qt6-qtbase-gui \
            qt6-qtsvg nodejs python3 coreutils findutils \
            xdotool xorg-x11-server-Xvfb
          quickshell --version
          quickshell --version | grep '0.3.'
      - uses: actions/checkout@v4
      - name: Actual native Connections selection and Social reload
        run: bash scripts/cpuplus/verify_connections_native_c1.sh
