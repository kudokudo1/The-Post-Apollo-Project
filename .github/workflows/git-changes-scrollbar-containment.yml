name: Git CHANGES scrollbar containment

on:
  workflow_dispatch:
  push:
    paths:
      - "widgets/GitChangesView.qml"
      - "components/NeonScrollBar.qml"
      - "tests/components/test_git_changes_scrollbar_containment.py"
      - ".github/workflows/git-changes-scrollbar-containment.yml"
  pull_request:
    paths:
      - "widgets/GitChangesView.qml"
      - "components/NeonScrollBar.qml"
      - "tests/components/test_git_changes_scrollbar_containment.py"
      - ".github/workflows/git-changes-scrollbar-containment.yml"

permissions:
  contents: read

jobs:
  containment:
    name: Seven CHANGES viewport-mounted star rails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify local mounting and viewport alignment
        run: python3 -B tests/components/test_git_changes_scrollbar_containment.py
