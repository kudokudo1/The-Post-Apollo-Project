name: CPU++ durable memory queue contract
on:
  pull_request:
    paths:
      - 'services/memory/memory_adjustment_queue.py'
      - 'tests/cpuplus_memory_queue_test.py'
      - 'services/memory/memory_queue_advisory.py'
      - 'tests/cpuplus_memory_queue_advisory_test.py'
      - 'services/memory/memory_queue_monitor.py'
      - 'tests/cpuplus_memory_queue_monitor_test.py'
      - 'services/memory/memory_queue_events.py'
      - 'tests/cpuplus_memory_queue_events_test.py'
      - 'services/memory/memory_queue_delivery.py'
      - 'services/memory/MemoryQueueNotificationAdapter.js'
      - 'tests/cpuplus_memory_queue_delivery_test.py'
      - 'tests/cpuplus_memory_queue_hub_adapter_test.js'
      - 'services/memory/memory_queue_history.py'
      - 'tests/cpuplus_memory_queue_history_test.py'
      - 'services/memory/QUEUE-M1C3B.md'
      - '.github/workflows/cpuplus-memory-queue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Durable intent tests (temporary SQLite fixtures only)
        run: python3 -B tests/cpuplus_memory_queue_test.py
      - name: Advisory lifecycle tests (no execution)
        run: python3 -B tests/cpuplus_memory_queue_advisory_test.py
      - name: Condition monitor lifecycle (fixtures only)
        run: python3 -B tests/cpuplus_memory_queue_monitor_test.py
      - name: Durable notification candidates (no Hub delivery)
        run: python3 -B tests/cpuplus_memory_queue_events_test.py
      - name: Durable one-attempt notification fence (fixtures only)
        run: python3 -B tests/cpuplus_memory_queue_delivery_test.py
      - name: Notification Hub adapter contract (fixture only)
        run: node tests/cpuplus_memory_queue_hub_adapter_test.js
      - name: Request history and unbound receipt evidence (fixtures only)
        run: python3 -B tests/cpuplus_memory_queue_history_test.py
