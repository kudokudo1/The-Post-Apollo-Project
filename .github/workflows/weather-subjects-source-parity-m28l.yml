name: Weather M28-L final three source rack and badge mappings

on:
  pull_request:
    paths:
      - 'widgets/weather/StationToolsSubjectPanelPolicy.js'
      - 'widgets/weather/StationToolsSubjectPane.qml'
      - 'widgets/weather/StationSubjectSourceBadgePolicy.js'
      - 'widgets/weather/StationSubjectNavigationPreviewPolicy.js'
      - 'widgets/weather/StationWorkspaceSurface.qml'
      - 'widgets/weather/StationEarthSubjectPane.qml'
      - 'widgets/weather/StationWeatherSubjectPane.qml'
      - 'widgets/weather/StationSubjectNavigator.qml'
      - 'widgets/weather/StationDiscovery.qml'
      - 'widgets/weather/WeatherStationW.qml'
      - 'tests/weather/test_index_sources_cutover_m28l.js'
      - 'tests/weather/test_index_home_cutover_m28k.js'
      - 'tests/weather/test_index_media_catalog_cutover_m28j.js'
      - 'tests/weather/test_index_tools_cutover_m28i.js'
      - 'tests/weather/test_index_cosmos_cutover_m28g.js'
      - 'tests/weather/test_index_weather_cutover_m28f.js'
      - 'tests/weather/test_index_earth_cutover_m28h.js'
      - 'docs/weather-subjects-m28l-source-rack-badge-handoff.md'
      - '.github/workflows/weather-subjects-source-parity-m28l.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M28-L original GROUND and MAP source racks and real header badge
        run: node --test tests/weather/test_index_sources_cutover_m28l.js
      - name: Preserve source health, runtime freshness and original map sources
        run: |
          node --test tests/weather/test_station_source_health.js
          node --test tests/weather/test_weather_live_runtime_m3.js
          node --test tests/weather/test_earth_subject_panels_e1.js
          node --test tests/weather/test_weather_subject_panels_m2a.js
          node --test tests/weather/test_tools_subject_panels_t1.js
      - name: Preserve exact M28-D through K source-migration milestones
        run: |
          node --test tests/weather/test_index_subject_cutover_m28d.js
          node --test tests/weather/test_index_radio_cutover_m28e.js
          node --test tests/weather/test_index_weather_cutover_m28f.js
          node --test tests/weather/test_index_cosmos_cutover_m28g.js
          node --test tests/weather/test_index_earth_cutover_m28h.js
          node --test tests/weather/test_index_tools_cutover_m28i.js
          node --test tests/weather/test_index_media_catalog_cutover_m28j.js
          node --test tests/weather/test_index_home_cutover_m28k.js
      - name: Preserve SUBJECTS W1 workspace and canonical M0/M1 route hierarchy
        run: |
          node --test tests/weather/subject_navigation_contract.test.js
          node --test tests/weather/subject_navigation_browser.test.js
          node --test tests/weather/test_workspace_landing_w1.js
          node --test tests/weather/test_workspace_left_rail_w1r.js
