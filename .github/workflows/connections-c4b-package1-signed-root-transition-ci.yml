name: Connections C4b Package 1 controller-root transition (deny-only CI)

on:
  pull_request:
    paths:
      - 'tests/connections/identity_silverblue/c4b_signed_trust_transition_ci.py'
      - 'tests/connections/identity_silverblue/test_c4b_signed_trust_transition_ci.py'
      - 'tests/connections/identity_silverblue/c4b_rotated_c3eaf_role_gate_ci.py'
      - 'tests/connections/identity_silverblue/test_c4b_rotated_c3eaf_role_gate_ci.py'
      - 'tests/connections/identity_silverblue/c4b_root_owned_controller_ledger_ci.py'
      - 'tests/connections/identity_silverblue/test_c4b_root_owned_controller_ledger_ci.py'
      - 'tests/connections/identity_silverblue/controller_owned_policy_intake_ci.py'
      - 'tests/connections/identity_silverblue/controller_pinned_enrollment_gate_ci.py'
      - 'tests/connections/identity_silverblue/c4b_c3eaf_enrollment_alignment_ci.py'
      - '.github/workflows/connections-c4b-package1-signed-root-transition-ci.yml'
      - 'docs/connections-c4b-package1-root-transition-contract.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c4b-root-rotation-and-custody-boundary:
    if: github.actor == 'kudokudo1' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin disposable Ed25519 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Require source-only, closed production permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tests/connections/identity_silverblue/c4b_signed_trust_transition_ci.py \
            tests/connections/identity_silverblue/test_c4b_signed_trust_transition_ci.py \
            tests/connections/identity_silverblue/c4b_rotated_c3eaf_role_gate_ci.py \
            tests/connections/identity_silverblue/test_c4b_rotated_c3eaf_role_gate_ci.py \
            tests/connections/identity_silverblue/c4b_root_owned_controller_ledger_ci.py \
            tests/connections/identity_silverblue/test_c4b_root_owned_controller_ledger_ci.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path("tests/connections/identity_silverblue/c4b_signed_trust_transition_ci.py").read_text()
          broker=Path("services/connections/ConnectionsBroker.qml").read_text()
          for expected in ("previous_root.verify(", "proposed_root.verify(",
                           "P.inspect_controller_owned_ci_only(",
                           "C4B_ROTATION_REVOCATION_ERASURE",
                           "C4B_ROTATION_RELEASE_FLOOR_DOWNGRADE",
                           "C4B_ROTATION_DUAL_ROOT_SIGNATURE_REFUSED"):
              assert expected in src, expected
          for flag in ("operatorControlledRootCustodyVerified",
                       "independentRotationAuthorityEnrolled",
                       "protectedTransitionHistoryVerified",
                       "externalRollbackResistanceVerified",
                       "independentHostKernelAndSeatWitnessVerified",
                       "c5HumanConsentVerified", "hostAuthenticated",
                       "canBeginSignIn", "credentialActionsEnabled",
                       "productionAuthority"):
              assert '"' + flag + '": False' in src, flag
          assert "readonly property bool credentialActionsEnabled: false" in broker
          assert "Ed25519PrivateKey.generate(" not in src
          print("C4B_PACKAGE1_HOLD // ROTATION_TEST_ONLY_NO_OPERATOR_ROOT_CUSTODY")
          PY
      - name: Full dual-root rotation, revocation and replay refusal package
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/connections/identity_silverblue/test_c4b_signed_trust_transition_ci.py
          python3 -B tests/connections/identity_silverblue/test_c4b_rotated_c3eaf_role_gate_ci.py
          echo "C4B_PACKAGE1_PASS // 48_SIGNED_ROTATION_C3E_ROLE_AND_REVOCATION_CASES"
      - name: Disposable Linux root UID isolation, protected cursor and one-use rotation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_ACTOR" = kudokudo1
          sudo -n test "$(sudo -n id -u)" -eq 0
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_ACTOR="$GITHUB_ACTOR" POST_APOLLO_C4B_P1_ROOT_LEDGER_TEST_ONLY=1 \
            "$(command -v python3)" -B \
            tests/connections/identity_silverblue/test_c4b_root_owned_controller_ledger_ci.py
          echo "C4B_PACKAGE1_PASS // 26_REAL_LINUX_ROOT_OWNED_CONTROLLER_LEDGER_CASES"
          echo "C4B_PACKAGE1_HOLD // CI_ROOT_NOT_OPERATOR_OR_HARDWARE_ROLLBACK_AUTHORITY"
      - name: Preserve full merged C4b signed enrollment and cross-role regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/connections/identity_silverblue/test_controller_owned_policy_intake_ci.py
          python3 -B tests/connections/identity_silverblue/test_controller_pinned_enrollment_gate_ci.py
          python3 -B tests/connections/identity_silverblue/test_c4b_c3eaf_enrollment_alignment_ci.py
          python3 -B tests/connections/identity_silverblue/test_controller_challenge_ci.py
          python3 -B tests/connections/identity_silverblue/test_runtime_receipt_binding_ci.py
          echo "C4B_PACKAGE1_HOLD // EXISTING_C3E_AND_C4B_TRUST_CONTRACTS_UNCHANGED"
