name: Weather COSMOS C12 Sun terminal composites
on:
  pull_request:
    paths:
      - 'widgets/weather/StationCosmosSunTerminalPane.qml'
      - 'widgets/weather/StationCosmosModePolicy.js'
      - 'widgets/weather/StationCosmosModesPane.qml'
      - 'widgets/weather/StationCosmosSubjectPanelPolicy.js'
      - 'widgets/weather/StationSubjectNavigationPolicy.js'
      - 'tests/weather/test_cosmos_c12_sun_terminal.js'
      - 'tests/weather/fixtures/C12SunTerminalNativeShell.qml'
      - '.github/workflows/weather-cosmos-c12-terminal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify C12 Sun terminal routing, source gates and original consumers
        run: |
          node --test \
            tests/weather/test_cosmos_c12_sun_terminal.js \
            tests/weather/test_cosmos_subject_panels_c1.js \
            tests/weather/test_cosmos_c5_empty_repair.js \
            tests/weather/test_cosmos_c6_solar.js \
            tests/weather/test_cosmos_sun_instruments_c5c.js \
            tests/weather/test_cosmos_c11_annual_wheels.js \
            tests/weather/subject_navigation_contract.test.js \
            tests/weather/test_index_cosmos_cutover_m28g.js
  native-viewport:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    timeout-minutes: 15
    steps:
      - name: Install disposable offscreen Quickshell
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git quickshell qt6-qpa-plugins qml6-module-qtquick-effects qml6-module-qt5compat-graphicaleffects coreutils findutils
      - uses: actions/checkout@v4
      - name: Verify Sun terminal geometry, source fields and detailed pages
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)"
          work="$(mktemp -d /tmp/cosmos-c12.XXXXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -m 700 "$work/home" "$work/runtime" "$work/cache" "$work/config"
          mkdir -p "$work/config/widgets" "$work/config/services" "$work/config/scripts"
          cp -a "$root/components" "$work/config/components"
          cp -a "$root/widgets/weather" "$work/config/widgets/weather"
          cp -a "$root/services/." "$work/config/services/"
          cp -a "$root/scripts/weather" "$work/config/scripts/weather"
          cp "$root/tests/weather/fixtures/C12SunTerminalNativeShell.qml" "$work/config/shell.qml"
          rc=0
          timeout --signal=TERM --kill-after=3s 20s env HOME="$work/home" XDG_RUNTIME_DIR="$work/runtime" XDG_CACHE_HOME="$work/cache" XDG_CONFIG_HOME="$work/config" QT_QPA_PLATFORM=offscreen quickshell --no-color -p "$work/config/shell.qml" >"$work/native.log" 2>&1 || rc=$?
          cat "$work/native.log"
          test "$rc" -eq 0
          grep -F "C12_SUN_PASS // LIVE POSITION ACTIVITY SOURCES DETAILS ZERO_SCROLL" "$work/native.log"
          if grep -E 'C12_SUN_FAIL|Failed to load configuration|StationCosmosSunTerminalPane.qml.*(TypeError|ReferenceError|Unable to assign)' "$work/native.log"; then exit 1; fi
