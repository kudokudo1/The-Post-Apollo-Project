name: CPU++ queue R3c host protocol
on:
  pull_request:
    paths:
      - 'services/memory/MemoryQueueSessionHost.js'
      - 'tests/cpuplus/test_queue_session_host.cjs'
      - 'services/memory/QUEUE-R3-HOST.md'
      - 'widgets/cpuplus/CpuPlusQueueConsumer.js'
      - 'widgets/cpuplus/CpuPlusQueuePresentation.js'
      - 'widgets/cpuplus/CpuPlusQueueHistory.js'
      - 'widgets/cpuplus/CpuPlusQueueRecovery.js'
      - '.github/workflows/cpuplus-queue-r3-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Host controller against actual checkout consumer and history/recovery parsers
        run: node tests/cpuplus/test_queue_session_host.cjs
