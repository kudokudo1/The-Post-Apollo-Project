name: Git map native jump latency
on:
  pull_request:
    paths:
      - "tests/git/test_git_map_latency_native.py"
      - "tests/git/fixtures/GitMapLatencyNative.qml"
      - ".github/workflows/git-map-native-latency.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: debian:unstable-slim
    steps:
      - name: Install native Quickshell and Qt
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 nodejs coreutils xvfb xauth xdotool libxcb-cursor0 quickshell=0.3.2-1 qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects qml6-module-qtquick-shapes \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtqml
      - uses: actions/checkout@v4
      - name: Compare old and batched page latency in same native viewport
        run: python3 -B tests/git/test_git_map_latency_native.py
        env:
          POST_APOLLO_GIT_MAP_SMOKE: CI_DISPOSABLE_ONLY
