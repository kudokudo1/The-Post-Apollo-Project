name: Identity Center Synthetic Request Boundary

on:
  pull_request:
    paths:
      - 'services/identity/**'
      - 'tests/identity/**'
      - 'MODEL/contracts/identity-center-request-boundary-v0.md'
      - '.github/workflows/identity-center-request-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'services/identity/**'
      - 'tests/identity/**'
      - 'MODEL/contracts/identity-center-request-boundary-v0.md'
      - '.github/workflows/identity-center-request-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-boundary:
    name: Synthetic session and tenant boundary (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile code and tests without contacting providers
        run: |
          python3 -m py_compile services/identity/synthetic_policy_v0.py
          python3 -m py_compile services/identity/synthetic_request_boundary_v0.py
          python3 -m py_compile tests/identity/test_synthetic_policy_v0.py
          python3 -m py_compile tests/identity/test_synthetic_request_boundary_v0.py
      - name: Execute all offline tenant, portfolio and identity-binding tests
        run: python3 -m unittest discover -s tests/identity -p 'test_*.py' -v
