name: CPU++ on-demand diagnostic controls
on:
  pull_request:
    paths:
      - "services/diagnostics/**"
      - "widgets/cpuplus/CpuPlusDiagnosticsPane.qml"
      - "widgets/cpuplus/CpuPlusMemoryActuatorPane.qml"
      - "tests/cpuplus/test_diagnostic_controls.cjs"
      - ".github/workflows/cpuplus-diagnostic-controls.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/cpuplus/test_diagnostic_controls.cjs
