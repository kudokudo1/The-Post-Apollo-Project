name: Clock BG1-B2B13 protected release-floor controller (trust hold)
on:
  push:
    paths:
      - "services/time/AlarmClockReleaseFloorController.py"
      - "services/time/BG1-ALARM-RELEASE-FLOOR-CONTROLLER.md"
      - "tests/time/test_clock_bg1_b2b13_release_floor_controller.py"
      - ".github/workflows/clock-bg1-b2b13-release-floor-controller.yml"
  pull_request:
    paths:
      - "services/time/AlarmClockReleaseFloorController.py"
      - "services/time/BG1-ALARM-RELEASE-FLOOR-CONTROLLER.md"
      - "tests/time/test_clock_bg1_b2b13_release_floor_controller.py"
      - ".github/workflows/clock-bg1-b2b13-release-floor-controller.yml"
permissions:
  contents: read
jobs:
  controller-floor-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Clock Ed25519 verifier dependency
        run: python3 -m pip install cryptography==46.0.4
      - name: Controller same-kernel-peer signed issuance and durable release floor
        run: python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b13_release_floor_controller.py' -v
      - name: Preserve B2B12 protected native session reader
        run: python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b12_protected_enrollment.py' -v
      - name: Preserve B2B9 signed origin and B2B10-B2B11 socket/session contracts
        run: |
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b9_installed_role_trust.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b10_native_supervisor.py' -v
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b11_durable_supervisor_sessions.py' -v
      - name: Preserve kernel peer and mounted alarm barrier
        run: |
          python3 -m unittest discover -s tests/time -p 'test_clock_bg1_b2b_peer_identity.py' -v
          node --test tests/time/test_clock_bg1_b2b6_mounted_barrier.cjs
      - name: Exact four-file Clock-only change boundary
        run: |
          python3 - <<'PY'
          import subprocess
          changes=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"],
              text=True).splitlines())
          expected={
              "services/time/AlarmClockReleaseFloorController.py",
              "services/time/BG1-ALARM-RELEASE-FLOOR-CONTROLLER.md",
              "tests/time/test_clock_bg1_b2b13_release_floor_controller.py",
              ".github/workflows/clock-bg1-b2b13-release-floor-controller.yml"}
          b2b14={
              ".github/workflows/clock-bg1-b2b10-native-supervisor.yml",
              ".github/workflows/clock-bg1-b2b11-supervisor-sessions.yml",
              ".github/workflows/clock-bg1-b2b12-protected-session.yml",
              ".github/workflows/clock-bg1-b2b13-release-floor-controller.yml",
              ".github/workflows/clock-bg1-b2b14-current-floor-admission.yml",
              "services/time/AlarmClockReleaseFloorController.py",
              "services/time/AlarmCurrentFloorWitness.py",
              "services/time/AlarmNativeClockSupervisor.py",
              "services/time/BG1-ALARM-CURRENT-FLOOR-ADMISSION.md",
              "tests/time/test_clock_bg1_b2b13_release_floor_controller.py",
              "tests/time/test_clock_bg1_b2b14_current_floor_admission.py"}
          b2b16={
              "services/time/AlarmFinalV2SourceWitness.py",
              "services/time/AlarmNativeClockSupervisor.py",
              "services/time/BG1-ALARM-NATIVE-FINAL-V2-WITNESS.md",
              "tests/time/test_clock_bg1_b2b16_native_final_v2_witness.py",
              ".github/workflows/clock-bg1-b2b16-native-final-v2.yml",
              ".github/workflows/clock-bg1-b2b10-native-supervisor.yml",
              ".github/workflows/clock-bg1-b2b11-supervisor-sessions.yml",
              ".github/workflows/clock-bg1-b2b12-protected-session.yml",
              ".github/workflows/clock-bg1-b2b13-release-floor-controller.yml",
              ".github/workflows/clock-bg1-b2b14-current-floor-admission.yml"}
          assert changes in (expected,b2b14,b2b16), f"Unapproved Clock change: {sorted(changes^(expected|b2b14|b2b16))}"
          print("No live Clock QML, installed signing key, Identity, Connections or BG2 changes: PASS")
          PY
