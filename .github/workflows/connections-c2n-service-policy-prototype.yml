name: Connections C2n protected service and D-Bus policy prototype (CI only)

on:
  pull_request:
    paths:
      - "services/connections/experiments/c2n_package/**"
      - "tests/connections/test_connections_c2n_policy_contract.py"
      - "tests/connections/test_connections_c2n_disposable_bus_policy.py"
      - "tests/connections/fixtures/C2nBusPolicyFixture.py"
      - ".github/workflows/connections-c2n-service-policy-prototype.yml"
      - "docs/connections-c2n-service-policy-prototype.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noninstalled-package-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install only isolated CI bus dependency
        run: |
          if ! command -v dbus-daemon >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y dbus-daemon
          fi
          python3 -m pip install --disable-pip-version-check --no-deps "dbus-next==0.2.3"
      - name: Audit noninstalled unit, system-bus rule and one-method XML interface
        run: timeout 30s python3 -B tests/connections/test_connections_c2n_policy_contract.py
      - name: Create disposable test principals on ephemeral GitHub runner only
        run: |
          sudo groupadd --system postapollo-connections
          sudo groupadd --system postapollo-status-readers
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin --gid postapollo-connections postapollo-connections
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin --gid nogroup --groups postapollo-status-readers c2n-reader-ci
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin --gid nogroup c2n-outsider-ci
          getent passwd postapollo-connections c2n-reader-ci c2n-outsider-ci
          getent group postapollo-status-readers
      - name: Actual isolated bus owner and reader policies across three OS UIDs
        env:
          POST_APOLLO_C2N_CI_CROSS_UID: "1"
        run: timeout 90s python3 -B tests/connections/test_connections_c2n_disposable_bus_policy.py
      - name: Previous C2m/C2l/C2k/C2j/C2i regressions
        run: |
          timeout 90s python3 -B tests/connections/test_connections_c2m_private_bus_pilot.py
          timeout 30s python3 -B tests/connections/test_connections_c2l_host_trust_boundary.py
          timeout 45s python3 -B tests/connections/test_connections_c2k_readonly_launcher.py
          timeout 35s python3 -B tests/connections/test_connections_c2j_host_status_server.py
          timeout 40s python3 -B tests/connections/test_connections_c2j_fake_host_socket.py
          timeout 35s python3 -B tests/connections/test_connections_c2i_host_inspection.py
      - name: CPU++ and provider permissions remain disabled
        run: |
          node tests/cpuplus/test_connections_host_inspection_c2i.js
          node tests/cpuplus/test_connections_status_c2g.js
          node tests/cpuplus/test_connections_broker_c2a.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("services/connections")
          for path in list(p.glob("*.qml")) + list(p.glob("*.js")) + [p/"qmldir"]:
              assert "org.postapollo.ConnectionsStatus1" not in path.read_text(), path
              assert "C2nBusPolicyFixture" not in path.read_text(), path
          assert "readonly property bool credentialActionsEnabled: false" in (p/"ConnectionsBroker.qml").read_text()
          assert "readonly property bool hostAuthenticated: false" in (p/"ConnectionsRequestStatus.qml").read_text()
          print("C2N_PASS // NONINSTALLED_SYSTEM_BUS_POLICY_REVIEW_ONLY")
          PY
